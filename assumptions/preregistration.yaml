           coverage_band, variants, primary_variant, min_cases, methods, prior_state,
           full_weight_cases, donor, held_out, decision, confidence]
    sha256: 4b23d3a44df092756d22058f30c8e7a296af0ce8260deabf857324b602476e24
    recorded_on: 2026-11-24
    logged_before_first_score: false
    note: >-
      Recorded after the first run. On 2026-11-24 the code's reading of the context
      variant other_origins was tightened (cases whose five target years overlap the
      scored case are no longer used); the key and its values here did not change, and
      the decision uses out_of_time only.
