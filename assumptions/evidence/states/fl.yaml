  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - 'Limits: an increase of up to 25% is phased in over two equal yearly steps; 25-50% over four steps;
    no increase above 50%; no more than one increase every four years; no retroactive increases.'
  - It caps increases; it does not cut existing fees. Later sessions amended s. 163.31801 again; this
    record covers the 2021 act only.
  - Credits for contributions toward the same type of public facility must be given, and the CFO of each
    charging body must file a yearly compliance affidavit.
