# Local zoning readings for states without a municipal law table (Vermont, Wyoming).
#
# Read by src/visionhousing/law/local_readings.py (rules in its docstring and in
# docs/modules/law.md, "Vermont and Wyoming local readings"). Pennsylvania's
# municipal rules are in municipal_rules.yaml instead.
#
# - documents: each text read, from the jurisdiction's own site only (never a
#   commercial code host). sha256 is the SHA-256 of the file as downloaded;
#   text_sha256 that of its text (visionhousing.law.text.pdf_text, white space
#   collapsed). Dates are the document's own, as printed; empty = not stated.
#   version_state: final, superseded (law until valid_until) or draft. kind:
#   bylaw, or guidance (the town's own explanation; never the law).
# - places: one per town, city or county. facts: one per topic, each with its
#   evidence (document, locator, offset in the text or PDF page, and a
#   verbatim quote of at most 300 characters, white space collapsed).
#   review: verified only when every quote was found again at its locator in
#   the saved copy by script (2026-11-26) and the value needs no further
#   check; draft otherwise (the open check says what); superseded for facts
#   from a superseded text. A place nobody could read is status: not_read,
#   with the reason, and has no facts.
# - districts (Vermont): what is known about a district, in the fields of
#   visionhousing.law.rights.District; null = not known. Water service is
#   unknown unless the bylaw itself says a district is served.
#
# Unknown stays unknown. Adoption, amendment and effective dates are kept
# apart; with no effective date a reading counts from its reviewed_on date.
# These readings enter only named variants (vt_missing_middle_town_bylaws,
# vt_parking_town_bylaws, wy_parking_local in variants.yaml), never a benchmark
# headline: the benchmarks read Vermont's state floor (statutory_rights.yaml)
# and the pack's mapped sewer share, not these rows. A variant places a reading
# on tracts by 2020 housing units: a town (10-digit geoid) through the pack's
# tract_municipalities, a Census place (7-digit geoid, Wyoming's cities)
# through tract_places.

