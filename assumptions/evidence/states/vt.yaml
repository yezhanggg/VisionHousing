- id: vt.24vsa4412_adu_duplex
  kind: policy
  state: VT
  jurisdiction: statewide
  policy_types:
  - adu
  - missing_middle
  title: 'Vermont 24 V.S.A. § 4412: ADU and duplex/fourplex equal treatment'
  citation: 24 V.S.A. § 4412(1)(D)-(F)
  url: https://legislature.vermont.gov/statutes/section/24/117/04412
  session: null
  bill: null
  enacted_date: null
  effective_dates:
  - date: 2026-07-01
    applies_to: Latest amendments to § 4412 (2025 Acts No. 155 § 4, No. 166 § 3, No. 179 § 9, Adj. Sess.)
  - date: 2028-01-01
    applies_to: 'Revised (1)(D): the four-unit rule does not apply where a district requires multiunit
      buildings to have more than four units (2025 No. 179 § 9a)'
  geographic_scope: All Vermont municipalities with bylaws. Duplexes must be allowed in every year-round
    residential district under the same dimensional rules as a single-unit home. Where sewer and water
    serve the district, buildings of up to four units must be allowed on a single-unit lot size. One ADU
    within or attached to a single-family home is a permitted use.
  exclusions:
  - Flood hazard and fluvial erosion bylaws under § 4424 may still limit ADUs
  - Towns may regulate short-term rentals separately
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - A home with an ADU gets the same review as one without. Converting an existing detached nonresidential
    building to an ADU cannot face stricter rules.
  - The statute page has one combined history note, so it does not show which act changed each subdivision.
    The section was first added in 2003. No ADU size cap appears in (1)(E).
  retrieved: 2026-11-24
  verified: true
  verification_note: legislature.vermont.gov statute page shows the current (1)(D)-(F) text, the version
    of (1)(D) effective 2028-01-01, and history entries with 2026-07-01 and 2028-01-01 effective dates.
  sources:
  - label: 24 V.S.A. § 4412 (Vermont Legislature)
    url: https://legislature.vermont.gov/statutes/section/24/117/04412
    official: true
  discovered_via: addendum
