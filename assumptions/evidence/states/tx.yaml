  enacted_date: 2025-06-22
  effective_dates:
  - date: 2026-09-01
    applies_to: Whole act
  geographic_scope: Cities with zoning must allow new HUD-code manufactured homes by right in at least one
    residential zone that is actually mapped. An application is deemed granted unless denied in writing within
    45 days.
  exclusions:
