- id: ut.hb462_2022_station_area_plans
  kind: policy
  state: UT
  jurisdiction: statewide
  policy_types:
  - tod
  - fees
  title: 'Utah HB 462 (2022): station area plans required around fixed-guideway transit stations'
  citation: Laws of Utah 2022, ch. 406 (HB 462); Utah Code 10-9a-403.1 (as enacted)
  url: https://le.utah.gov/~2022/bills/static/HB0462.html
  session: 2022 General Session
  bill: HB 462
  enacted_date: 2022-03-24
  effective_dates:
  - date: 2022-06-01
    applies_to: Whole act
  - date: 2025-12-31
    applies_to: Deadline for municipalities with existing fixed-guideway stations to adopt station area
      plans (cities with more than four stations - four by this date, then at least two more a year)
  geographic_scope: Municipalities with a fixed-guideway public transit station; station area is a half
    mile around a rail station platform or a quarter mile around a bus-only fixed-guideway station
  exclusions:
  - A municipality may skip some requirements for a station area by resolution finding them impracticable
    (existing development, entitlements, environment, market readiness)
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - A planning mandate tied to moderate-income housing reports and state funding priority, not a direct
    upzoning; the plan must promote housing near the station but sets no height or density floor.
  - Also bars impact fees on certain internal ADUs and requires some counties to propose housing and transit
    reinvestment zones (see ut.htrz).
