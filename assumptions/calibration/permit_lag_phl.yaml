  limits:
  - No application date is published, so application-to-issue time is not measured; any such lag built
    on this table is illustrative.
  - Building permits issued before the late-2019 change of record system carry no zoning link, so 2019
    and much of 2020 have few linked cases.
  - Censored zoning permits include projects that will never be built and building permits not linked
    to their zoning permit, so the cohort curve flattens and its upper quantiles are blank.
  - ADU-like permits are found by text and are very few.
