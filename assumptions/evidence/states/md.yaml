- id: md.ch590_591_2026_housing_certainty
  kind: policy
  state: MD
  jurisdiction: statewide
  policy_types:
  - permit_timing
  - fees
  title: 'Maryland Chapters 590 and 591 of 2026 (SB 325 / HB 548): Maryland Housing Certainty Act'
  citation: Md. Laws 2026, ch. 590 (SB 325) and ch. 591 (HB 548); new Land Use Article Title 12 and Local
    Government Article 20-128
  url: https://mgaleg.maryland.gov/mgawebsite/Legislation/Details/hb0548?ys=2026RS
  session: 2026 regular session
  bill: HB 548 / SB 325
  enacted_date: 2026-05-26
  effective_dates:
  - date: 2026-10-01
    applies_to: 'Whole act: housing applications judged only under the rules in force when a complete
      application was filed; 30-day completeness check (deemed complete after 35 days); vested right
      for the longer of 5 years or a local period after all approvals; impact fees and development excise
      taxes on residential projects not collected until construction is complete and occupancy requirements
      are met (or up to 30 days before final inspection)'
  geographic_scope: All counties and municipalities, and the Maryland-National Capital Park and Planning
    Commission, for housing development projects (new construction or substantial renovation of residential
    projects, including mixed-use with homes). The fee-timing rule applies to counties and municipalities
    that impose development impact fees, surcharges or excise taxes.
  exclusions:
  - Fee timing does not apply to an impact fee or excise tax that finances county debt incurred on or before
    January 1, 2026
  - A rezoning or zoning text amendment does not start the vesting clock
  - Local governments keep power over immediate health and safety threats and may still approve density
    increases by rezoning
  - Applies only where it does not conflict with other state or federal law
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - The fee rule changes when fees are paid, not how much. It lowers carrying cost, not the fee itself.
  - A locality may withhold or revoke an occupancy certificate if fees are not paid in a reasonable time.
  - SB 325 and HB 548 are cross-filed and both became chapters; one record covers both.
  retrieved: 2026-11-24
