# Documented local development fee schedules (Philadelphia, Pittsburgh).
#
# Read by visionhousing.features.fee_schedules. Feeds only the named variant
# `fees_documented_local` (assumptions/variants.yaml). The benchmark ($50,000
# per unit cut by 50%, ledger fees.fee_total_per_unit and fees.fee_cut_share)
# never reads this file and never changes because of it.
#
# Rules for this file:
#   - Every dollar amount is copied from a document the City or its water
#     utility publishes itself, fetched by script (robots.txt and terms checked
#     first, in a separate request). Each amount carries the document id, a
#     quote of at most 300 characters and the date it was read. The module's
#     check (python -m visionhousing.features.fee_schedules --check) fetches
#     the documents again into data/raw/fee_schedules/ and confirms every quote
#     is still in the text (white space and quote marks ignored).
#   - Every item states: category, basis (how the amount is worked out),
#     exemptions, payment stage, dollars year, payee and the service provided.
#   - status:
#       documented            the amount is in a document listed below
#       not_applicable        reviewed, and it does not apply to the prototype
#                             as defined below (the reason is given)
#       optional_excluded     the applicant may choose it; not counted
#       unknown_not_reviewed  not reviewed yet: stays unknown, never zero
#       unknown_refused       the only official copy refuses scripted access
#                             (robots.txt or HTTP 403); stays unknown
#     "Not listed" is never read as zero: an item stays unknown until a person
#     has reviewed the document that would list it.
#   - An application (filing) fee that the City credits to the final permit
#     fee names that permit in credited_to and is counted once: it adds only
#     what exceeds the permit fee it is credited to (normally nothing).
#   - Quantities that are not in any schedule (floor area, fixtures, sheets,
#     meter sizes) belong to the prototypes below. They are design
#     assumptions of the team, labelled as such. Where a reading could go two
#     ways (an ADU filed as a new accessory structure or as a new dwelling;
#     one shared water service or a new one) the prototype gives
#     {low: ..., high: ...} and the range keeps both readings.
#   - Construction cost (for the valuation-based electrical permit) comes from
#     the Assumption Ledger (cost_id), so its uncertainty flows into the range.
#   - Dollars are those of the schedule in force on the date read (dollars_year
#     on each item); no inflation adjustment is made.
#
# Methods: docs/methods/fees.md ("Documented local fee schedules");
# module: docs/modules/fee_schedules.md.

version: 1
id: fee_schedules_2026_11
read_on: 2026-11-26

# Which prototype prices each structure type of the fee reform's baseline.
structure_type_prototypes:
  units_1: single_family
  units_2: duplex
  units_3_4: fourplex
  units_5plus: apartment_20

# Fee categories every city is reviewed against. A city's documented total is
# used in the variant only when every core category is documented or
# reviewed and not applicable, and only where the city covers a whole county
# (the fee reform works county by county). Otherwise the county stays on the
# labelled judgement fees.pa_assumed_fee_per_unit_judgement.
categories:
  core: [zoning, building, trade, impact, water_connection, sewer_connection]
  secondary: [stormwater, right_of_way, planning, administrative]

# ----------------------------------------------------------------- prototypes
# A number, or {low, high} where the reading could go two ways. schedule_class:
# one_two_family (Philadelphia's "Residential (1 or 2 family)" column) or
# other (every other occupancy, which includes a 3+ unit building).
prototypes:
  adu:
    label: "Detached ADU on a single-family lot, 600 sq ft (the benchmark minimum)"
    units: 1
    floor_area_sqft: 600
    schedule_class: one_two_family
    cost_id: adu.hard_cost_per_sqft
    plumbing_fixtures: 7
    registers: 6
    sprinkler_heads: 0
    permits: {low: 1, high: 5}
    sheets_large: {low: 0, high: 6}
    dit_value_per_sqft: {low: 89.15, high: 94.75}
    stormwater_hours: 0
    note: >-
      Low reading: filed as a new accessory structure (and plumbing as an
      addition) that shares the house's water service and sewer lateral.
      High reading: filed as new construction of a dwelling with its own
      3/4-inch water service, 5/8-inch meter and 6-inch sewer connection.
  single_family:
    label: "New single-family home, 1,600 sq ft"
    units: 1
    floor_area_sqft: 1600
    schedule_class: one_two_family
    cost_id: missing_middle.hard_cost_per_sqft
    plumbing_fixtures: 12
    registers: 10
    sprinkler_heads: 0
    permits: {low: 1, high: 5}
    sheets_large: {low: 0, high: 10}
    dit_value_per_sqft: {low: 89.15, high: 94.75}
    stormwater_hours: 0
    note: "One 3/4-inch (low) or 1-inch (high) water service, one 5/8-inch meter, one 6-inch sewer connection."
  duplex:
    label: "New two-family building, 2 units x 1,000 sq ft"
    units: 2
    floor_area_sqft: 2000
    schedule_class: one_two_family
    cost_id: missing_middle.hard_cost_per_sqft
    plumbing_fixtures: 18
    registers: 14
    sprinkler_heads: 0
    permits: {low: 1, high: 5}
    sheets_large: {low: 0, high: 12}
    dit_value_per_sqft: {low: 89.15, high: 94.75}
    stormwater_hours: 0
    note: >-
      Low reading: one 1-inch water service with two meters and one sewer
      connection. High reading: two 3/4-inch services and a second sewer
      connection in the same trench.
  fourplex:
    label: "New four-unit building, 4 units x 1,000 sq ft, sprinklered (13R)"
    units: 4
    floor_area_sqft: 4000
    schedule_class: other
    cost_id: missing_middle.hard_cost_per_sqft
    plumbing_fixtures: 36
    registers: 28
    sprinkler_heads: 48
    permits: {low: 1, high: 6}
    sheets_large: {low: 0, high: 20}
    dit_value_per_sqft: {low: 113.88, high: 118.57}
    stormwater_hours: {low: 0, high: 4}
    note: >-
      Low reading: one 1 1/2-inch service and master meter; the site disturbs
      under 5,000 sq ft, so no stormwater review. High reading: a 2-inch
      service, four 5/8-inch meters and a stormwater review.
  apartment_20:
    label: "New 20-unit apartment building, 20 units x 850 sq ft + 15% common area, sprinklered"
    units: 20
    floor_area_sqft: 20000
    schedule_class: other
    cost_id: multifamily.hard_cost_per_sqft
    plumbing_fixtures: 184
    registers: 160
    sprinkler_heads: 300
    permits: {low: 1, high: 6}
    sheets_large: {low: 0, high: 60}
    dit_value_per_sqft: {low: 113.88, high: 135.04}
    stormwater_hours: {low: 4, high: 20}
    note: >-
      Low reading: a 2-inch combined domestic and fire service (ferrule) with
      one 2-inch meter and a 6-inch sewer connection; construction type VB.
      High reading: a separate 4-inch fire service (valve connection) with a
      4-inch fire-series meter, an 8-inch wye sewer connection, standpipes on
      four floors; construction type IIIA.

