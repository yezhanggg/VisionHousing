# Reviewed zoning rules by district (the zone_rule table of the P5 pilot).
#
# One row = one rule for one jurisdiction, one zoning district (or "*" for every
# district), one overlay ("none" for the base rule, an overlay code for a change an
# overlay makes) and one validity interval, for one prototype lot. Read by
# src/visionhousing/law/zone_rules.py; settings in assumptions/law/zone_weights.yaml.
#
# Rules of this file (checked by the loader):
# - Every rule field is stated. "unknown" means nobody has read it, or the text read
#   does not answer it. It is never "no". In an overlay row, "inherit" means the
#   overlay does not change the base rule's value.
# - A use that the text does not list stays "not_listed"; it counts as prohibited only
#   where `exclusivity_clause: verified` cites a clause saying uses not listed are not
#   allowed, and as a hearing route only where the clause gives one.
# - review_state: verified_code (the enacted text, read by script from the
#   jurisdiction's own site or legislative system), guidance (the jurisdiction's own
#   published guidance, not the code), unread (no text read; every field unknown).
# - valid_from is the first day in force; valid_from_unknown: true when the source does
#   not say, and then the row counts only from its reviewed_on date (the same rule as the
#   law timeline). valid_to is the first day no longer in force (empty when open).
# - A district code is the map's own code (map field in zone_weights.yaml); a rule is
#   never inferred from a district's name.
# - Texts on commercial code hosts (eCode360, American Legal, Municode) are not read by
#   script. Philadelphia's Zoning Code (Title 14) and the Pittsburgh Code (Title Nine) are
#   published only there; their use tables and district standards are "not read by
#   script", so the fields that depend on them stay unknown.

