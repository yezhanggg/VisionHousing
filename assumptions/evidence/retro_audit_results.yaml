year_convention:
  rule: g = year of the effective date if it falls on or before June 30, else the next year
  partial_year: Data are calendar-year counts, so a year is either treated or not; nothing is pro-rated.
    When the effective date is after June 30, the months under the rule fall in the last base year (g-1),
    which is then a partly treated base year; when it is on or before June 30, the first treated year
    g has up to six months before the rule. Each case names its partial year below. A reform in force
    on January 1 has none.
  sensitivity_conventions:
    any_exposure: g = calendar year of the effective date (a partial year counts as treated)
    first_full_year_all_phases: g = first calendar year in which every listed phase of the case's 2-4
      unit treatment was in force for the whole year
reading_rule:
  adoption: 'Decided before scoring, whatever the estimates: the audited variant becomes the panel''s
    reference record for every case (it changes the treatment year only for Saint Paul). The original
    results file is kept unchanged as the "before" record. Sensitivity variants are shown beside it and
    never replace it.'
  robustness: A case is called robust to the date convention only if the 90% intervals of its primary
    outcome under audited, any_exposure and first_full_year_all_phases have the same relation to zero
    (all include zero, or all exclude it on the same side).
  null_results: An interval that includes zero is reported as "no change distinguishable from ordinary
    cities", never dropped and never described as a negative or positive effect.
