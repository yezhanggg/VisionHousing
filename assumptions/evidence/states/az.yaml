  title: 'Arizona HB 2110 (2025): multifamily and adaptive reuse on at least 10% of commercial parcels in
    large cities'
  citation: Laws 2025, ch. 41 (HB 2110), emergency measure; A.R.S. 9-462.10
  url: https://www.azleg.gov/legtext/57leg/1R/laws/0041.htm
  session: 2025 Fifty-seventh Legislature, First Regular Session
  bill: HB 2110
  enacted_date: 2025-04-07
  effective_dates:
  - date: 2025-04-07
    applies_to: Whole act (emergency clause, operative on signature); applies retroactively from and after
      2024-12-31
  - date: 2025-07-06
    applies_to: Deadline for large cities to adopt objective standards (90 days after the effective date;
      date computed by us, not printed in the act)
  geographic_scope: Cities and towns of 150,000 or more people. At least 10% of existing commercial, office
    or mixed-use parcels must be open to multifamily or adaptive reuse without rezoning, a conditional use
    permit or any hearing.
  exclusions:
  - Historic districts (local or National Register)
  - Land near military airports and near public or commercial airports
  - Tribal land
  - Commercial or employment hubs the city designates (at most 10% of commercial parcels)
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - 'Standards may require only: site plan review, adequate water and sewer, building and fire codes, an
    obsolete building (disrepair or 50%+ vacancy), a 1-20 acre site and a 10% moderate- or low-income set-aside
    for 20 years. Parking may not exceed the existing multifamily requirement.'
  - New multifamily gets the highest multifamily height and density within one mile, capped at five stories
    (two stories may be required within 100 ft of single-family zones).
  - Amends the 2024 version of 9-462.10, which used a 'not more than 10%' ceiling; the 2025 act makes 10%
    a floor and bars parcel-by-parcel designation.
