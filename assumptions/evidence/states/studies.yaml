  citation: 'Su, Curran-Groome, Freemark, ''How Big Upzonings Affect Housing Supply: An Examination of
    Recent Regulatory Reforms on Construction and Permitting in New York City and Philadelphia'', Urban
    Institute research report, April 15, 2026'
