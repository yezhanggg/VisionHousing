  - id: epa_sewersheds
    name: EPA sewersheds of the United States (version 1.3) and their endpoint treatment plants
    publisher: U.S. Environmental Protection Agency (Office of Research and Development, Office of Water)
    url_pattern: https://services.arcgis.com/cJ9YHowT8TU7DUyn/arcgis/rest/services/National_Sewershed_Web_Map_Internal_WFL1/FeatureServer/0
    vintage: version 1.3 (October 2026)
    geography: [polygon, point]
