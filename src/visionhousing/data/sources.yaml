# VisionHousing source registry. One entry per data source.
#
# Fields (all checked by src/visionhousing/data/registry.py; unknown fields are rejected):
#   id            short lower-case name used in code and in data/manifest.json
#   name          plain-language name of the dataset
#   publisher     the agency or body that publishes it
#   url_pattern   https URL; {braces} are filled at fetch time (year, state_fips, table, ...)
#   vintage       the edition used (survey years, release, or "current")
#   geography     the geographic levels the source covers
#   licence       the licence or legal status of the data
#   terms_url     where the publisher states its terms
#   expected_size approximate bytes for one file (null for API answers and web pages)
#   parser        module.function that reads it (written in the source's own task)
#   limits        what the data cannot tell us, in plain words
#   tier          0 = every state, 1 = many states, 2 = local refinement only
#   access        file | api | range | feature_service | page
#   member        for access: range, the file inside the remote zip to read
#   cleaning      the cleaning steps applied (shown in the provenance table)
#   checked_on    the date the URL was last confirmed to answer
#
# No data is stored in the repository: `make data` fetches every file listed here.

sources:
  - id: bps_county_annual
    name: Building Permits Survey, county annual files
    publisher: U.S. Census Bureau
    url_pattern: https://www2.census.gov/econ/bps/County/co{year}a.txt
    vintage: 1990-2025 annual files (the 2025 file is the latest published)
    geography: [county]
    licence: Public domain (U.S. government work)
    terms_url: https://www.census.gov/about/policies/open-gov/open-data.html
    expected_size: 375000
    parser: bps.parse_county_annual
    limits: >-
      Counts units authorized by permit, not units started or finished. Some counties
      are imputed rather than reported; the file flags which. Places without permit
      offices are not covered.
    tier: 0
    access: file
    cleaning: >-
      Two header rows are joined and columns are read by name, not position. Reported
      and imputed figures are kept apart. County FIPS codes are zero-padded to five digits.
    checked_on: 2026-11-22

  - id: acs5_summary_file
    name: American Community Survey 5-year table-based summary files (2020-2024)
    publisher: U.S. Census Bureau
    url_pattern: https://www2.census.gov/programs-surveys/acs/summary_file/2024/table-based-SF/data/5YRData/acsdt5y2024-{table}.dat  # secret-scan: allow (a public URL path, not a key)
    vintage: 2020-2024 5-year estimates
    geography: [state, county, tract, block group]
    licence: Public domain (U.S. government work)
    terms_url: https://www.census.gov/programs-surveys/acs/data/summary-file.html
    expected_size: 47866463
    parser: acs.parse_summary_table
    limits: >-
      Estimates are survey averages over five years with margins of error; small tracts
      often have wide margins. One national pipe-delimited file per table (about 48 MB
      for B25024). Negative values are missing-value codes, not data.
    tier: 0
    access: file
    cleaning: >-
      Rows are filtered to the state's tracts by GEO_ID prefix. Negative missing-value
      codes become blanks. Estimates (E) and margins of error (M) are both kept.
    checked_on: 2026-11-22
    notes: The default ACS path. No key needed. {table} is lower case, for example b25024.

  - id: acs5_api
    name: American Community Survey 5-year estimates via the Census Data API (2020-2024)
    publisher: U.S. Census Bureau
    url_pattern: https://api.census.gov/data/2024/acs/acs5
    vintage: 2020-2024 5-year estimates
    geography: [state, county, tract, block group]
    licence: Public domain (U.S. government work); API terms of service apply
    terms_url: https://www.census.gov/data/developers/about/terms-of-service.html
    parser: acs.parse_api_rows
    limits: >-
      At most 50 variables per call. On 2026-11-22 a call without a key was answered
      with a "Missing Key" page, so this path needs CENSUS_API_KEY; the summary-file
      path above needs no key and gives the same estimates.
    tier: 0
    access: api
    cleaning: >-
      Same as the summary files. Variable labels are checked against the vintage's
      variable list before use.
    checked_on: 2026-11-22
    notes: Optional faster path. The key is read from the CENSUS_API_KEY environment variable.

  - id: cb_2020_tract
    name: Cartographic boundary file, census tracts, 2020, 1:500,000
