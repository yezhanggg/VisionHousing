  title: NYC City of Yes for Housing Opportunity (citywide zoning text amendment)
  citation: N 240290 ZRY (Zoning Resolution text amendment)
  url: https://council.nyc.gov/press/2024/12/05/2761/
  session: null
  bill: N 240290 ZRY
  enacted_date: 2024-12-05
  effective_dates: []
  geographic_scope: Citywide. TOD (3-5 stories) on qualifying R3-R5 sites near subway or rail that are
    over 5,000 sq ft and on a short block end or a street at least 75 ft wide. Town Center housing (2-4
    stories above ground-floor commercial) in low-density commercial overlays. One ADU of up to 800 sq
    ft per 1- or 2-family building.
  exclusions:
  - No basement or detached ADUs in expanded 2050/2080 flood zones
  - No detached ADUs in historic districts, some contextual districts (R1-2A, R2A, R3A) outside the Greater
    Transit Zone, or the Bay Ridge special district west of Ridge Blvd
  - Owner must live on the property to build an ADU
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: Not checked in depth.
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - 'Parking: Zone 1 (Manhattan Core/LIC and Inner Transit Zone) has no mandates. Zone 2 (Outer Transit
    Zone) has reduced mandates. Zone 3 (Beyond the Greater Transit Zone) keeps mandates largely as before.
    ADUs, affordable housing and qualifying developments under 75 units are exempt in some zones.'
  - 'Conversions: eligibility moved from buildings built before 1961/1977 to before 1991, eligible geography
    expanded citywide, and more housing types allowed.'
  - Council estimate of over 82,000 homes in 15 years is a projection, not an outcome. Includes the Universal
    Affordability Preference.
  - The effective date was not read on an official page, so effective_dates is empty. The ZR 'recently
    adopted' page is dated 12/5/2024.
  retrieved: 2026-11-24
  verified: true
  verification_note: City Council press release dated 2024-12-05 reports passage with modifications. The
    DCP final-plan PDF (nyc.gov) gives the ADU, TOD, Town Center, parking-zone and conversion details
    and says the Council approved it 'On December 5'. The ZR page shows N 240290 ZRY dated 12/5/2024.
