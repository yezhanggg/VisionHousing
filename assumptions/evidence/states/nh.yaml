  title: 'New Hampshire HB 631: multifamily housing on commercially zoned land (RSA 674:79-80)'
  citation: Laws 2025, ch. 201 (HB 631-FN); RSA 674:79-80; amended by Laws 2026, ch. 319:1 and ch. 329:6
  url: https://gc.nh.gov/bill_status/billinfo.aspx?id=690&inflect=2
  session: 2025 regular session
  bill: HB 631
  enacted_date: 2025-07-15
  effective_dates:
  - date: 2026-07-01
    applies_to: RSA 674:79-80 (ch. 201) and the 2026 ch. 319 amendment (effective 12:01 a.m.)
  - date: 2026-09-13
    applies_to: '2026 ch. 329:6: replacement para. V (as-of-right; only frontage, setback and height limits
      equal to commercial rules in commercial districts existing, created or expanded after 2026-07-01),
      new para. VI (conversion of nonconforming structures) and VII (attorney fees for improperly denied
      owners)'
  geographic_scope: All municipalities. Multifamily must be allowed on commercially zoned land where roads,
    water and sewer are adequate or are provided by the applicant.
  exclusions:
  - Towns may restrict housing in industrial or manufacturing zones with incompatible impacts
  - Towns may require ground-floor retail
  - The planning board may deny for inadequate roads or pedestrian safety, water, or wastewater
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - 'The infrastructure-adequacy test is a gate: the planning board may require a traffic study and proof
    of water and sewer connection rights.'
  - Adaptive-reuse conversions are exempt from setback, height and frontage rules if the building envelope
    does not change (para. V before 2026-09-13).
  - 'The 2026 amending chapters are ch. 319 (HB 1010) and ch. 329 (HB 1588), both confirmed on the gc.nh.gov
    2026 chaptered-laws list; ch. 329 has its own record (nh.hb1588_2026_parking_commercial).'
  retrieved: 2026-11-24
  verified: true
