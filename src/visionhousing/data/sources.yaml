    publisher: Vermont General Assembly
    url_pattern: https://legislature.vermont.gov/Documents/2026/Docs/ACTS/ACT{act}/ACT{act}%20As%20Enacted.pdf
    vintage: >-
      As enacted (Act 152 signed June 16, 2026; Act 179 signed June 18, 2026; both effective
      July 1, 2026). Text and bill status pages re-read 2026-11-25
    geography: [state]
    licence: Public legislative record
    terms_url: https://legislature.vermont.gov/
    parser: legislation.statute_text
    limits: >-
      The acts say what changed in law and from when; they do not say how many towns have
      updated their bylaws or how many projects used the Act 250 exemption. The enacted PDFs
      mark changes by strike-through and underline; the meaning of a struck word is read from
      those marks by hand. The web copies are not the official printed session laws.
    tier: 0
    access: page
    cleaning: >-
      Read by hand: Act 152 Sec. 6 (10 V.S.A. § 6081(dd), the Act 250 interim housing exemption
