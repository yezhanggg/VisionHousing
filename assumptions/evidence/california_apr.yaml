records:
- id: ca_apr.adu.statewide_2020
  what_changed: 'State ADU laws (AB 68, AB 881, SB 13) took effect: ministerial approval within 60 days,
    no owner-occupancy rule until 2025, limits on parking, fees and lot-size rules'
  where: California, every reporting city and county
  date: '2020-01-01'
  outcome:
    measure: ADU homes permitted per 1,000 one-unit detached homes per year
    before: 1.294
    after: 2.999
    change: 1.705
  denominator: one-unit detached homes (ACS 2020-2024 5-year, B25024_002)
  horizon: 2020-2025 vs 2018-2019
  identification: descriptive
  caveats:
  - 'Before/after only: rents, interest rates, the pandemic and later state laws (2023, 2024) changed
    at the same time.'
  - The 2018-2019 base already follows the 2017 state ADU laws.
  - Jurisdictions report themselves; late or missing reports lower a year's count.
- id: ca_apr.adu.san_diego_vs_san_jose
  what_changed: 'ADU Bonus Program added to the municipal code in the 2020 Housing Legislative Package
    (local legal pathway: ADU Bonus Program (extra ADUs in the transit-served Sustainable Development
    Area))'
  where: San Diego compared with San Jose (peer chosen on the pre-period rate)
  date: '2020'
  outcome:
    measure: ADU homes permitted per 1,000 one-unit detached homes per year
    focal_before: 1.719
    focal_after: 5.695
    peer_before: 1.718
    peer_after: 2.571
    difference_in_change: 3.123
  denominator: one-unit detached homes (ACS 2020-2024 5-year, B25024_002)
  horizon: 2020-2025 vs 2018-2019
  identification: matched
  caveats:
  - Matched on two pre-period years only; no test of parallel trends.
  - Both cities had the 2020 state law change; the difference reflects local pathway, market and reporting
    together.
  - The local change date is taken from the city's own pages; where it says 'not verified' it was not
    confirmed for this study.
- id: ca_apr.adu.los_angeles_before_after
  what_changed: 'Pre-approved ADU standard plans offered by the Department of Building and Safety (start
    date not verified here) (process pathway: ministerial ADU plan check at scale, with a pre-approved
    standard-plan program)'
  where: Los Angeles (no peer with a similar pre-period rate)
  date: after 2019 (not verified)
  outcome:
    measure: ADU homes permitted per 1,000 one-unit detached homes per year
    before: 7.912
    after: 10.9
    change: 2.988
    statewide_change: 1.705
  denominator: one-unit detached homes (ACS 2020-2024 5-year, B25024_002)
  horizon: 2020-2025 vs 2018-2019
  identification: descriptive
  caveats:
  - no candidate within 25% of its pre-period rate; compared with its own earlier years only
  - The state law change of 2020 applies here too; the statewide change is shown for scale, not as a control.
  - The local change date is taken from the city's own pages; where it says 'not verified' it was not
    confirmed for this study.
- id: ca_apr.sb9.take_through
  what_changed: 'SB 9 (2021): by-right duplex and urban lot split on single-family lots'
  where: California, every reporting city and county
  date: '2022-01-01'
  outcome:
