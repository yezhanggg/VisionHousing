  - 'PN 3373 text: no owner-occupancy requirement; no added off-street parking and no replacement of converted
    garage spaces; minimum size cap no higher than 200 sq ft; maximum size no lower than the lesser of
    50% of the house or 850 sq ft; height limit no lower than the lesser of 25 ft or the house height;
