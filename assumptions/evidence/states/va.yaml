  title: 'Virginia Acts 2026, chs. 1009 and 1096 (SB 388 / HB 1279): by-right affordable housing on religious
    and nonprofit land'
  citation: Va. Acts 2026, ch. 1009 (SB 388) and ch. 1096 (HB 1279); Va. Code 15.2-2288.9
  url: https://law.lis.virginia.gov/vacode/title15.2/chapter22/section15.2-2288.9/
  session: 2026 regular session (reconvened)
  bill: HB 1279 / SB 388
  enacted_date: 2026-04-22
  effective_dates:
  - date: 2027-01-01
    applies_to: 'Va. Code 15.2-2288.9: by-right mixed-use or residential projects on land owned 5+ years
      by a tax-exempt religious or 501(c)(3) organization, with at least 60% of units affordable (80%
      AMI rental, 120% AMI for sale) for 30 years; deemed to allow at least 45 ft or the tallest building
      within 500 ft, 20 units/acre or the densest housing within 500 ft, 10-ft setbacks; parking capped
      at 1 space per unit'
  - date: 2031-01-01
    applies_to: The act expires (clause 4)
  geographic_scope: All localities with a zoning ordinance, on property owned by tax-exempt religious organizations
    or 501(c)(3) nonprofits served by or planned for public water and sewer.
  exclusions:
  - Property zoned for or next to land zoned for industrial use
  - In historic districts established by January 1, 2026, the district's height rules control
  - Permits approved before January 1, 2027
  - Projects must meet environmental, historic, siting, wetland, stormwater, highway access and health
    rules
  implementation_status: enacted
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - A temporary law (2027-2030). The 60% affordability share limits which projects pencil.
  - Two identical chapters; one record covers both.
  retrieved: 2026-11-24
  verified: true
  verification_note: Chapter 1009 ('[S 388] Approved April 22, 2026') and Chapter 1096 ('[H 1279] Approved
    April 22, 2026') texts in the official LIS document store each say clause 2 'effective on January
    1, 2027' and clause 4 'expire on January 1, 2031'. The Code of Virginia page for 15.2-2288.9 shows
    the version 'Effective January 1, 2027, until January 1, 2031' with history citing both chapters.
  sources:
