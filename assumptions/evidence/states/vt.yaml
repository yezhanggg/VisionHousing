  title: 'Vermont Act 152 of 2026 (S.325): Act 250 Tier changes and extension of the interim housing exemptions'
  citation: 2025, No. 152 (Adj. Sess.) (Act 152 of 2026), S.325
  url: https://legislature.vermont.gov/bill/status/2026/S.325
  session: 2025-2026 biennium, 2026 adjourned session
  bill: S.325
  enacted_date: 2026-06-16
  effective_dates:
  - date: 2026-07-01
    applies_to: First of several effective dates
  - date: 2028-01-01
    applies_to: New expiration date of the interim Act 250 housing exemptions, previously 2027-01-01 or
      2027-07-01
  geographic_scope: Statewide Act 250 jurisdiction. Interim housing exemptions apply in designated centers
    and growth or neighborhood areas, subject to unit and acreage limits.
  exclusions: []
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
