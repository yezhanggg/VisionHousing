  title: 'Maine LD 2003 (2022): up to 4 homes per lot, ADUs and affordable density bonus'
  citation: P.L. 2021, ch. 672 (LD 2003, HP 1489); 30-A M.R.S. §§ 4364, 4364-A, 4364-B, 4364-C
  url: https://legislature.maine.gov/legis/bills/display_ps.asp?LD=2003&snum=130
  session: 130th Legislature, Second Regular Session (2022)
  bill: LD 2003
  enacted_date: 2022-04-27
  effective_dates:
  - date: 2022-08-08
    applies_to: General effective date for nonemergency laws of the 130th Second Regular Session
  - date: 2023-07-01
    applies_to: Municipalities need not implement §§ 4364-A (2-4 units per lot) and 4364-B (ADUs) until
      this date; the affordable density bonus (§ 4364) applies to projects approved on or after it
  geographic_scope: 'All municipalities, any area where housing is allowed: 2 units on a vacant lot; up
    to 4 units on a vacant lot in a designated growth area or with public water and sewer; up to 2 more
    units (one attached or internal, one detached) on a lot with one home; one ADU on a single-family
    lot.'
  exclusions:
  - Shoreland zoning still applies (12 M.R.S. ch. 423-A)
  - Each unit must show adequate water and wastewater service before occupancy
  - Lots that already gained units under §§ 4364-A or 4364-B get no further density increase unless
    the town allows it
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - An ADU may not face parking requirements beyond those of the single-family home on the lot.
  - Affordable developments in growth areas or with public water and sewer get 2.5 times base density.
  - Later amended by P.L. 2023, c. 192 (application dates and terms; not read here), P.L. 2025, c. 385
    (LD 1829) and c. 733 (LD 2173).
  retrieved: 2026-11-24
  verified: true
  verification_note: 'legislature.maine.gov bill page: ''Final Disposition Enacted, Apr 27, 2022 Governor''s
