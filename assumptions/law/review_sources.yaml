# Where each unread municipality's zoning ordinance was looked for, and how hard
# it is to read (visionhousing.law.priorities uses "effort").
#
# unit: a 10-digit municipality code, or "county:<5-digit code>" for a county
#       ordinance that zones several municipalities.
# effort: own_pdf_text (own-site PDF with a text layer), own_html,
#       own_pdf_scan (no text layer), own_text_incomplete (a text layer, but
#       the operative part cannot be read yet: a placeholder use table, or an
#       undated text with a later update posted only as a scan), commercial_only (the only copy found is on
#       a commercial code host, which forbids automated or bulk use: not read
#       here), not_searched.
# url: the own-site address found (empty when none).
# checked_on: the date someone looked.
#
# Only places looked for and not (yet) verified are listed; a verified reading
# lives in municipal_rules.yaml.

