- id: tx.hb24_2025_zoning_protest
  kind: policy
  state: TX
  jurisdiction: statewide (municipal zoning)
  policy_types:
  - permit_timing
  - missing_middle
  title: 'Texas HB 24 (2025): higher bar for neighbor protests of zoning changes that add housing'
  citation: Acts 2025, 89th Leg., R.S. (HB 24); Tex. Local Gov't Code 211.0011, 211.006, 211.0061, 211.0063,
    211.0073
  url: https://capitol.texas.gov/BillLookup/History.aspx?LegSess=89R&Bill=HB24
  session: 89th Legislature, Regular Session (2025)
  bill: HB 24
  enacted_date: 2025-06-20
  effective_dates:
  - date: 2025-09-01
    applies_to: Whole act; applies to zoning change proposals made on or after this date
  geographic_scope: All cities with zoning.
  exclusions:
  - Changes that add commercial or industrial uses (beyond limited ground-floor use up to 35% of a residential
    project) keep the old 20% protest and three-fourths vote rule
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - Citywide changes that allow more housing (comprehensive changes and corridor overlays) are not subject
    to the protest supermajority at all.
  - For site rezonings adding housing, a neighbor protest needs owners of 60% of the land within 200 ft (was
    20%), and then only a simple majority vote is needed (was three-fourths).
  - Speeds approval politics, not permit processing.
  retrieved: 2026-11-24
  verified: true
  verification_note: capitol.texas.gov bill history shows 'Signed by the Governor 06/20/2025' and 'Effective
