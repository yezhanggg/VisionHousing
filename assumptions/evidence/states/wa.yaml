- id: wa.sb6026_2026_commercial_zones
  kind: policy
  state: WA
  jurisdiction: statewide
  policy_types:
  - commercial_land_housing
  title: 'Washington E2SSB 6026 (2026): residential development in commercial and mixed-use zones'
  citation: E2SSB 6026, Ch. 236, Laws of 2026; new section in chapter 36.70A RCW
  url: https://app.leg.wa.gov/billsummary?BillNumber=6026&Year=2025
  session: 2026 regular session
  bill: SB 6026
  enacted_date: 2026-03-27
  effective_dates:
  - date: 2026-06-11
    applies_to: Whole act
  - date: 2027-12-11
    applies_to: 'Computed: 18 months after the effective date. Where a city or county has not adopted
      compliant rules, the residential-use rule applies directly and overrides conflicting local rules,
      and ground-floor commercial mandates may not be imposed outside the excluded areas'
  geographic_scope: Cities planning under the Growth Management Act with 30,000 or more people, and
    planning counties that are not rural counties. They may not exclude homes from areas zoned commercial
    or mixed use, and may require ground-floor commercial or retail, or discretionary permits for siting
    and design, in at most 40% of that acreage (none for subsidized affordable housing).
  exclusions:
  - Industrial zones (including employment overlays barring homes adopted before the act)
  - Land within 3,200 feet of an active oil or gas refinery
  - Lots needing demolition of a locally designated historic landmark
  - Land outside urban growth areas or in growth areas not contiguous with a covered city
  - Areas near airports or military bases where homes are barred (RCW 36.70.547, 36.70A.530)
  - Tax increment financing areas set up before the act
  - Shoreline areas where the shoreline program bars multifamily or mixed use
  - Critical areas and their buffers (with a limited aquifer-recharge exception)
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - Station areas and areas already zoned for 85 feet or more do not count as commercial or mixed-use
    acreage for the 40% cap.
  - Covered places must offer an administrative process to reduce or waive ground-floor commercial rules.
  - Cities need not update growth assumptions until the comprehensive plan update due after 2031-01-01.
  retrieved: 2026-11-24
