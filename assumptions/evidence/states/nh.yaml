  - parking
  title: 'New Hampshire HB 577 (2025): one attached or detached ADU by right'
  citation: Laws 2025, ch. 197 (HB 577); RSA 674:71-73
  url: https://gc.nh.gov/bill_status/billinfo.aspx?id=125&inflect=2
  session: 2025 regular session
  bill: HB 577
  enacted_date: 2025-07-15
  effective_dates:
  - date: 2025-07-01
    applies_to: Whole act (the act's own effective date precedes the signing date)
  geographic_scope: Every municipality with a zoning ordinance, in all districts that allow single-family
    homes. Where an ordinance is silent, one ADU is a permitted use by right.
  exclusions:
  - Towns need not allow more than one ADU per single-family home
  - Towns may bar ADUs with townhouses and on rented or leased land
  - Towns may require owner occupancy of one of the two units
  - Condominium sale of the ADU apart from the main home is barred unless the town allows it
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - 'No extra lot size, setback, frontage, design review or space controls beyond those for a single-family
    home. Size cap: 950 sq ft unless the town allows more; a town may not cap below 750 sq ft.'
  - Where the main home must have parking, a town may require at most one more space for the ADU.
  - Laws 2026, ch. 210 (HB 1079) later amended RSA 674:71-72 (conversion of nonconforming structures),
    effective 2026-08-31 per the RSA source note; not reviewed as a separate record.
