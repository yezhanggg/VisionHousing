  - id: cdfi_nmtc_lic
    name: New Markets Tax Credit low-income community tracts (2016-2020 ACS)
    publisher: U.S. Department of the Treasury, CDFI Fund
    url_pattern: https://www.cdfifund.gov/system/files/2023-08/NMTC_2016-2020_ACS_LIC_Sept1_2023.xlsb
    vintage: 2016-2020 ACS eligibility file released 2023-09-01 (required for investments closed from 2024-09-01)
    geography: [tract]
    licence: Public domain (U.S. government work)
    terms_url: https://www.cdfifund.gov/news/537
    expected_size: 4735457
    parser: incentives.read_nmtc
    limits: >-
      Shows whether a tract meets the poverty (20% or more) or income (80% of the
      benchmark or less) test. Other routes to eligibility (high-migration rural
      counties, targeted populations) are not shown. The CDFI Fund does not update
      the file every year.
    tier: 0
    access: file
    cleaning: >-
      Read with a small standard-library reader for Excel binary (.xlsb) files; keeps
      the state's tracts, the yes/no test results, the poverty rate and the income
      percentage. The national file is deleted.
    checked_on: 2026-11-22
    notes: The address listed on the CDFI Fund news page (folder 2023-09) answers 404; the same file is served from folder 2023-08.

  - id: hud_lihtc
    name: Low-Income Housing Tax Credit properties (HUD LIHTC database)
    publisher: U.S. Department of Housing and Urban Development
    url_pattern: https://services.arcgis.com/VTyQ9soqVukalItT/arcgis/rest/services/LIHTC/FeatureServer/0/query  # secret-scan: allow (a public URL path, not a key)
