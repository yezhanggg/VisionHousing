  title: 'Pennsylvania SB 1346: by-right accessory dwelling units (MPC amendment)'
  citation: SB 1346 (2025-2026), Printer's No. 1747; amends Municipalities Planning Code (Act 247 of 1968),
    new § 603(m) and § 603.2
  url: https://www.palegis.us/legislation/bills/2025/sb1346
  session: 2025-2026 regular session
  bill: SB 1346
  enacted_date: null
  effective_dates: []
  geographic_scope: Every municipality where single-family detached dwellings are permitted; at least
    one ADU per single-family detached dwelling, attached, internal or detached on the same lot.
  exclusions:
  - Does not override deed restrictions, covenants, master deeds or planned-community documents
  - Amends the Municipalities Planning Code, so it does not reach Philadelphia or Pittsburgh, which zone
    under their own laws
  - Recreational vehicles are not ADUs
  - ADU may be rented but not sold separately from the main dwelling
  implementation_status: pending
  litigation:
    status: not_applicable
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - Not law. Referred to Urban Affairs & Housing 2026-05-26; reported as committed 10-1 and first consideration
    2026-07-12; laid on the table under Senate Rule 9 on 2026-11-17 (last action as of 2026-11-24). A
    tabled bill can be taken off the table; no later action was shown.
  - 'Text (PN 1747): ministerial approval with no hearing; 14-day decision clock with deemed approval;
    review fee limited to cost; no owner-occupancy requirement; no added off-street parking and no replacement
    of converted garage spaces; minimum size cap no higher than 150 sq ft; maximum size no lower than
    the lesser of 50% of the house or 1,250 sq ft; side/rear setback of 4 ft at most; limits on utility
    connection fees. Act would take effect 60 days after enactment.'
  retrieved: 2026-11-24
  verified: true
  verification_note: palegis.us bill page shows PN 1747 and the actions 2026-05-26 referral, 2026-07-12
    reported and first consideration, and 2026-11-17 laid on the table (Rule 9). Provisions read in the
    PN 1747 text on palegis.us.
