    verified_on: 2026-11-24
    retrieved_on: 2026-11-24
    text_version: "Acts of 2020, chapter 358 (approved in part January 14, 2021; emergency law)"
    scope: >-
      The 177 MBTA communities: at least one district of reasonable size with
      multi-family housing as of right at 15 or more units per acre, within 0.5
      miles of a station where applicable
    exclusions: Boston (not subject to chapter 40A)
    agency: Executive Office of Housing and Livable Communities (760 CMR 72)
