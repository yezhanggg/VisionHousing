#   fixtures_tiered       first_amount for the first first_count fixtures,
#                         plus step_amount for each fixture above
#   valuation_per_1000    rate for each $1,000 (or fraction) of estimated
#                         cost of that work = cost share x construction cost
#                         per sq ft (ledger cost_id) x floor area; min / max
#   percent_of_table_value  rate x floor area x the City's table value per sq ft
