  - doc_id: wy_title18_ch5
    title: "W.S. 18-5-201 to 18-5-208 (county zoning) and 18-5-303 (subdivision exemptions)"
    level: state
    publisher: Wyoming State Legislature
    url: https://wyoleg.gov/statutes/compress/title18.pdf
    licence: Public legislative record
