# Wyoming state law snapshot: the provisions that bear on the benchmark
# reforms, as rows the law layer can import.
#
# Two blocks, in the layout of assumptions/law/states/ma.yaml:
#   provisions  one row per provision (citation, reform, status, our own summary);
#   records     dated statuses of a provision (assumptions/law/timeline.yaml layout).
#
# Every text was read on wyoleg.gov on 2026-11-24 (registry source wy_statutes):
# Title 15, chapter 1, article 6 (city and town zoning, W.S. 15-1-601 to
# 15-1-611), Title 18, chapter 5, articles 2 and 3 (county zoning and
# subdivisions), and the 2025 and 2026 session subject indexes and bill digests.
# summary_own_words is our plain-language summary, not a quotation.
#
# Finding: Wyoming has NO state statute that allows accessory dwelling units,
# two-to-six-unit homes, transit-area density, lower parking minimums or lower
# development fees in place of local rules. Zoning is enabling law only: cities,
# towns and counties may zone, and the statute says what they may regulate, not
# what they must allow. The few limits on local zoning (minerals, private
# schools, family land divisions) do not bear on the benchmark reforms, except
# that a county may not use a minimum lot size to stop a home on an
# immediate-family land division (W.S. 18-5-201 with 18-5-303(a)(i)).
#
# Re-checked by script on 2026-11-26 (wyoleg.gov; the bill list is the
# lsoservice.wyoleg.gov BillInformation record the site itself reads): every
# bill title of the 2024, 2025 and 2026 sessions and the full text of every
# enacted act of those years. Still no statewide reform on the five benchmark
# reforms. One enacted act bears on permitting but is not a benchmark reform:
# 2026 HB0002, the Fast Track Permits Act (non_benchmark_enacted, below). It is
# kept out of `provisions` and `records` on purpose, so the state is still
# shown as "No state reform law found" for the five reforms.
#
# Bills read and not enacted (so no record below; listed in bills_not_enacted):
#   - 2025 HB0197 "Limits on property development exaction and mitigation
#     fees": no committee report before the cutoff (2025-02-10). Not enacted,
#     so it has no effective date (the bill record's effective-date field is a
#     placeholder for bills that pass).
#   - 2025 SF0040 "Zoning protest petition-amendments": postponed indefinitely
#     in the Senate (2025-03-06).
#   - 2024 interim working draft "Accessory residential units-permits" (county
#     permits within 90 days, no owner-occupancy rule): not introduced as a bill
#     in the 2025 session (the 2025 subject index lists no ADU bill).
#   - 2025 HB0088 "Multi-family dwelling single stairwell exits": did not get a
#     vote for introduction (2025-02-03).
#   - 2025 HB0056 "Cities and towns notice for zoning changes": not considered
#     for introduction (2025-02-03).
#   - 2026 SF0042 "County zoning authority-amendments": failed introduction
#     (2026-02-10).
#   - 2026 HB0077 "Zoning protest petition-repeal": failed introduction
#     (2026-02-10).
#   - 2026 SF0117 "Zoning protest petition-amendments": died in House committee
#     (2026-03-03).
#
# So no already-legal calibration is written for Wyoming: with no state ADU or
# missing-middle law, Wyoming runs keep the ledger's national default for
# adu.already_legal_share and missing_middle.sf_only_zoned_share. Some cities
# allow ADUs in their own codes; those are local rules and are not read here.

version: 1
state: WY

