  enacted_date: 2024-03-20
  effective_dates:
  - date: 2024-03-20
    applies_to: Act takes effect immediately and applies to each new round of obligations
  - date: 2025-01-31
    applies_to: Deadline for each municipality's binding resolution setting its fourth-round present and
      prospective obligation
  - date: 2025-06-30
    applies_to: Deadline to adopt the housing element and fair share plan, propose implementing ordinances,
      and file with the Program to keep immunity
  - date: 2025-07-01
    applies_to: Fourth round begins (runs 2025-07-01 to 2035-06-30)
  - date: 2025-08-31
    applies_to: Deadline for interested-party challenges to filed plans
  geographic_scope: All New Jersey municipalities. DCA calculates regional need and non-binding municipal
    obligations by formula. Municipalities set their own number by resolution, with disputes handled by
    the new Affordable Housing Dispute Resolution Program and the courts.
  exclusions: []
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: Process runs through the Dispute Resolution Program and the courts. Individual challenges to
      the act were not reviewed.
    citation: null
    url: null
