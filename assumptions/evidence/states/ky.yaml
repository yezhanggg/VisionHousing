- id: ky.hb333_2026_religious_land_housing
  kind: policy
  state: KY
  jurisdiction: statewide
  policy_types:
  - commercial_land_housing
  - adaptive_reuse
  title: 'Kentucky HB 333 (2026): affordable housing by religious developers as a permitted use'
  citation: 2026 Ky. Acts ch. 37 (HB 333); new section of KRS Chapter 100
  url: https://apps.legislature.ky.gov/record/26rs/hb333.html
  session: 2026 regular session
  bill: HB 333
  enacted_date: 2026-04-07
  effective_dates:
  - date: 2026-07-15
    applies_to: Whole act (no emergency or special effective date; the 2026 regular session normal effective
      date)
  geographic_scope: All planning units. Affordable housing (80% of area median income or less) built by
    or for a religious institution is a permitted use with only ministerial review, on land the institution
    bought before 2026-01-01, on a commercial or business-zoned parcel, a residential parcel on a state
    primary road next to commercial, business or industrial zoning, or in a former school building.
  exclusions:
  - Projects over 24 units, or that would put more than 24 such units on the parcel, contiguous parcels
    or the institution's parcels within half a mile
  - Mixed-income projects (the development must be entirely affordable)
  - All other permits, including building permits, are still required
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - Affordability must last 15 years and be recorded; a project that stops qualifying must seek ordinary
    approvals.
  - Religious-run homeless shelters become a permitted use in commercial, business and industrial zones.
  retrieved: 2026-11-24
  verified: true
  verification_note: The LRC bill record shows 'signed by Governor (Acts Ch. 37)' on 04/07/26. The Acts
    chapter 37 text (apps.legislature.ky.gov) ends 'Signed by Governor April 7, 2026' with no effective-date
    section. The LRC Normal Effective Dates page gives July 15, 2026 for the 2026 regular session (per OAG
    26-03).
