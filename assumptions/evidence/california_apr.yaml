  denominator: applications reported in Table A (application cohorts 2018 on; SB 9 from 2022)
  horizon: 1-3 years after application
  identification: descriptive
  caveats:
  - SB 9 is known only from the APR's streamlining field; jurisdictions that leave it blank hide SB 9
    projects among single-family and 2-4 projects.
  - Applications that never join a Table A2 row count as not permitted, so all shares are lower bounds.
- id: ca_apr.mf.ministerial_vs_other
  what_changed: Streamlined or ministerial approval of 5+ home projects (SB 35 2017, AB 2011 2022, SB
    423 2023 and local ministerial paths)
  where: California, every reporting city and county
  date: '2018-01-01'
