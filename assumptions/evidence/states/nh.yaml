  title: 'New Hampshire HB 1588 (2026): no garage mandate for required parking, as-of-right multifamily
    on commercial land, special assessment districts'
  citation: Laws 2026, ch. 329 (HB 1588-FN); RSA 674:16, VII; RSA 674:80; new RSA 162-V (renumbered
    by contingency)
  url: https://gc.nh.gov/bill_status/billinfo.aspx?id=2446&inflect=2
  session: 2026 regular session
  bill: HB 1588
  enacted_date: 2026-07-15
  effective_dates:
  - date: 2026-09-13
    applies_to: 'Remainder of the act (60 days after passage): RSA 674:16, VII (towns may not require
      more than one residential parking space per unit or require it to be garaged), special assessment
      districts, expanded housing infrastructure grant program; and § 6 (RSA 674:80, V-VII), which takes
      effect 60 days after passage because HB 1010 became law (§ 7 contingency)'
  geographic_scope: All municipalities that zone. The commercial-land rules apply to commercial districts
    existing, created or expanded after 2026-07-01.
  exclusions:
  - Towns may still impose frontage, setback and height limits on multifamily in commercial districts,
    but no stricter than for commercial development
  - Site plan review under RSA 674:43 is preserved; state fire, building and septic rules still apply
  - 'Special assessment districts: only with memoranda signed by owners of 60% of properties; schools
    and general government buildings cannot be financed'
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - The one-space-per-unit cap was set by Laws 2025, ch. 258 (SB 284); HB 1588 adds the ban on requiring
    that space to be in a garage.
  - Owners improperly denied multifamily on commercial land may recover reasonable attorney fees.
  - The grant program expansion carries a nominal $1 appropriation for FY 2027.
  retrieved: 2026-11-24
