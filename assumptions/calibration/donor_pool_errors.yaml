# Calibration (validation): donor-pool error record for sparse states (generated; do not edit).
# Written by `visionhousing validate-donor-pool` from the Census Building Permits
# Survey county files of every state. Hold-out-state back-tests of the baseline's
# state range, the pre-stated decision, and ratio quantiles a sparse state could
# borrow. The baseline reads none of it unless the decision says "adopt" and the
# engine is wired to it. Method: docs/modules/validation_donor_pool.md.

version: 1
id: donor_pool_errors_2026_11
label: Donor-pool error record for sparse states (hold-out-state back-test)
status: validation
use: Not read by the baseline. If decision.outcome is 'adopt', the engine may use sparse_states.<ST>.ratio_quantiles
  in place of the Pennsylvania prior of the small-sample widening (assumptions/backtest.yaml, small_sample).
provenance:
  summary: 'Hold-out-state back-tests of the baseline''s state range (rule last_3_mean): for each held-out
    state and past origin, ranges from the state''s own errors, Pennsylvania''s, all other states'', all
    other counties'', and a matched pool of counties in other states, scored on coverage of the real five-year
    total; and donor-pool ratio quantiles for each sparse state.'
  measured_on: '2026-11-24'
  method: National county panel from the BPS annual county files 1990-2025 (settings in assumptions/validation_donor_pool.yaml);
    back-test cases from visionhousing.baseline (read-only); see docs/modules/validation_donor_pool.md.
  generated_by: visionhousing validate-donor-pool
  sources:
  - id: bps_county_annual
    citation: U.S. Census Bureau, Building Permits Survey, county annual files, 1990-2025
    url: https://www2.census.gov/econ/bps/County/co{year}a.txt
    licence: Public domain (U.S. government work)
  limits:
  - Each held-out state is scored on about a dozen overlapping five-year windows, so one state's coverage
    moves in steps of several points.
  - Origins share the national housing cycle; held-out states' errors move together.
  - The 2003 county file reports no imputation (reported equals estimated), so completeness is overstated
    for windows holding 2003.
