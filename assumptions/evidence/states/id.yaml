  title: 'Idaho S 1352 (2026): starter-home subdivisions with 1,500 sq ft minimum lots in cities over
    10,000'
  citation: Idaho Laws 2026, ch. 264 (S 1352, as amended); Idaho Code 67-6542
  url: https://legislature.idaho.gov/sessioninfo/2026/legislation/S1352/
  session: 2026 regular session (68th Legislature, 2nd regular session)
  bill: S 1352
  enacted_date: 2026-03-31
  effective_dates:
  - date: 2026-07-01
    applies_to: Whole act (no city may ban starter-home subdivisions in residential zones)
  - date: 2027-02-01
    applies_to: Deadline for covered cities to amend plans and land use rules to allow them
  geographic_scope: Cities with more than 10,000 people, residential zoning districts; subdivisions of
    at least 4 acres of detached single-family homes
  exclusions:
  - Historic districts and designated historic properties
  - Cities of 10,000 or fewer people
  - Cities may condition or deny where existing or planned infrastructure is inadequate, to the same
    standard used for other subdivisions
  - Lot-size cap yields where infrastructure, lot shape or environmental limits make it unfeasible
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - 'In these subdivisions cities may not require: minimum lots over 1,500 sq ft; front or rear setbacks
    over 15 ft or side setbacks over 5 ft; lot width over 30 ft for narrow lots; lot depth over 70 ft;
    or permit, impact or connection fees above those for other single-family subdivisions.'
  - The bill text names the new section 67-6541; it was codified as 67-6542 because S 1354 also created
    67-6541.
  retrieved: 2026-11-24
  verified: true
