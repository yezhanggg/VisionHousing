  title: 'Vermont Act 47 (2023), S.100, the HOME Act: duplexes everywhere, fourplexes with sewer and water,
    parking caps, Act 250 relief'
  citation: 2023, No. 47 (S.100); 24 V.S.A. §§ 4412, 4413, 4414 and Act 250 (10 V.S.A. ch. 151)
  url: https://legislature.vermont.gov/bill/status/2024/S.100
  session: 2023-2024 biennium, 2023 session
  bill: S.100
  enacted_date: 2023-06-05
  effective_dates:
  - date: 2023-06-05
    applies_to: Sec. 46 (lead inspectors), on passage
  - date: 2023-07-01
    applies_to: Most of the act, and Sec. 2 subdivision 24 V.S.A. § 4412(1)(D)
  - date: 2023-09-01
    applies_to: Sec. 3 (24 V.S.A. § 4413, limits on regulating shelters and similar uses)
  - date: 2024-12-01
    applies_to: Secs. 1 (24 V.S.A. § 4414) and 2 (24 V.S.A. § 4412), other than § 4412(1)(D)
  geographic_scope: All municipalities with bylaws. Duplexes wherever single-family homes are allowed;
    up to four units and at least five units per acre in residential districts served by municipal sewer
    and water.
  exclusions:
  - Towns may define which areas count as served by municipal sewer and water
  - 'Parking: up to 1.5 spaces per unit may be required for multiunit homes in areas without sewer and
    water if other parking is not sufficient'
  - The Act 250 threshold relief (25 units in designated centres) was temporary, sunsetting 2026-07-01
  implementation_status: legally_effective
