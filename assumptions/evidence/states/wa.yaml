      50,000 or more'
  - date: 2028-07-27
    applies_to: 'Computed: three years after the effective date, the deadline for cities and counties
      of 30,000 to 50,000'
  geographic_scope: Cities, code cities and counties over 30,000 people. They may require at most 0.5
    space per multifamily home, one per single-family home and two per 1,000 sq ft of commercial space,
    and no minimum for homes under 1,200 sq ft, affordable or senior housing, small commercial spaces,
    child care, ground-floor commercial in mixed-use buildings or changes of use.
