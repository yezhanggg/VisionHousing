  title: 'Maryland Chapter 592 of 2026 (HB 894): Maryland Transit and Housing Opportunity Act'
  citation: Md. Laws 2026, ch. 592 (HB 894; cross-filed SB 389); Land Use Article 4-104(c), (e)-(g)
  url: https://mgaleg.maryland.gov/mgawebsite/Legislation/Details/hb0894?ys=2026RS
  session: 2026 regular session
  bill: HB 894
  enacted_date: 2026-05-26
  effective_dates:
  - date: 2026-10-01
    applies_to: 'Whole act: no minimum off-street parking for residential or mixed-use development within
      0.25 mile of a rail station with at least hourly weekday service (8 a.m.-6 p.m.); mixed-use must
      be allowed within 0.5 mile on residential or suitable commercial land in later rezonings; no height,
      setback or use limits on state, Baltimore City or WMATA transit land under an MDOT-approved TOD plan;
      automatic enterprise-zone designation for new TOD areas'
  geographic_scope: Land near rail transit stations with at least hourly service on average from 8 a.m.
    to 6 p.m. on weekdays. The act names charter counties and Baltimore City among the places the rules
    reach.
  exclusions:
  - Rail stations on the campus of an institution of higher education
  - Land zoned for single-family residential use on January 1, 2026
  - A local government may keep minimums if it did an adequate parking study within 3 years before the
    application and MDOT concurred (MDOT silence for 45 days counts as concurrence)
  - The mixed-use and transit-land rules do not change local authority over environmental, public health
    and safety, or adequate public facilities rules
  - The mixed-use rule applies only to rezonings or actions taken on or after the effective date
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - Section 3 (impact fees and excise taxes collected only after completion, for TOD mixed-use) took effect
    only if chapters 590 and 591 of 2026 failed. Both became law, so Section 3 is void by its own terms;
    the broader fee-timing rule is in md.ch590_591_2026_housing_certainty.
  - The parking rule is a ban on minimums, not on parking. It covers only a quarter mile around qualifying
    rail stations, a small share of land.
  retrieved: 2026-11-24
  verified: true
  verification_note: mgaleg.maryland.gov bill page shows 'Approved by the Governor - Chapter 592' and
    effective date October 1, 2026. Chapter 592 text on mgaleg.maryland.gov ends 'Approved by the Governor,
    May 26, 2026' and gives the Section 5 contingency and the Section 6 effective date. Exclusions read
    in the DLS enrolled fiscal and policy note.
