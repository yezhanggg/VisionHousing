  title: No minimum parking for multifamily and residential adaptive reuse near frequent transit
  citation: HB24-1304; 2024 Colo. Sess. Laws ch. 159
  url: https://leg.colorado.gov/bills/hb24-1304
  session: 2024 regular session (75th General Assembly)
  bill: HB24-1304
  enacted_date: 2024-05-10
  effective_dates:
  - date: 2024-08-07
    applies_to: Act effective
  - date: 2025-06-30
    applies_to: Covered local governments may not enact or enforce parking minimums for multifamily, residential
      adaptive reuse, or mostly-residential mixed-use adaptive reuse in applicable transit service areas
  geographic_scope: Municipalities in a metropolitan planning organization (MPO) and counties for unincorporated
    MPO areas; applies to projects at least partly within 1/4 mile of qualifying transit stops as mapped
    by DOLA
  exclusions:
  - Disability parking protections
  - Parking maximums and bicycle parking minimums still allowed
  - Pre-existing parking-for-affordability agreements
  - Affordable housing funding conditions requiring a parking ratio
  - Local governments may still impose minimums on projects of 20+ units or with regulated affordable
    housing if they publish written findings and report annually to DOLA
  implementation_status: legally_effective
  litigation:
    status: challenged
    note: Challenged together with HB24-1313 in the 2025 home-rule cities' suit in Denver District Court;
      no ruling found on a court page. See co.home_rule_suit_2025.
    citation: null
