  title: 'Vermont Act 181 of 2024: location-based Act 250 jurisdiction (Tier 1A/1B)'
  citation: 2023, No. 181 (Adj. Sess.) (Act 181 of 2024), H.687; as amended by Act 152 of 2026
  url: https://legislature.vermont.gov/Documents/2024/Docs/ACTS/ACT181/ACT181%20Act%20Summary.pdf
  session: 2023-2024 biennium, 2024 adjourned session
  bill: H.687
  enacted_date: null
  effective_dates:
  - date: 2024-06-17
    applies_to: First of several effective dates
  geographic_scope: 'Tier 1A: full Act 250 exemption in areas approved by the Land Use Review Board on
    a municipal application. Tier 1B: Act 250 exemption for housing projects of up to 50 units in areas
    where the municipality opts in. Both are limited to downtown/village centers and planned growth areas,
    and village areas for 1B, on Board-approved regional future land use maps.'
  exclusions:
  - Tier 1B requires water, wastewater or septic-suitable soils, a confirmed plan, and permanent zoning
    and subdivision rules
  - Flood hazard and river corridor areas are excluded unless adequately regulated
