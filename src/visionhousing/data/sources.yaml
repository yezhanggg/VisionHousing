  - id: hud_dda
    name: Low-Income Housing Tax Credit Difficult Development Areas
    publisher: U.S. Department of Housing and Urban Development
    url_pattern: https://services.arcgis.com/VTyQ9soqVukalItT/arcgis/rest/services/Difficult_Development_Areas_2026/FeatureServer/0/query  # secret-scan: allow (a public URL path, not a key)
    vintage: HUD's latest designations (map item titled 2027, updated 2026-10-28)
    geography: [zcta, county]
    licence: Public domain (U.S. government work)
    terms_url: https://www.huduser.gov/portal/sadda/sadda_qct.html
    parser: incentives.read_feature_page
    limits: >-
      In metro areas, Difficult Development Areas are ZIP Code Tabulation Areas
      (ZCTAs); outside them, whole counties. A tract is matched to ZCTAs by shared
      land area, so a tract on a ZCTA edge can be partly in a DDA.
    tier: 0
    access: feature_service
