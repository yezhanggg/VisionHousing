  exclusions:
  - Developer-initiated parcel rezonings not studied
  implementation_status: unknown
  litigation:
    status: not_applicable
    note: ''
    citation: null
    url: null
  outcome_measure: Additional housing units on upzoned parcels vs. matched non-upzoned parcels
  denominator: Upzoned parcels vs. propensity-score-matched comparison parcels
  horizon: 4 years after upzoning
  observed_result:
    summary: Seven neighborhood upzonings produced more than 4,000 additional housing units within four
      years relative to similar non-upzoned parcels; Gowanus showed the largest effect; Jerome Avenue
      (Bronx) showed no significant change.
    value: 4000
    unit: additional housing units within 4 years (lower bound, 'more than')
