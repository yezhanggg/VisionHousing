      cities of the first class (Philadelphia) or second class (Pittsburgh)

scenarios:

  baseline:
    title: "Baseline"
    kind: baseline
    priority: must
    handbook_text: >-
      Housing production under the current regulatory and economic environment,
      with no policy changes.
    description: "Today's rules and economics, projected from recent building permits."
    reforms: []
    source: [*handbook]

  adu:
    title: "Accessory dwelling units"
    kind: benchmark
    priority: must
    handbook_text: >-
      Model the effect of allowing one ADU on parcels with existing single-family
      buildings. Assume detached and semi-detached ADUs of at least 600 square feet
      are allowed, and no additional parking is required.
    description: >-
      One ADU of at least 600 sq ft on every lot with a single-family home, with no
      added parking.
    reforms: [adu]
    building_types: [sf_detached, sf_attached]
    source: [*handbook]
    notes:
      - "Attached single-family lots are included at a much lower physical fit."

  missing_middle:
    title: "Missing middle"
    kind: benchmark
    priority: should
    handbook_text: >-
      Model the effect of allowing 2–6 dwelling units on parcels currently
      restricted to single-family use, with building heights up to three stories.
      This scenario reflects the “gentle density” reforms (e.g., townhouses,
      2–6-unit multifamily buildings) advancing across states and cities
      nationwide. Teams may assume that setback and lot coverage requirements do
      not constrain the development of 2–6 units on a parcel currently restricted
      to single-family use.
    description: "Two to six homes, up to three storeys, on lots now zoned for one home."
    reforms: [missing_middle]
    building_types: [sf_detached]
    source: [*handbook]
    notes:
      - "Setbacks and lot coverage are assumed not to bind, as the Handbook allows."

  tod:
    title: "Transit-oriented density"
    kind: benchmark
    priority: could
    handbook_text: >-
      Model the effect of increasing allowable residential density near major
      transit stops through higher building heights and/or increased floor area
      ratios. Teams should define major transit stops and justify their transit
      proximity threshold. Teams may assume that parking requirements are reduced
      or eliminated.
    description: >-
      More height and floor area near major transit stops (a rail station, or a bus
      stop with frequent weekday service; distances in the Model and Assumptions
      Overview), with reduced parking.
    reforms: [tod, parking]
    source: [*handbook]
    notes:
      - "Transit-specific ledger entries are added when this scenario is built."

  parking:
    title: "Parking requirement reduction"
    kind: benchmark
    priority: must
    handbook_text: >-
      Model the effects of reducing or eliminating minimum parking requirements for
      new residential development. Specify assumptions about developer-provided
      parking in the absence of mandates.
    description: >-
      Residential parking minimums removed. Developers still build part of the old
      requirement: a smaller share near frequent transit than elsewhere (both shares
      are ranges in the Assumption Ledger).
    reforms: [parking]
    source: [*handbook]

  fees:
    title: "Development fee reduction"
    kind: benchmark
    priority: must
    handbook_text: >-
      Model the effect of reducing total development fees (planning, environmental
      review, building, and impact fees) by 50% across all major fee categories. For
      comparability across submissions, Teams should assume development fees total
      $50,000 per unit across all major fee categories.
    description: "Fees cut by half, from $50,000 to $25,000 per unit."
    reforms: [fees]
    source: [*handbook]

  pa_hb2186:
    title: "Pennsylvania HB 2186: one ADU by right on any residential lot"
    kind: state
    priority: should
    description: >-
      One ADU by right on every lot where a residential building is permitted, in
      every municipality with zoning, including Philadelphia and Pittsburgh. No
      added parking; towns may not require owner occupancy.
    reforms: [adu]
    building_types: [sf_detached, sf_attached, two_to_four]
    source: [*hb2186, *hb2186_text]
    notes:
      - "Section 6302: permitted use by right, one ADU per lot or parcel, wherever a residential building is permitted."
      - "Section 6305: towns may not require more than 200 sq ft minimum, nor cap size below the lesser of 850 sq ft or 50% of the house."
      - "Lots with five or more homes are left out; an ADU rarely fits on them."
      - "The modelled ADU keeps the benchmark size, so the gap to the benchmark comes from eligibility."
      - "Not law. Re-check the bill's status after the session ends on Nov 30, 2026."

  pa_sb1346:
    title: "Pennsylvania SB 1346: ADUs on single-family detached lots outside Philadelphia and Pittsburgh"
    kind: state
    priority: should
    description: >-
      Every municipality under the Municipalities Planning Code must permit at
      least one ADU for each single-family detached home. The Code does not reach
      Philadelphia or Pittsburgh, so both keep today's rules. An ADU may not be
      treated as a new use for utility connection fees.
    reforms: [adu]
    building_types: [sf_detached]
    excluded_places:
      - name: "Philadelphia"
        reason: "City of the first class; outside the Municipalities Planning Code."
      - name: "Pittsburgh"
        reason: "City of the second class; outside the Municipalities Planning Code."
    overrides:
      adu.utility_connection_fee: 0
    source: [*sb1346, *sb1346_text, *mpc_scope]
    notes:
      - "Section 603.2(a): at least one ADU for each single-family detached dwelling unit."
      - "Section 603.2(k): an ADU is not a new residential use for connection fees or capacity charges."
      - "Not law. Laid on the table on Nov 17, 2026; re-check after the session ends on Nov 30, 2026."

  # ---------------------------------------------------------------- extra scenarios
  # Named policies beyond the five benchmarks (kind: extra). The benchmark presets
  # above are unchanged; each extra scenario is its own reform with its own ledger
  # entries and says which benchmark it builds on. Methods:
  # docs/methods/extra_scenarios.md.

  transit_zoning_funded_infrastructure:
    title: "Transit zoning with funded infrastructure"
    kind: extra
    priority: could
    description: >-
      The TOD benchmark's upzoning near major transit stops, plus public money (or
      financing) for the water, sewer and power capacity station areas need. Permits
      that need the new capacity count only after it enters service; permits that
      were feasible without the money are never credited to it.
    reforms: [transit_zoning_funded_infrastructure]
    source:
      - id: co_hb26_1065
        citation: >-
          Colorado HB26-1065, transit and housing investment zones (2026 Colo. Sess.
          Laws ch. 157)
        url: https://leg.colorado.gov/bills/hb26-1065
        accessed: 2026-11-24
      - id: ut_htrz_code
        citation: >-
          Utah Code Title 63N, Chapter 23, Part 2, Housing and Transit Reinvestment Zones
        url: https://le.utah.gov/xcode/Title63N/Chapter23/63N-23-P2.html
        accessed: 2026-11-24
    notes:
      - "Same funnel and draws as the TOD benchmark; cannot share a package with it."
      - "Water and sewer readiness from the pack's infra_tract table where an official record exists; elsewhere 'unknown' with a wide need range."

  commercial_land_housing:
    title: "Housing by right on commercial land"
    kind: extra
    priority: could
    description: >-
      Apartment buildings (36+ homes per acre, at most one required parking space
      per home) allowed by right on land used for shops and offices. New
      construction, so counted in the Building Permits Survey measure.
    reforms: [commercial_land_housing]
    source:
      - id: tx_sb840_2025_text
        citation: >-
          Texas SB 840, 89th Legislature (2025), enrolled text (Local Government Code
          chapter 218)
        url: https://capitol.texas.gov/tlodocs/89R/billtext/html/SB00840F.htm
        accessed: 2026-11-25
    notes:
      - "Eligible land is read from parcel land use where a county has it (Pennsylvania: Philadelphia and Allegheny); elsewhere 'eligible land not measured'."
      - "Cannot share a package with the TOD reforms: commercial land near stations is already TOD land."

  adaptive_reuse:
    title: "Adaptive reuse: office and retail conversions"
    kind: extra
    priority: could
    description: >-
      Existing office and retail buildings converted into apartments. A conversion
      is an alteration, which the Building Permits Survey leaves out, so its homes
      are reported in a separate record, outside the permit total.
    reforms: [adaptive_reuse]
    source:
      - id: tx_sb840_2025_text
        citation: >-
          Texas SB 840, 89th Legislature (2025), enrolled text, Local Government Code
          chapter 218, subchapter C (conversions of commercial buildings)
        url: https://capitol.texas.gov/tlodocs/89R/billtext/html/SB00840F.htm
        accessed: 2026-11-25
    notes:
      - "Adds 0 to added units authorized; conversions are the record conversion_homes."

  starter_home_lots:
    title: "Starter-home lots"
    kind: extra
    priority: could
    description: >-
      Smaller minimum lots (3,000-5,000 sq ft) for new subdivisions on single-family
      land: owners split off a lot for a small house, or a builder replaces a house
      with two or three small homes.
    reforms: [starter_home_lots]
    building_types: [sf_detached]
    source:
      - id: tx_sb15_2025_text
        citation: >-
          Texas SB 15, 89th Legislature (2025), enrolled text (Local Government Code
          sections 211.051-211.058)
        url: https://capitol.texas.gov/tlodocs/89R/billtext/html/SB00015F.htm
        accessed: 2026-11-24
    notes:
      - "Cannot share a package with the ADU or missing-middle reforms (same single-family lots)."
      - "Existing homes replaced are reported and subtracted in net added homes."

  fee_deferral_with_affordability:
    title: "Fee deferral or waiver with affordability terms"
    kind: extra
    priority: could
    description: >-
      Rental projects that keep part of their homes affordable to lower-income
      households pay their development fees at occupancy instead of at permit
      (deferral), or have them waived. Both are run on the same draws; deferral is
      the headline.
    reforms: [fee_deferral_with_affordability]
    building_types: [two_to_four, five_plus]
    source:
      - id: hud_income_limits_fy2026
        citation: >-
          U.S. Department of Housing and Urban Development, FY2026 income limits
          (Section 8), county 50% limits; 60% = 1.2 x the 50% limit as for tax-credit limits
        url: https://www.huduser.gov/portal/datasets/il.html
    notes:
      - "Cannot share a package with the fee benchmark (the same fees)."
      - "The $50,000 benchmark fee is the fee deferred or waived."
