  - adu
  title: 'Arizona HB 2946 (2026): caps on city development fees for accessory dwelling units'
  citation: Laws 2026, ch. 121 (HB 2946); A.R.S. 9-463.05(U), 9-499.15, 9-511.01
  url: https://www.azleg.gov/legtext/57leg/2R/laws/0121.htm
  session: 2026 Fifty-seventh Legislature, Second Regular Session
  bill: HB 2946
  enacted_date: 2026-06-04
  effective_dates:
  - date: 2026-09-12
    applies_to: Whole act (2026 general effective date; the act has no emergency or delayed-date clause)
  - date: 2027-01-01
    applies_to: 'A.R.S. 9-511.01(A)(3): the growth-related part of a water or wastewater fee adopted or raised
      after 2026-12-31 must follow the development-fee rules of 9-463.05'
  geographic_scope: All cities and towns that charge development (impact) fees. Counties are not covered
    by the amended sections.
  exclusions:
  - Cities that already set fees by home size or bedroom count before the amendment may keep doing so
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - 'ADU fees: water and sewer fees may not exceed the extra demand the ADU adds (same meter or separate);
    all other development fees may not exceed the lesser of 25% of the total fees or the single-family
    share for those services.'
  - Also bars new size- or bedroom-based distinctions among single-family homes in development fees.
  - A cap on fees for one housing type, not a general fee cut; the 25% share is the closest Arizona analogue
    to the fee-reduction reform.
  retrieved: 2026-11-24
  verified: true
  verification_note: Chaptered text on azleg.gov (Chapter 121) shows 'APPROVED BY THE GOVERNOR JUNE 4, 2026',
