# Calibration (validation): baseline card and state reconciliation (generated; do not edit).
# Written by `visionhousing baseline-card` from the Census Building Permits Survey
# state annual files and monthly year-to-date files. What the baseline reads, the
# shipped rule applied to each state's own totals (a release fixture), the
# Pennsylvania window sensitivity and the 2026 nowcast. Changes no estimate
# (settings: assumptions/baseline_card.yaml).
# Method: docs/modules/baseline.md ("Baseline card").

version: 1
id: baseline_reconciliation_2026_11
label: Baseline card and state reconciliation (Building Permits Survey state files)
status: validation
use: 'The API shows each state''s card beside the baseline; the release fixture test checks the reconciled
  values. Changes no estimate. Method: docs/modules/baseline.md.'
provenance:
  summary: What the baseline reads (years, permit columns, data release, information cutoff, forecast
    gap), the shipped rule applied to each state's own totals, a Pennsylvania window sensitivity and a
    2026 nowcast diagnostic.
  method: Census Building Permits Survey state annual and monthly year-to-date files; visionhousing.baseline.card;
    settings in assumptions/baseline_card.yaml (baseline_card).
  generated_by: visionhousing baseline-card
  sources:
  - id: bps_state_annual
    citation: U.S. Census Bureau, Building Permits Survey, state annual files
    url: https://www2.census.gov/econ/bps/State/
    licence: Public domain (U.S. government work)
  - id: bps_state_monthly_ytd
    citation: U.S. Census Bureau, Building Permits Survey, state monthly year-to-date files
    url: https://www2.census.gov/econ/bps/State/
    licence: Public domain (U.S. government work)
  limits:
  - The state component checks the state-level arithmetic only; it does not check the county split, the
    range or any reform.
  - Vermont's middle value is not reproduced here (county shrinkage).
  - Release dates are Last-Modified dates on the Census server.
card:
  unit_fields:
  - est_1_units
  - est_2_units
  - est_3-4_units
  - est_5+_units
  unit_fields_label: Estimated units in 1-, 2-, 3-4 and 5+ unit buildings (Building Permits Survey)
  data_release:
    source: bps_state_annual
    vintage: 2025 annual files (final)
    last_full_year: 2025
    release_date: '2026-05-14'
    release_date_basis: Last-Modified date of the state annual file
  information_cutoff: '2026-11-24'
  information_cutoff_basis: as_of in assumptions/outcome.yaml
  forecast_window:
  - 2027
  - 2031
  forecast_gap:
  - 2026
  forecast_gap_text: 2026 has no full-year permit count by the cutoff; the baseline carries the 2025 rule
    level through it.
