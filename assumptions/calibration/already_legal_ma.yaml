# The range written into the ledger for adu.already_legal_share in Massachusetts.
range:
  low: 0.55
  central: 0.70
  high: 0.82
  shape: pert
  how:
    low: >-
      The statute makes one ADU an as-of-right use in every single-family
      district outside Boston. The low end assumes that almost half of lots
      still fall short of the benchmark: single-family homes outside
      single-family districts (common in older cities), homes under 1,200 sq
      ft (where the half-size cap keeps an ADU under 600 sq ft), towns that
      require the one parking space, and bylaws not yet aligned in practice.
    central: >-
      Seven in ten lots: the statute applies statewide and the state survey
      shows permits issued in most towns, but its scope (single-family districts
      only, the half-size cap, one parking space) is narrower than the
      benchmark's. Team judgement.
    high: >-
      Most lots, but not all: Boston is outside chapter 40A and the half-size
      cap and parking rule remain, so the high end stops at 82%, below
      Vermont's 85% (whose statute has no size cap tied to the house).

limits:
  - "No lot-level measure of single-family district coverage, house sizes under 1,200 sq ft or local parking rules; the range is team judgement."
  - "A share of lots is assumed for every tract; Boston's lots are not told apart."
  - "The missing-middle share keeps the ledger's national default (no statewide 2-6 unit law)."
