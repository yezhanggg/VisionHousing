  title: Arlington County Expanded Housing Option (2 to 6 homes on lots zoned for one)
  citation: Arlington County Zoning Ordinance § 10.4, Expanded Housing Option amendments
  url: https://www.arlingtonva.us/About-Arlington/Newsroom/Articles/2023/County-Board-Adopts-Expanded-Housing-Options
  session: null
  bill: null
  enacted_date: 2023-03-22
  effective_dates:
  - date: 2023-07-01
    applies_to: EHO development allowed in R-20, R-10, R-8, R-6 and R-5 districts; permit applications open
  - date: 2025-10-01
    applies_to: EHO permit type available again for new applications after the appeal ruling
  geographic_scope: One-family residential districts R-20 to R-5
  exclusions: []
  implementation_status: locally_implemented
  litigation:
    status: decided
    note: Circuit Court declared the amendments void and barred new EHO permits on 2024-09-27; the Court
      of Appeals of Virginia reversed and remanded on 2025-09-05; the Supreme Court of Virginia agreed in
      May 2026 to hear a related appeal without halting EHO development.
    citation: Nordgren v. Arlington County Board
    url: https://www.arlingtonva.us/Government/Departments/CAO/EHO-Trial-and-Appeal-Information
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - The rule was usable for about 15 months (2023-07-01 to 2024-09-27), then halted until late 2025
  - The adopted program capped EHO permits at 58 a year, spread around the County, so the possible effect
    on permits is small by design
  retrieved: 2026-11-24
