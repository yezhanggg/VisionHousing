# VisionHousing Assumption Ledger.
#
# Every number the model needs but cannot read from data lives here, never in code.
# Each entry: label, unit, central, low, high, shape (pert | triangular | fixed),
# kind (sourced | calibrated | benchmark | judgement), source (list of id, citation,
# url, accessed), rationale, used_by, revisit, status (draft | sourced).
#
# status "sourced": checked against a source with a web address and a date.
# status "draft":   the team's judgement, with a deliberately wide range, waiting
#                   for evidence; the "revisit" note says what would change it.
#
# Shares and rates are written as decimals (0.066 = 6.6%). Money is in current
# U.S. dollars unless the rationale says otherwise.
#
# The file is checked by visionhousing.ledger on load; see docs/modules/ledger.md.

version: 1

# Sources used by more than one entry (YAML anchors; each "*name" repeats the source).
_sources:
  - &handbook
    id: handbook_benchmarks
    citation: >-
      Housing Data and Technology Innovation Challenge, Participant Handbook,
      "Benchmark Policy Scenarios" and "The five scenarios"
    url: https://housingchallenge.turnout.rocks/handbook.html
    accessed: 2026-11-22
  - &pmms
    id: freddie_mac_pmms
    citation: >-
      Freddie Mac, Primary Mortgage Market Survey, weekly history file, 30-year
      fixed rate (2026 weeks through Nov 19, 2026)
    url: https://www.freddiemac.com/pmms/docs/PMMS_history.csv
    accessed: 2026-11-22
  - &acs_b25031
    id: acs_2024_5yr_b25031
    citation: >-
      U.S. Census Bureau, American Community Survey 2020-2024 5-year estimates,
      table B25031 (median gross rent by bedrooms), table-based summary file,
      county rows for Pennsylvania (67 counties)
    url: https://www2.census.gov/programs-surveys/acs/summary_file/2024/table-based-SF/data/5YRData/acsdt5y2024-b25031.dat  # secret-scan: allow (public web address)
    accessed: 2026-11-22
  - &vtpi
    id: vtpi_parking_costs_2022
    citation: >-
      Victoria Transport Policy Institute, Transportation Cost and Benefit
      Analysis II, chapter 5.4 "Parking Costs" (version of 3 October 2022),
      Table 5.4.4-1
    url: https://www.vtpi.org/tca/tca0504.pdf
    accessed: 2026-11-22
  - &ucla_parking
    id: ucla_its_parking_2026
    citation: >-
      UCLA Institute of Transportation Studies (February 2026), "No Such Thing as
      Free Parking", construction cost per space from 2025 Rider Levett Bucknall
      cost data for 17 U.S. cities, excluding land
    url: https://www.its.ucla.edu/2026/02/19/no-such-thing-as-free-parking  # secret-scan: allow (public web address)
    accessed: 2026-11-22
  - &pew_adu
    id: pew_adu_2026
    citation: >-
      The Pew Charitable Trusts (October 2026), "Accessory Dwelling Units Can
      Meaningfully Boost Housing Supply"; ADU permits in 2025 in the 346 most
      populous U.S. cities, 158 of them with permissive ordinances
    url: https://www.pew.org/research-and-analysis/reports/2026/10/accessory-dwelling-units-can-meaningfully-boost-housing-supply  # secret-scan: allow (public web address)
    accessed: 2026-11-22
  - &seattle_adu
    id: seattle_adu_report_2023
    citation: >-
      City of Seattle, Office of Planning and Community Development and
      Department of Construction and Inspections, "2023 Accessory Dwelling Unit
      Report", page 10
    url: https://www.seattle.gov/documents/Departments/OPCD/OngoingInitiatives/EncouragingBackyardCottages/OPCD-ADU-Report-2023.pdf  # secret-scan: allow (public web address)
    accessed: 2026-11-22
  - &mass_adu
    id: massachusetts_adu_first_year
    citation: >-
      Commonwealth of Massachusetts, press release "Governor Healey announces more
      than 1,200 ADUs approved in first year, with more to come"
    url: https://mass.gov/news/governor-healey-announces-more-than-1200-adus-approved-in-first-year-with-more-to-come
    accessed: 2026-11-22

parameters:

  # ---------------------------------------------------------------- baseline

  baseline.horizon_years:
    label: "Years in the projection horizon"
    unit: "years"
    central: 5
    low: 5
    high: 5
    shape: fixed
    kind: benchmark
    source: [*handbook]
    rationale: "The Handbook asks every team to assume a five-year horizon."
    used_by: [baseline, adu, missing_middle, tod, parking, fees, pa_hb2186, pa_sb1346]
    revisit: "Only if the Handbook changes."
    status: sourced

  baseline.first_year:
    label: "First calendar year counted"
    unit: "year"
    central: 2027
    low: 2027
    high: 2027
    shape: fixed
    kind: judgement
    source: []
    rationale: >-
      Reforms are assumed to take effect on January 1, 2027, so the five years
      counted are 2027-2031 (project decisions D-02 and D-14).
    used_by: [baseline, adu, missing_middle, tod, parking, fees, pa_hb2186, pa_sb1346]
    revisit: "Change only if the assumed effective date changes."
    status: draft

  baseline.recent_window_years:
    label: "Years in the recent-average baseline rule"
    unit: "years"
    central: 5
    low: 3
    high: 10
    shape: triangular
    kind: judgement
    source: []
    rationale: >-
      The baseline projects each county's permits from a weighted recent average.
      Five years is a common window; the range covers the short and long rules
      the backtest compares.
    used_by: [baseline]
    revisit: "Set by the rolling-origin backtest (job T1); then kind becomes calibrated."
    status: draft

  baseline.trend_damping:
    label: "Damping applied to the recent permit trend"
    unit: "share"
    central: 0.5
    low: 0.0
    high: 1.0
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      0 ignores the recent trend (flat average); 1 carries it forward in full.
      Half is a neutral starting point.
    used_by: [baseline]
    revisit: "Set by the rolling-origin backtest (job T1)."
    status: draft

  baseline.cycle_quantile_weak:
    label: "Error quantile used for a weak housing cycle"
    unit: "share"
    central: 0.2
    low: 0.2
    high: 0.2
    shape: fixed
    kind: judgement
    source: []
    rationale: >-
      The "weak cycle" choice reads the 20th percentile of the historical
      actual-to-projected error distribution.
    used_by: [baseline]
    revisit: "Review once the backtest error distribution is published."
    status: draft

  baseline.cycle_quantile_typical:
    label: "Error quantile used for a typical housing cycle"
    unit: "share"
    central: 0.5
    low: 0.5
    high: 0.5
    shape: fixed
    kind: judgement
    source: []
    rationale: "The \"typical cycle\" choice reads the median of the historical error distribution."
    used_by: [baseline]
    revisit: "Review once the backtest error distribution is published."
    status: draft

  baseline.cycle_quantile_strong:
    label: "Error quantile used for a strong housing cycle"
    unit: "share"
    central: 0.8
    low: 0.8
    high: 0.8
    shape: fixed
    kind: judgement
    source: []
    rationale: >-
      The "strong cycle" choice reads the 80th percentile of the historical error
      distribution.
    used_by: [baseline]
    revisit: "Review once the backtest error distribution is published."
    status: draft

  # ---------------------------------------------------------------- shared economics

  econ.mortgage_rate_30y:
    label: "30-year fixed mortgage rate"
    unit: "share per year"
    central: 0.066
    low: 0.055
    high: 0.0775
    shape: pert
    kind: sourced
    source: [*pmms]
    rationale: >-
      The 2026 average of the weekly 30-year rate was 6.56%, with weeks between
      5.98% and 7.40%; the latest week (Nov 19, 2026) was 7.28%. The range is a
      little wider than 2026's because the horizon runs to 2031.
    used_by: [adu, missing_middle, pa_hb2186, pa_sb1346]
    revisit: "Refresh from the PMMS file when the data pack is rebuilt."
    status: sourced

  supply.elasticity_medium_run:
    label: "Medium-run supply response to a change in profit per unit"
    unit: "ratio"
    central: 1.0
    low: 0.3
    high: 2.0
    shape: pert
    kind: judgement
    source:
      - id: saiz_2010_qje
        citation: >-
          Albert Saiz (2010), "The Geographic Determinants of Housing Supply",
          Quarterly Journal of Economics 125(3), 1253-1296, Table VI (metro areas
          with population over 500,000)
        url: https://doi.org/10.1162/qjec.2010.125.3.1253
        accessed: 2026-11-22
      - id: baum_snow_han_2024_jpe
        citation: >-
          Nathaniel Baum-Snow and Lu Han (2024), "The Microgeography of Housing
          Supply", Journal of Political Economy 132(6), 1897-1946, abstract
        url: https://ideas.repec.org/a/ucp/jpolec/doi10.1086-728110.html
        accessed: 2026-11-22
    rationale: >-
      Percent change in permitted units for a 1% change in the value-to-cost
      margin. Published metropolitan housing-supply elasticities for older
      northeastern metros mostly sit between about 0.5 and 2; 1.0 is a neutral
      central value until the cross-check job is run.
    used_by: [fees, parking, tod]
    revisit: >-
      Cite the metro elasticity study and the 2024 tract-level study after reading
      them (backlog P4-05); cross-check with job T6.
    status: draft

  supply.saving_passthrough_k:
    label: "Share of a cost saving that reaches the decision to build"
    unit: "share"
    central: 0.5
    low: 0.2
    high: 0.9
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      Part of any cut in fees or parking cost is captured by landowners as higher
      land prices rather than turning into more homes. Half is a neutral start;
      the range is wide because the evidence on who bears fees is mixed.
    used_by: [fees, parking, tod]
    revisit: "Read the evidence on fee incidence (backlog P4-05) and narrow the range."
    status: draft

  # ---------------------------------------------------------------- fees (benchmark 5)

  fees.fee_total_per_unit:
    label: "Development fees per unit, all major categories"
    unit: "$/unit"
    central: 50000
    low: 50000
    high: 50000
    shape: fixed
    kind: benchmark
    source: [*handbook]
    rationale: >-
      The Handbook: "Teams should assume development fees total $50,000 per unit
      across all major fee categories."
    used_by: [fees]
    revisit: "Only if the Handbook changes."
    status: sourced

  fees.fee_cut_share:
    label: "Cut applied to every fee category"
    unit: "share"
    central: 0.5
    low: 0.5
    high: 0.5
    shape: fixed
    kind: benchmark
    source: [*handbook]
    rationale: "The Handbook's fee scenario reduces total development fees by 50% across all major categories."
    used_by: [fees]
    revisit: "Only if the Handbook changes."
    status: sourced

  fees.pa_documented_fee_per_unit:
    label: "Typical Pennsylvania development fees per new home (second view)"
    unit: "$/unit"
    central: 15000
    low: 5000
    high: 40000
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      For the labelled second view (decision D-09) that uses state fee levels
      instead of the benchmark. Permit, tap and impact fees for a new home in
      Pennsylvania are likely well under $50,000; the range is wide until sourced.
    used_by: [fees]
    revisit: "Source per-unit impact, tap and permit fees for typical new homes (P4-05)."
    status: draft

  # ---------------------------------------------------------------- parking (benchmark 4)

  parking.cost_per_space_surface:
    label: "Cost of one surface parking space, land and construction"
    unit: "$/space"
    central: 8000
    low: 4000
    high: 15000
    shape: pert
    kind: sourced
    source: [*vtpi]
    rationale: >-
      The review's summary table puts surface parking land and construction at
      about $8,000 per space in 2022 dollars. Low covers cheap rural land; high
      covers urban land.
    used_by: [parking, tod, missing_middle, adu]
    revisit: "Update the price year to 2026 and check against a Pennsylvania cost estimate."
    status: sourced

  parking.cost_per_space_structured:
    label: "Cost of one space in an above-ground parking structure"
    unit: "$/space"
    central: 52000
    low: 29000
    high: 99000
    shape: pert
    kind: sourced
    source: [*ucla_parking]
    rationale: >-
      Above-ground structures averaged about $52,000 per space across 17 cities,
      from $29,000 (Phoenix, Washington DC) to $99,000 (Portland), excluding land.
    used_by: [parking, tod]
    revisit: "Check whether Philadelphia or Pittsburgh is among the 17 cities and use its value."
    status: sourced

  parking.cost_per_space_underground:
    label: "Cost of one underground parking space"
    unit: "$/space"
    central: 73000
    low: 40000
    high: 111000
    shape: pert
    kind: sourced
    source: [*ucla_parking]
    rationale: >-
      Underground parking averaged about $73,000 per space across 17 cities, from
      $40,000 (Washington DC) to $111,000 (Portland), excluding land.
    used_by: [parking, tod]
    revisit: "Check whether Philadelphia or Pittsburgh is among the 17 cities and use its value."
    status: sourced

  parking.required_spaces_per_unit_multifamily:
    label: "Parking spaces required per apartment under current rules"
    unit: "spaces/unit"
    central: 1.5
    low: 1.0
    high: 2.0
    shape: pert
    kind: judgement
    source: []
    rationale: "Common local minimums for apartments are one to two spaces per unit."
    used_by: [parking, tod]
    revisit: "Replace with a sample of Pennsylvania zoning codes (P4-08)."
    status: draft

  parking.required_spaces_per_unit_attached:
    label: "Parking spaces required per townhouse or small multi-unit home"
    unit: "spaces/unit"
    central: 2.0
    low: 1.0
    high: 2.0
    shape: pert
    kind: judgement
    source: []
    rationale: "Townhouse and two-to-four-unit minimums are usually one to two spaces per unit."
    used_by: [parking, missing_middle]
    revisit: "Replace with a sample of Pennsylvania zoning codes (P4-08)."
    status: draft

  parking.share_still_built_transit_rich:
    label: "Share of formerly required spaces still built, transit-rich tracts"
    unit: "share"
    central: 0.60
    low: 0.45
    high: 0.75
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      Decision D-08: after minimums are removed, projects near frequent transit
      still build about 60% of the spaces once required, because lenders and
      buyers still want parking.
    used_by: [parking, tod]
    revisit: "Cite the post-reform studies of what developers built (backlog P4-01)."
    status: draft

  parking.share_still_built_elsewhere:
    label: "Share of formerly required spaces still built, other tracts"
    unit: "share"
    central: 0.925
    low: 0.85
    high: 1.0
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      Decision D-08: away from transit, most projects keep building close to the
      old minimum (85-100%), so the saving is small.
    used_by: [parking]
    revisit: "Cite the post-reform studies of what developers built (backlog P4-01)."
    status: draft

  parking.mix_structured_transit_rich:
    label: "Share of spaces in above-ground structures, transit-rich tracts"
    unit: "share"
    central: 0.40
    low: 0.15
    high: 0.70
    shape: pert
    kind: judgement
    source: []
    rationale: "Where land is dear, more parking is stacked in structures; the rest is surface or underground."
    used_by: [parking, tod]
    revisit: "Estimate from local project data or land prices."
    status: draft

  parking.mix_underground_transit_rich:
    label: "Share of spaces underground, transit-rich tracts"
    unit: "share"
    central: 0.10
    low: 0.0
    high: 0.30
    shape: pert
    kind: judgement
    source: []
    rationale: "Underground parking is mostly limited to large projects in the densest places."
    used_by: [parking, tod]
    revisit: "Estimate from local project data or land prices."
    status: draft

  parking.mix_structured_elsewhere:
    label: "Share of spaces in structures, other tracts"
    unit: "share"
    central: 0.05
    low: 0.0
    high: 0.20
    shape: pert
    kind: judgement
    source: []
    rationale: "Outside dense areas almost all residential parking is surface or garage parking."
    used_by: [parking]
    revisit: "Estimate from local project data or land prices."
    status: draft

  parking.site_yield_gain:
    label: "Extra units a small site can hold when parking is not required"
    unit: "share"
    central: 0.05
    low: 0.0
    high: 0.15
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      Land no longer needed for parking can hold more homes on tight sites. The
      gain is small on average and zero where land is plentiful.
    used_by: [parking, tod]
    revisit: "Test with the pro forma on typical lot sizes; cite site-yield studies."
    status: draft

  # ---------------------------------------------------------------- ADUs (benchmark 1)

  adu.units_per_lot:
    label: "ADUs allowed per lot"
    unit: "units/lot"
    central: 1
    low: 1
    high: 1
    shape: fixed
    kind: benchmark
    source: [*handbook]
    rationale: "The Handbook's ADU scenario allows one ADU on parcels with an existing single-family building."
    used_by: [adu, pa_hb2186, pa_sb1346]
    revisit: "Only if the Handbook changes."
    status: sourced

  adu.min_size_sqft:
    label: "Smallest ADU the benchmark allows"
    unit: "sq ft"
    central: 600
    low: 600
    high: 600
    shape: fixed
    kind: benchmark
    source: [*handbook]
    rationale: "The Handbook assumes detached and semi-detached ADUs of at least 600 square feet are allowed."
    used_by: [adu]
    revisit: "Only if the Handbook changes."
    status: sourced

  adu.added_parking_spaces:
    label: "Added parking spaces required for an ADU"
    unit: "spaces/unit"
    central: 0
    low: 0
    high: 0
    shape: fixed
    kind: benchmark
    source: [*handbook]
    rationale: "The Handbook's ADU scenario requires no additional parking."
    used_by: [adu, pa_hb2186, pa_sb1346]
    revisit: "Only if the Handbook changes."
    status: sourced

  adu.unit_size_sqft:
    label: "Floor area of the modelled ADU"
    unit: "sq ft"
    central: 600
    low: 600
    high: 900
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      The pro forma prices a unit at the benchmark minimum, with some owners
      building larger. The same size is used in every ADU scenario so that
      differences between scenarios come from eligibility, not size.
    used_by: [adu, pa_hb2186, pa_sb1346]
    revisit: "Check against size data in published ADU permit reports."
    status: draft

  adu.already_legal_share:
    label: "Share of eligible lots where an ADU is already effectively legal"
    unit: "share"
    central: 0.10
    low: 0.05
    high: 0.25
    shape: pert
    kind: judgement
    source:
      - id: ev.adu.pew_national_2025
        citation: >-
          Evidence library entry ev.adu.pew_national_2025: The Pew Charitable Trusts
          (October 2026), "Accessory Dwelling Units Can Meaningfully Boost Housing
          Supply", Table 1
        url: https://www.pew.org/en/research-and-analysis/reports/2026/10/accessory-dwelling-units-can-meaningfully-boost-housing-supply  # secret-scan: allow (public web address)
        accessed: 2026-11-22
    rationale: >-
      The default for any state without its own town-rule index; Pennsylvania
      replaces it from assumptions/calibration/adu_legal_share.yaml. Lots where
      ADUs are already allowed by right add nothing under the reform. In states
      without an ADU preemption law, 25 of 196 cities of 100,000 or more (13%)
      had permissive ADU rules in April 2026, and smaller places tend to be more
      restrictive, so 10% is the central value. The range runs from 5% to 25%,
      because a state with a strong preemption law has most lots already legal
      and needs its own value.
    used_by: [adu, pa_hb2186, pa_sb1346]
    revisit: >-
      For each new state, check whether it has a state ADU law (22 states by
      August 2026) and set a state value; replace with a town-rule index where
      one is built.
    status: draft

  adu.lot_proxy_adjustment:
    label: "Correction from the census building count to real lots"
    unit: "ratio"
    central: 0.90
    low: 0.85
    high: 0.95
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      Counting lots from census units-in-structure tables overstates real lots
      by about 9-13% in two cities where both were measured; this scales it down.
    used_by: [adu, missing_middle, pa_hb2186, pa_sb1346]
    revisit: "Recompute from Tier 2 parcel counties (P5-03)."
    status: draft

  adu.fit_share_sf_detached:
    label: "Share of single-family detached lots with room for the ADU"
    unit: "share"
    central: 0.55
    low: 0.35
    high: 0.90
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      Measured near 0.54 for detached homes in two Pennsylvania cities with
      4-foot setbacks. Suburban and rural lots are larger, so the high end is
      well above the city value.
    used_by: [adu, pa_hb2186, pa_sb1346]
    revisit: "Becomes calibrated from the physical-fit table (D-19, job T3)."
    status: draft

  adu.fit_share_sf_attached:
    label: "Share of semi-detached and row lots with room for the ADU"
    unit: "share"
    central: 0.15
    low: 0.02
    high: 0.35
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      Measured between about 0.02 (rows) and 0.29 (semi-detached) in two cities;
      attached lots rarely have the yard space.
    used_by: [adu, pa_hb2186]
    revisit: "Becomes calibrated from the physical-fit table (D-19, job T3)."
    status: draft

  adu.fit_share_two_to_four:
    label: "Share of two-to-four-unit lots with room for an ADU"
    unit: "share"
    central: 0.10
    low: 0.02
    high: 0.40
    shape: pert
    kind: judgement
    source: []
    rationale: "Measured between about 0.09 and 0.40 in two cities; only HB 2186 reaches these lots."
    used_by: [pa_hb2186]
    revisit: "Becomes calibrated from the physical-fit table (D-19, job T3)."
    status: draft

  adu.hard_cost_per_sqft:
    label: "Construction cost of a new detached ADU per square foot"
    unit: "$/sq ft"
    central: 250
    low: 175
    high: 375
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      No free public survey of ADU costs in Pennsylvania was found. Published
      owner surveys from California report medians near $250 per square foot;
      the range is wide and skewed up for small-unit cost premiums and 2026 prices.
    used_by: [adu, pa_hb2186, pa_sb1346]
    revisit: >-
      Look for a free public cost source (state housing agency, census
      construction cost data, or a Pennsylvania builder survey).
    status: draft

  adu.soft_cost_share:
    label: "Design, permits and contingency as a share of construction"
    unit: "share"
    central: 0.20
    low: 0.12
    high: 0.30
    shape: pert
    kind: judgement
    source: []
    rationale: "Design, permit work and contingency typically add a fifth to construction cost on small projects."
    used_by: [adu, pa_hb2186, pa_sb1346]
    revisit: "Source from public ADU cost guides or owner surveys."
    status: draft

  adu.site_utility_cost:
    label: "Site work and utility runs for one ADU"
    unit: "$/unit"
    central: 15000
    low: 5000
    high: 40000
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      Trenching, sewer and water lines and electrical service; the high end
      covers septic upgrades where there is no public sewer.
    used_by: [adu, pa_hb2186, pa_sb1346]
    revisit: "Source from public ADU cost guides; split sewered and septic lots."
    status: draft

  adu.utility_connection_fee:
    label: "Water and sewer connection fees for one ADU"
    unit: "$/unit"
    central: 3000
    low: 0
    high: 6000
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      Tap fees vary widely by authority; large cities charge a few hundred
      dollars, many suburban authorities several thousand. SB 1346 sets this to 0.
    used_by: [adu, pa_hb2186, pa_sb1346]
    revisit: "Sample published tap-fee schedules of Pennsylvania authorities."
    status: draft

  adu.permit_fee:
    label: "Building and zoning permit fees for one ADU"
    unit: "$/unit"
    central: 2500
    low: 500
    high: 8000
    shape: pert
    kind: judgement
    source: []
    rationale: "Permit fees for a small unit are usually a small fixed fee plus a share of construction value."
    used_by: [adu, pa_hb2186, pa_sb1346]
    revisit: "Sample published fee schedules of Pennsylvania municipalities."
    status: draft

  adu.rent_ratio_1br:
