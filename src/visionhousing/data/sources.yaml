    url_pattern: https://www2.census.gov/geo/tiger/GENZ2020/shp/cb_2020_{state_fips}_tract_500k.zip
    vintage: "2020"
    geography: [tract]
    licence: Public domain (U.S. government work)
    terms_url: https://www.census.gov/geographies/mapping-files/time-series/geo/cartographic-boundary.html
    expected_size: 1938860
    parser: boundaries.read_tracts
    limits: >-
      Generalized (simplified) shapes for maps, not for measuring land area or for
      parcel work. 2020 tracts match the 2020-2024 ACS.
    tier: 0
    access: file
    cleaning: Shapes are simplified further and written as small GeoJSON files per county.
    checked_on: 2026-11-22
    notes: Checked for Pennsylvania (state_fips 42).

  - id: cb_2020_county
    name: Cartographic boundary file, counties, 2020, 1:500,000
    publisher: U.S. Census Bureau
    url_pattern: https://www2.census.gov/geo/tiger/GENZ2020/shp/cb_2020_us_county_500k.zip  # secret-scan: allow (a public URL path, not a key)
    vintage: "2020"
    geography: [county]
    licence: Public domain (U.S. government work)
    terms_url: https://www.census.gov/geographies/mapping-files/time-series/geo/cartographic-boundary.html
    expected_size: 12587934
    parser: boundaries.read_counties
    limits: One national file; generalized shapes for maps only.
    tier: 0
    access: file
    cleaning: Filtered to the state, simplified, written as GeoJSON.
    checked_on: 2026-11-22

  - id: tiger_2020_tabblock
    name: TIGER/Line 2020 tabulation blocks (attribute table only)
    publisher: U.S. Census Bureau
    url_pattern: https://www2.census.gov/geo/tiger/TIGER2020/TABBLOCK20/tl_2020_{state_fips}_tabblock20.zip  # secret-scan: allow (a public URL path, not a key)
    member: tl_2020_{state_fips}_tabblock20.dbf
    vintage: 2020 Census
    geography: [block]
    licence: Public domain (U.S. government work)
    terms_url: https://www.census.gov/geographies/mapping-files/time-series/geo/tiger-line-file.html
    expected_size: 46167523
    parser: blocks.read_block_table
    limits: >-
      Housing units and population are 2020 counts, not current. Internal points are a
      point inside each block, not its centre of population. Only the attribute table
      (the .dbf, about 46 MB of the 409 MB Pennsylvania zip) is read, by HTTP range
      requests; block shapes are never downloaded.
    tier: 0
    access: range
    cleaning: Keeps GEOID20, HOUSING20, POP20, ALAND20, AWATER20 and the internal point.
    checked_on: 2026-11-22
    notes: >-
      Range reading confirmed live on 2026-11-22: the zip's index lists the .dbf, and
      the server answers range requests.

  - id: fhfa_hpi_county
    name: FHFA House Price Index, annual, counties
    publisher: Federal Housing Finance Agency
    url_pattern: https://www.fhfa.gov/hpi/download/annual/hpi_at_county.xlsx
    vintage: Annual developmental index, latest release
    geography: [county]
    licence: Public domain (U.S. government work)
    terms_url: https://www.fhfa.gov/data/hpi/datasets
    expected_size: 5334194
    parser: prices.read_hpi_county
    limits: >-
      Repeat-sales index built from mortgages bought or guaranteed by Fannie Mae and
      Freddie Mac; thin in rural counties, where years can be missing. Published as a
      spreadsheet (read with the standard library's zip and XML tools).
    tier: 0
    access: file
    cleaning: Converted to long form (county, year, index, annual change). Missing years stay missing.
    checked_on: 2026-11-22

  - id: fhfa_hpi_tract
    name: FHFA House Price Index, annual, census tracts
    publisher: Federal Housing Finance Agency
    url_pattern: https://www.fhfa.gov/hpi/download/annual/hpi_at_tract.csv
    vintage: Annual developmental index, latest release
    geography: [tract]
    licence: Public domain (U.S. government work)
    terms_url: https://www.fhfa.gov/data/hpi/datasets
    expected_size: 89893919
    parser: prices.read_hpi_tract
    limits: >-
      Experimental tract-level index; many tracts have too few repeat sales and are
      blank. Check which tract vintage (2010 or 2020) each release uses before joining.
    tier: 0
    access: file
    cleaning: Filtered to the state's tracts. Missing values stay missing.
    checked_on: 2026-11-22

  - id: freddie_pmms
    name: Primary Mortgage Market Survey, weekly rate history
    publisher: Freddie Mac
    url_pattern: https://www.freddiemac.com/pmms/docs/PMMS_history.csv
    vintage: Weekly, 1971 to the latest week
    geography: [nation]
    licence: Published freely by Freddie Mac; use under its website terms, with attribution
    terms_url: https://www.freddiemac.com/terms
    expected_size: 97674
    parser: prices.read_pmms
    limits: >-
      National average offered rates for prime borrowers, not the rate a given
      household or builder pays. The value used in the model is a ledger parameter
      with a range.
    tier: 0
    access: file
    cleaning: Weekly 30-year and 15-year fixed rates; an annual average is computed.
    checked_on: 2026-11-22
    notes: Not a U.S. government work. Terms re-checked before each release (plan 5.1 "check terms").

  - id: hud_fmr_county
    name: HUD Fair Market Rents, county and metro area file
    publisher: U.S. Department of Housing and Urban Development
    url_pattern: https://www.huduser.gov/portal/datasets/fmr/fmr{fiscal_year}/FY{fy2}_FMRs.xlsx
    vintage: Fiscal year 2026
    geography: [county, metro area]
    licence: Public domain (U.S. government work)
    terms_url: https://www.huduser.gov/portal/datasets/fmr.html
    expected_size: null
    parser: prices.read_fmr
    limits: >-
      Fair Market Rents are the 40th percentile of recent movers' gross rents, set for
      voucher payments; they are a cross-check, not a market rent. The direct file is
      used, never the token-gated API.
    tier: 0
    access: file
    cleaning: Rents by bedroom count per county; metro-wide values are applied to member counties.
    notes: >-
      Not confirmed live: on 2026-11-22 the HUD site answered scripted requests with
      status 202 and an empty body (a bot check). The pattern follows HUD's published
      file names (fmr2026 / FY26); confirm by hand before the first fetch.

  - id: ntm_stops
    name: National Transit Map, stops
    publisher: U.S. Department of Transportation, Bureau of Transportation Statistics
    url_pattern: https://services.arcgis.com/xOi1kZaI0eWDREZv/arcgis/rest/services/NTAD_National_Transit_Map_Stops/FeatureServer/0/query  # secret-scan: allow (a public URL path, not a key)
    vintage: National Transportation Atlas Database release compiled 2026-09-23
    geography: [point]
    licence: Public domain (U.S. government work)
    terms_url: https://geodata.bts.gov/datasets/usdot::national-transit-map-stops
    parser: transit.read_ntm_stops
    limits: >-
      Stops as reported by agencies in their schedule feeds; some agencies are missing
      or out of date. Gives stop locations, not service frequency (frequency comes from
      the agency schedule feeds). About 673,000 stops nationally; queried by state
      bounding box in pages of at most 2,000.
    tier: 0
    access: feature_service
    cleaning: >-
      Keeps stop id, name, latitude, longitude, stop type and feed id. Stops with no
      pickup are excluded later, using the agency feeds.
    checked_on: 2026-11-22

