      - "https://malegislature.gov/Laws/SessionLaws/Acts/2024/Chapter150"
    note: >-
      HLC's housing production page says the law went into effect on
      February 3, 2025; the statute's 180 days from August 6, 2024 end on
      February 2, 2025 (a Sunday). The statutory date is kept.
