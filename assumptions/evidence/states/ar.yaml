  title: 'Arkansas Act 446 of 2019 (SB 170): bar on local residential design-element rules'
  citation: Ark. Acts 2019, No. 446 (SB 170); Ark. Code Ann. 14-17-212, 14-56-204
  url: https://arkleg.state.ar.us/Bills/Detail?id=SB170&ddBienniumSession=2019%2F2019R
  session: 92nd General Assembly, 2019 Regular Session
  bill: SB 170
  enacted_date: 2019-03-13
  effective_dates:
  - date: 2019-07-24
    applies_to: Whole act (general effective date for acts without an emergency clause)
  geographic_scope: All counties and municipalities; single-family homes.
  exclusions:
  - Local and National Register historic districts and landmarks
  - Multifamily and other non-single-family buildings
  - Private covenants, building and safety codes, flood insurance rules, manufactured housing rules
  - Rules applied to existing property on or before 2019-02-28
  - Overlay districts with notice and a majority-owner petition
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - Bars rules on exterior color, cladding, roof style and pitch, porches, ornament, windows and garage doors,
    number and layout of rooms, and minimum house square footage. Height, bulk and placement are still regulated.
  - The minimum-house-size ban is the most relevant part for small starter homes; the act does not allow
    more units per lot, so its missing-middle effect is indirect.
  retrieved: 2026-11-24
