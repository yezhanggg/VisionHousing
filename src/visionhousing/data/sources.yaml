  - id: phl_pwd_wastewater
    name: Philadelphia Water Department statement of citywide sewer service
    publisher: Philadelphia Water Department
    url_pattern: https://water.phila.gov/about-pwd/
    vintage: page as read 2026-11-24
    geography: [county]
    licence: Public statement of a city agency; quoted briefly, nothing else is kept
    terms_url: https://water.phila.gov/about-pwd/
    parser: infrastructure.block_answers
    limits: >-
      A whole-city statement of the utility's service territory ("supplies drinking water,
      wastewater, and stormwater services to customers within the City of Philadelphia";
      its wastewater page adds "combined sewers in approximately half of the city's
      neighborhoods and a separate sewer system in the other half"), not a parcel map: a
      few properties on private on-lot systems would not show. It says nothing about
      capacity for added homes or about combined-sewer overflow limits.
    tier: 2
    access: page
    cleaning: Every Philadelphia block with homes is read as inside public sewer service.
    checked_on: 2026-11-24

