provisions:
  - provision_id: ma_40a_1a_adu_definition
    citation: "M.G.L. c. 40A § 1A, definition of accessory dwelling unit (St. 2024, c. 150, § 7)"
    section: "1A"
    reform: adu
    status: enacted
    effective: 2024-08-06
    checked_on: 2026-11-25
    summary_own_words: >-
      An accessory dwelling unit is a self-contained home with its own sleeping,
      cooking and sanitary space on the same lot as a principal dwelling, with a
      separate entrance, no larger than half the principal dwelling's gross
      floor area or 900 square feet, whichever is smaller. A town may add size
      limits and limit short-term rentals, but may not unreasonably restrict
      creating or renting an ADU that is not a short-term rental.
  - provision_id: ma_40a_3_adu
    citation: "M.G.L. c. 40A § 3, ADU paragraph (St. 2024, c. 150, § 8; effective by § 143)"
    section: "3"
    reform: adu
    status: enacted
    effective: 2025-02-02
    checked_on: 2026-11-25
    summary_own_words: >-
      Zoning may not prohibit, unreasonably restrict, or require a special
      permit or other discretionary approval for one ADU, or renting it, in a
      single-family residential zoning district. Reasonable rules still apply:
      Title 5 septic rules (310 CMR 15.000), site plan review, setbacks, bulk
      and height, and limits on short-term rental. No owner-occupancy
      requirement. At most one added parking space may be required, and none
      within 0.5 miles of a commuter rail, subway, ferry or bus station. A
      second ADU needs a special permit.
    benchmark_gap: >-
      The benchmark allows a detached or semi-detached ADU of at least 600 sq ft
      with no added parking. The statute already allows one ADU by right in
      single-family districts; it falls short of the benchmark where the
      half-of-the-house cap is below 600 sq ft (principal homes under 1,200 sq
      ft), where a town requires the one parking space (outside 0.5 miles of
      transit), on single-family lots outside single-family districts, and in
      Boston, which chapter 40A does not cover.
  - provision_id: ma_40a_3a
    citation: "M.G.L. c. 40A § 3A (St. 2020, c. 358, § 18)"
    section: "3A"
    reform: tod
    status: enacted
    effective: 2021-01-14
    checked_on: 2026-11-25
    summary_own_words: >-
      Each MBTA community (177 cities and towns; Boston is exempt from chapter
      40A) must have at least one zoning district of reasonable size where
      multi-family housing is allowed as of right, without age limits and
      suitable for families: a minimum gross density of 15 units per acre and,
      where applicable, within 0.5 miles of a commuter rail, subway or ferry
      station or bus station. A community that fails to comply loses
      eligibility for named state grant programs (Housing Choice, Local
      Capital Projects, MassWorks, HousingWorks). HLC sets the compliance
      guidelines (now the regulations 760 CMR 72).
    benchmark_gap: >-
      Close to the transit-oriented density benchmark but narrower: one district
      per town, sized by HLC's capacity formula, not all land near every stop.
      Towns choose where the district goes, and most districts are overlays.
      Districts already adopted and found compliant are in the pack table
      mbta_3a_districts.

