  - infrastructure_finance
  title: 'Tennessee SB 2834 / HB 2925 (2024): local option for single-exit apartment buildings; limits
    on offsite utility charges'
  citation: Tenn. Pub. Ch. 820 (2024) (SB 2834); amends T.C.A. 68-120-101 and adds 7-82-709
  url: https://wapp.capitol.tn.gov/apps/BillInfo/Default.aspx?BillNumber=SB2834&GA=113
  session: 113th General Assembly, 2024
  bill: SB 2834
  enacted_date: 2024-05-09
  effective_dates:
  - date: 2024-04-29
    applies_to: Whole act (the act takes effect on becoming law; the bill page lists 04/29/2024 as the
      effective date, before the 05/09/2024 signature entry)
  geographic_scope: 'Statewide code rule, local option: a local government may adopt by resolution or ordinance
    an exception allowing Group R-2 residential buildings under six stories to be served by a single exit
    stair, with at most four units per floor, travel distance limits and fire-separation conditions. Utility
    districts may not make an owner next to an existing line pay for offsite improvements, except to keep
    current service levels or under a cost-sharing deal.'
  exclusions:
  - The single-stair exception applies only where a local government adopts it
  - Other occupancies may not share the single stair (accessory parking and occupied roofs excepted)
  implementation_status: legally_effective
