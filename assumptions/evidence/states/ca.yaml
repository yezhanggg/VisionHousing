- id: ca.sb79_2025_tod
  kind: policy
  state: CA
  jurisdiction: statewide
  policy_types:
  - tod
  - missing_middle
  - permit_timing
  title: 'California SB 79 (2025): transit-oriented housing allowed near rail and frequent bus stops'
  citation: Stats. 2025, ch. 512 (SB 79); Gov. Code §§ 65912.155 et seq. (Chapter 4.1.5)
  url: https://leginfo.legislature.ca.gov/faces/billNavClient.xhtml?bill_id=202520260SB79
  session: 2025-26 regular session
  bill: SB 79
  enacted_date: 2025-10-10
  effective_dates:
  - date: 2026-01-01
    applies_to: Statute in force (non-urgency statute; Cal. Const. art. IV, § 8(c)(1))
  - date: 2026-07-01
    applies_to: Housing-project provisions apply to local agencies (unincorporated county areas only from
      the 7th housing-element cycle)
  - date: 2027-01-01
    applies_to: A denial of a qualifying project in a high-resource area is presumed to violate the Housing
      Accountability Act, with penalties
  geographic_scope: Housing projects of 5+ homes within one-half mile of a transit-oriented development
    (TOD) stop, on land zoned residential, mixed or commercial, in counties with more than 15 passenger
    rail stations. Tier 1 stops (heavy rail, very high-frequency commuter rail) and Tier 2 stops (light
    rail, high-frequency commuter rail, qualifying bus) carry floors on height, density and floor area.
  exclusions:
  - Before one year after the 7th housing-element revision, sites a city excludes by ordinance, including
    sites covered by a local TOD alternative plan
  - Sites where demolition would remove rent- or price-controlled housing
  - Outer band (one-quarter to one-half mile) floors apply only in cities of 35,000 or more
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: No court record was searched for this review.
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - 'Floors near Tier 1 stops: within one-quarter mile, height at least 75 ft, density at least 120 homes
    per acre, floor area ratio up to 3.5; one-quarter to one-half mile, 65 ft, 100 per acre, 3.0. Near
    Tier 2 stops: 65 ft, 100 per acre, 3.0 inside one-quarter mile; 55 ft, 80 per acre, 2.5 to one-half
    mile.'
  - Projects must include lower-income homes and meet labor standards; they may use streamlined ministerial
    approval.
  - Cities may adopt a local TOD alternative plan in the 7th housing element instead.
  retrieved: 2026-11-24
  verified: true
  verification_note: Chapter number, the 2025-10-10 approval and chaptering, and the chaptered text (operative
    dates 2026-07-01 and 2027-01-01, tiers, distances, floors) were read in the Legislative Counsel's
    official bulk data (pubinfo_2025.zip, bill history and chaptered version tables). The 2026-01-01
    date follows from Cal. Const. art. IV, § 8(c)(1), read in the same bulk data; the bill has no urgency
    clause. The leginfo bill page itself returned HTTP 403 to scripted reading on 2026-11-24.
  sources:
