  title: 'Kansas SB 418 (2026): By-right Housing Development Act, 3,000 sq ft lots for small homes, third-party
    review'
  citation: Kansas SB 418 (2026), By-right Housing Development Act; repeals K.S.A. 12-757 and 12-758
  url: https://www.kslegislature.gov/li/b2025_26/measures/sb418/
  session: 2025-2026 biennium, 2026 session
  bill: SB 418
  enacted_date: 2026-04-07
  effective_dates: []
  geographic_scope: Statewide. By-right approval for single-family homes, townhouse projects of up to 12
    attached units and ADUs that meet existing zoning; small-home building rules apply in all political subdivisions;
    all city land zoned for any residential use also counts as zoned single-family.
  exclusions:
  - Registered historic districts or projects subject to historic preservation review
  - Projects that would add impervious surface draining harmfully into a special flood hazard area
  - Restrictive covenants and homeowner or condominium association rules are not affected
