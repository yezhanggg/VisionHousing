  title: 'Utah SB 284 (2026): larger cities must permit a detached ADU on single-family lots of 11,000
    sq ft or more'
  citation: Utah SB 284 (2026 General Session), Local Land and Water Modifications; Utah Code 10-21-304
    (new)
  url: https://le.utah.gov/Session/2026/bills/enrolled/SB0284.pdf
  session: 2026 General Session
  bill: SB 284
  enacted_date: 2026-03-18
  effective_dates:
  - date: 2026-05-06
    applies_to: Most of the act (land use appeals, development agreements, planning commission timing,
      water exactions)
  - date: 2026-10-01
    applies_to: Detached ADU rule (10-21-304)
  - date: 2028-01-01
    applies_to: Written plan required before a local government imposes a water exaction
  geographic_scope: Specified municipalities (cities of the first to fourth class, and fifth-class cities
    of 5,000+ in first- to third-class counties); lots of 11,000 sq ft or more with a permitted single-family
    home
  exclusions:
  - Lots under 11,000 sq ft (cities may go further)
  - Development agreements signed on or before 2026-05-06 that restrict detached ADUs
  - Cities may require owner occupancy, bar rentals under 90 days, bar front-yard placement, limit to
    one ADU per lot, and deny where utility capacity is lacking
