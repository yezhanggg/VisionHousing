    publisher: Pennsylvania General Assembly
    url_pattern: https://www.palegis.us/legislation/bills/2025/sb1346
    vintage: 2025-2026 regular session; text Printer's Number 1747
    geography: [state]
    licence: Public legislative record
    terms_url: https://www.palegis.us/legislation/bills/2025/sb1346
    parser: legislation.read_bill_status
    limits: >-
      A proposed bill, not law, unless enacted. Applies only to municipalities under
