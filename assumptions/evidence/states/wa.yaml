  title: 'Middle housing: 2 to 6 units per lot in cities over 25,000, tied to comprehensive plan update'
  citation: E2SHB 1110, Ch. 332, Laws of 2023; RCW 36.70A.635 (as amended 2024 c 152, 2025 c 148, 2025
    c 301); RCW 36.70A.636
  url: https://app.leg.wa.gov/billsummary?BillNumber=1110&Year=2023
  session: 2023 regular session
  bill: HB 1110
  enacted_date: 2023-05-08
  effective_dates:
  - date: 2023-07-23
    applies_to: Act effective
  - date: 2024-12-31
    applies_to: Compliance due with periodic plan update for cities in King, Kitsap, Pierce, Snohomish
      counties (RCW 36.70A.130(5)(a))
  - date: 2025-12-31
    applies_to: Periodic update due for Clallam, Clark, Island, Jefferson, Lewis, Mason, San Juan, Skagit,
      Thurston, Whatcom county cities
  - date: 2026-12-31
    applies_to: Periodic update due for Benton, Chelan, Cowlitz, Douglas, Franklin, Kittitas, Skamania,
      Spokane, Walla Walla, Yakima county cities
  geographic_scope: 'GMA cities: 25,000-74,999 pop. at least 2 units/lot (4 near major transit stop or
    with 1 affordable unit); 75,000+ at least 4 units/lot (6 near transit or with 2 affordable units);
    cities under 25,000 in the contiguous UGA of the largest city in a county over 275,000 at least 2
    units/lot. Must allow 6 of 9 middle housing types.'
  exclusions:
  - Critical areas and buffers (except certain aquifer recharge areas)
  - EPA sole-source aquifers on Puget Sound islands; watersheds for impaired potable reservoirs as of
    2023-07-23
  - Urban separators designated as of 2023-07-23; lots created by RCW 58.17.145 lot splits
  - Option to apply to only 75% of single-family lots, excluding specified areas
  implementation_status: legally_effective
