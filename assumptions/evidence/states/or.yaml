  title: 'Oregon HB 2001 (2019): duplexes and middle housing on single-family land'
  citation: Enrolled HB 2001 (2019), Oregon Laws 2019, ch. 639 (now ORS 197A.420, formerly ORS 197.758)
  url: https://olis.oregonlegislature.gov/liz/2019R1/Measures/Overview/HB2001
  session: 2019 regular session
  bill: HB 2001
  enacted_date: 2019-08-08
  effective_dates:
  - date: 2019-08-08
    applies_to: Act in force (effective date per the measure history)
  - date: 2020-01-01
    applies_to: Core middle-housing section and related amendments become operative
  - date: 2021-06-30
    applies_to: Deadline for cities of 10,000-25,000 outside Metro to allow a duplex on each residential
      lot that allows a detached house
  - date: 2022-06-30
    applies_to: Deadline for cities of 25,000+ and Metro cities and counties to allow all middle housing
      types (duplex, triplex, quadplex, cottage cluster, townhouse) in areas that allow detached houses
  geographic_scope: Inside urban growth boundaries. Large cities and Metro jurisdictions must allow all
    middle housing types; mid-size cities must allow duplexes. Places that miss the deadline get the
    state model ordinance directly.
  exclusions:
  - Cities of 1,000 people or fewer
  - Land outside urban growth boundaries
  - Unincorporated land lacking urban services, or under interim urban-holding zoning
  - Land not zoned for residential use
