  caveats:
  - Size cap is the larger of 1,000 sq ft or 50% of the house. No added parking, owner residence, family
    tie, income or age limits, matching design, or stricter height, setback, lot or density rules than for
    the house.
  - Permits must be decided without discretionary review or hearing, on the single-family review timeline;
    denials must be in writing with the fix needed. Impact fee structures may not differ from the house's.
