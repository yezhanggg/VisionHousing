    url_pattern: https://www.fhfa.gov/hpi/download/annual/hpi_at_county.xlsx
    vintage: Annual developmental index, latest release
    geography: [county]
    licence: Public domain (U.S. government work)
    terms_url: https://www.fhfa.gov/data/hpi/datasets
    expected_size: 5334194
    parser: prices.read_hpi_county
    limits: >-
      Repeat-sales index built from mortgages bought or guaranteed by Fannie Mae and
