- id: id.s1354_2026_adu
  kind: policy
  state: ID
  jurisdiction: statewide
  policy_types:
  - adu
  - parking
  - fees
  title: 'Idaho S 1354 (2026): cities over 10,000 must allow one ADU per single-family lot'
  citation: Idaho Laws 2026, ch. 265 (S 1354, as amended); Idaho Code 67-6541 and 55-3212
  url: https://legislature.idaho.gov/sessioninfo/2026/legislation/S1354/
  session: 2026 regular session (68th Legislature, 2nd regular session)
  bill: S 1354
  enacted_date: 2026-03-31
  effective_dates:
  - date: 2026-07-01
    applies_to: Whole act (cities may not ban ADUs in residential zones; HOAs may not newly restrict ADUs
      without the owner's written consent)
  - date: 2027-02-01
    applies_to: Deadline for each covered city to amend its comprehensive plan and land use rules for
      single-family zones
  geographic_scope: Cities with more than 10,000 people, on all land zoned for single-family use. The
    homeowners' association limit (55-3212) applies statewide.
  exclusions:
  - Historic districts and designated historic properties
  - Cities of 10,000 or fewer people
  - Building, fire, floodplain, water, sewer, road-access, environmental-hazard and right-of-way setback
    rules still apply
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - 'One ADU per lot: either internal or detached (rear yard or primary-dwelling setbacks). No off-street
    parking may be required unless the main home has none, the street is unpaved, or the home is within
    a quarter mile of transit, jobs or shops (an unusual reverse exemption).'
  - Impact and utility connection fees may not exceed those on other single-family homes; size cap may
    not be below 1,000 sq ft or 75% of the main home; no owner-occupancy rule; approval is administrative
    and by right.
  - Detached ADUs allowed one per lot, so the reform's 600 sq ft detached-ADU assumption fits; the 10,000-population
    threshold leaves small cities and counties out.
  retrieved: 2026-11-24
  verified: true
  verification_note: Idaho Legislature bill page shows governor signed 2026-03-31, Session Law Chapter
    265, effective 07/01/2026. Engrossed text (S1354E1) read for scope, the 2027-02-01 deadline and the
    emergency clause. The Idaho Code chapter 65 index lists 67-6541 'Accessory dwelling units'.
  sources:
  - label: S 1354 bill status (Idaho Legislature)
    url: https://legislature.idaho.gov/sessioninfo/2026/legislation/S1354/
    official: true
  - label: S 1354 engrossed text
    url: https://legislature.idaho.gov/wp-content/uploads/sessioninfo/2026/legislation/S1354E1.pdf
    official: true
  - label: Idaho Code Title 67 chapter 65 index
    url: https://legislature.idaho.gov/statutesrules/idstat/Title67/T67CH65/
    official: true
  discovered_via: pew_2026
