  title: 'Virginia Acts 2026, ch. 19 (HB 655; companion SB 346, ch. 20): manufactured homes treated like
    site-built homes'
  citation: Va. Acts 2026, ch. 19 (HB 655); Va. Code 15.2-2290 and 15.2-2247
  url: https://law.lis.virginia.gov/vacode/title15.2/chapter22/section15.2-2290/
  session: 2026 regular session
  bill: HB 655
  enacted_date: 2026-03-31
  effective_dates:
  - date: 2026-07-01
    applies_to: 'Va. Code 15.2-2290(B): in every district outside agricultural districts where site-built
      homes are allowed, manufactured homes converted to real property, placed on individual lots and
      occupied within 5 years of manufacture must be allowed, and may not be regulated more restrictively
      than a site-built single-family home'
  geographic_scope: All localities with a zoning ordinance, all residential zoning districts where site-built
    housing is allowed.
  exclusions:
  - Homes not converted to real property, older than 5 years at occupancy, or not on individual lots
  - Local historic district and archaeological protections still apply
  - Restrictive covenants still apply
