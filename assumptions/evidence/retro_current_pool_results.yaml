- Raleigh is a case in North Carolina, now an excluded state. The pool rule removes comparison offices
  only, so Raleigh stays a case; its state's 2023 law (a residential-code change counted by the rule)
  is in force inside its horizon.
- Several newly counted state laws are narrow (building-code, single-stair, ADU-only). The design's rule
  counts any verified statewide record typed adu or missing_middle; this block does not re-judge them.
- Fewer comparison offices give fewer placebo values, so intervals can move or widen for that reason alone.
- Nothing else changes; the BPS and ACS files are the same ones the original run and the audit used.
