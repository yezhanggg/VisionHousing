    jurisdiction: MA
    housing_type: adu
    status: legally_effective
    start: 2025-02-02
    verified_on: 2026-11-24
    retrieved_on: 2026-11-24
    text_version: "General Laws text read 2026-11-24"
    scope: >-
      One ADU (no larger than half the principal home or 900 sq ft) by right in
      single-family residential zoning districts; at most one added parking
      space, none within 0.5 miles of a station; no owner-occupancy rule
    exclusions: >-
      Boston; a second ADU needs a special permit; Title 5 septic, site plan
      review, setbacks, bulk, height and short-term-rental limits still apply
    agency: Executive Office of Housing and Livable Communities (760 CMR 71)
    implementation_evidence: >-
      HLC's ADU survey (pack table ma_adu_survey) reports ADU building permits
      issued in 246 municipalities, January 2025 to June 2026
