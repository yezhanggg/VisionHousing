  caveats:
  - By-right residential applications must get administrative review with no public hearing (29 Del. C.
    9223); any public meeting is written-comment only.
  - The affordable housing plan must include higher permitted density and a mix of housing types (duplexes,
    triplexes, multifamily, ADUs, cottages, manufactured homes) without conditional use permits, plus a
    review of minimum lot sizes; the tools are a menu tied to plan approval, not a statewide zoning override.
  - First DSHA progress reports are due by May 15, 2028.
