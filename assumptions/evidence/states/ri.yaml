  title: 'Rhode Island H 5798 (2025): attached single-family homes (townhouses) on their own lots'
  citation: R.I. Public Laws 2025, ch. 262 (H 5798 Sub A as amended); R.I. Gen. Laws §§ 45-24-33(a)(25),
    45-24-37(j)
  url: https://webserver.rilegislature.gov/PublicLaws/law25/law25262.htm
  session: 2025 session
  bill: H 5798
  enacted_date: 2025-06-27
  effective_dates:
  - date: 2026-01-01
    applies_to: Whole act
  geographic_scope: All cities and towns; residential districts that allow two or more units.
  exclusions:
  - Units need public water and sewer or approved private systems
  - Number of attached units is limited to the district's residential density
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - Each unit may sit on its own lot with a zero setback at the party wall and no larger lot size, width
    or frontage than otherwise required.
  - Local standards may not hold floor area ratio below one, cap bedrooms below three, or require more
    than two off-street spaces for up to three bedrooms.
  retrieved: 2026-11-24
