  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - Fair-share obligations are planning and zoning targets, NOT permits or completions.
  - Abolishes COAH. DCA had to publish its calculations by the earlier of 7 months after enactment or
    2024-12-01. Municipalities that meet the deadlines get immunity from exclusionary zoning (builder's
    remedy) litigation.
  - Appropriates $12M to the Dispute Resolution Program and $4M to DCA.
