  citation: Laws of Fla. ch. 2021-63 (CS/CS/CS/HB 337); amends s. 163.31801, F.S.
  url: https://www.flsenate.gov/Session/Bill/2021/337
  session: 2021 regular session
  bill: HB 337
  enacted_date: 2021-06-04
  effective_dates:
  - date: 2021-06-04
    applies_to: Whole act on approval; the increase limits apply retroactively to 2021-01-01
  geographic_scope: All counties, municipalities, school districts and special districts that charge
    impact fees.
  exclusions:
  - A larger or faster increase is allowed if a study done within 12 months shows extraordinary circumstances,
    at least two public workshops are held and the increase passes by a two-thirds vote
  implementation_status: legally_effective
  litigation:
