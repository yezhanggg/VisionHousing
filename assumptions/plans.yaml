# County comprehensive plans: a citation list, not data.
#
# Read by the "plans" profile section, which shows the county's own plan next
# to the DCED record of which municipalities have plans. Every link was opened
# on the date given. "verified: false" means the page could not be confirmed
# (a site that blocks automated reading, or no adoption date on the page); the
# profile then says so.
#
# Lehigh and Northampton share one regional plan; Luzerne shares a joint plan
# with Lackawanna.

