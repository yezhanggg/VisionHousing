  title: 'Maryland Chapter 122 of 2024 (HB 538): Housing Expansion and Affordability Act of 2024'
  citation: Md. Laws 2024, ch. 122 (HB 538; cross-filed SB 484); Land Use Article 4-104(d) and new Title
    7, Subtitle 5
  url: https://mgaleg.maryland.gov/mgawebsite/Legislation/Details/hb0538?ys=2024RS
  session: 2024 regular session
  bill: HB 538
  enacted_date: 2024-04-25
  effective_dates:
  - date: 2025-01-01
    applies_to: 'Whole act: density bonuses for qualified affordable projects (middle housing in single-family
      zones; 30% more density in multifamily zones; mixed-use in nonresidential zones); manufactured and
      modular homes allowed where single-family homes are'
  geographic_scope: 'Statewide. Qualified projects are on former state land, large former federal military
    sites, land wholly within 0.75 mile of a rail station (at least 15% affordable at 60% AMI, or 20% where
    a local rule already requires 15%), or nonprofit-owned land (at least 25% affordable); each with a
    40-year deed restriction.'
  exclusions:
  - The rail-station route excludes stations on college campuses, parcels only partly within 0.75 mile,
    and land zoned single-family on January 1, 2024
  - Projects must carry long-term affordability deed restrictions; market-rate projects do not qualify
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - Only deed-restricted affordable projects get the density; this is not a general upzoning.
  - Local governments may not impose unreasonable limits on qualified projects or require more than a set
    number of public hearings (per the fiscal note).
  - The manufactured-home rule covers homes converted to real property and modular dwellings on approved
    foundations.
