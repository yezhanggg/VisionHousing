- id: mt.maid_v_state_2026
  kind: policy
  state: MT
  jurisdiction: statewide
  policy_types:
  - court_decision
  - missing_middle
  - adu
  title: Montana Supreme Court upholds 2023 housing reform laws (MAID v. State)
  citation: Montanans Against Irresponsible Densification, LLC v. State, 2026 MT 53, No. DA 25-0200
  url: https://news.mt.gov/Governors-Office/Governor-Gianforte-Praises-Montana-Supreme-Court-Ruling-Upholding-Pro-Housing-Reforms
  session: null
  bill: null
  enacted_date: null
  effective_dates: []
  geographic_scope: 'Statewide; laws at issue: SB 382 (MLUPA), SB 323 (duplexes, cities 5,000+), SB 528
    (ADUs), SB 245 (multifamily in commercial zones)'
  exclusions: []
  implementation_status: legally_effective
  litigation:
    status: decided
    note: 'Decided 2026-03-17 (Baker, J., unanimous). (1) MAID''s challenge to MLUPA public participation
      provisions is justiciable (not moot despite 2025 SB 121). (2) Reversed the Gallatin County district
      court: MLUPA''s site-specific participation limits (§§ 76-25-106(4)(d), -305(4)-(6), -408(7)-(8),
      MCA) do not facially violate the constitutional right to participate; injunction falls. (3) Affirmed:
      the housing laws do not violate equal protection (by population class or covenant status). (4) Vacated
      the district court''s declaration that the laws cannot displace stricter private covenants, as an
      advisory opinion. SB 245 challenge not developed by MAID.'
    citation: 2026 MT 53
    url: https://news.mt.gov/Governors-Office/Governor-Gianforte-Praises-Montana-Supreme-Court-Ruling-Upholding-Pro-Housing-Reforms
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - Opinion text read from a copy bearing the court's 03/17/2026 file stamp hosted by State Court Report,
    not from the court's own document service
  - Private restrictive covenants question left open
  retrieved: 2026-11-24
  verified: true
  verification_note: Decision date 2026-03-17 and upheld bills (SB 323, SB 528, SB 382) read on the official
    Governor's Office release (news.mt.gov); docket DA 25-0200, 2026 MT 53 and per-issue holdings read
    in the file-stamped opinion (secondary host; Montana docket site could not be read automatically).
  sources:
  - label: Montana Governor's Office release, 2026-03-17
    url: https://news.mt.gov/Governors-Office/Governor-Gianforte-Praises-Montana-Supreme-Court-Ruling-Upholding-Pro-Housing-Reforms
    official: true
  - label: Opinion copy (State Court Report)
    url: https://statecourtreport.org/sites/default/files/2026-03/montana_densification_5824b10a-9859-ceaf-8bf7-9cfdb4a00000.pdf
    official: false
  discovered_via: search
