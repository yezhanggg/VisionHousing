  identification: not_applicable
  caveats:
  - Repeals parts of Act 181 of 2024, including Tier 2, Tier 3 and the road jurisdiction trigger. Act
    250 triggers do not change outside Tier 1A and 1B areas.
  - Extends any regional or municipal plan expiring in 2026 or 2027 to 2027-12-31. Requires the housing
    department to report by 2027-01-15 on limiting appeals of municipal permits and on housing built under
    the interim exemptions.
  - Unit and acreage limits of the interim exemptions were not re-read in the act text. They come from
    the Act 181 framework (see vt.act181_2024_tiers).
