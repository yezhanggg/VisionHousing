- id: ma.ag_v_milton_2025
  kind: policy
  state: MA
  jurisdiction: statewide
  policy_types:
  - court_decision
  - tod
  title: 'Attorney General v. Town of Milton (SJC 2025): MBTA Communities law upheld; guidelines must
    be issued as regulations'
  citation: Attorney General v. Town of Milton, SJC-13580 (Mass. Jan. 8, 2025)
  url: https://www.mass.gov/doc/attorney-general-v-town-of-milton-executive-office-of-housing-and-livable-communities-sjc-13580/download
  session: null
  bill: null
  enacted_date: null
  effective_dates:
  - date: '2025-01-08'
    applies_to: Decision issued; § 3A enforceable, guidelines ineffective until re-promulgated
  geographic_scope: All MBTA communities
  exclusions: []
  implementation_status: legally_effective
  litigation:
    status: decided
    note: Supreme Judicial Court, argued 2024-10-07, decided 2025-01-08. Held that § 3A is constitutional
      and the Attorney General may enforce it (including equitable relief beyond the act's penalties).
      Held that the agency's compliance guidelines were not issued under the Administrative Procedure
      Act and so had no effect until promulgated as regulations; other claims dismissed.
    citation: SJC-13580
    url: https://www.mass.gov/doc/attorney-general-v-town-of-milton-executive-office-of-housing-and-livable-communities-sjc-13580/download
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - The regulations re-issued after the decision were not read for this record.
  - The decision changes the enforcement path, not the zoning in any town by itself.
  retrieved: 2026-11-24
  verified: true
  verification_note: 'Slip opinion PDF on mass.gov read: docket SJC-13580, dates ''October 7, 2024. -
    January 8, 2025.'', the conclusion and the order. Attorney General statement page dated 1/08/2025.'
  sources:
