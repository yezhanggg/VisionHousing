- id: md.ch197_2025_adu
  kind: policy
  state: MD
  jurisdiction: statewide
  policy_types:
  - adu
  title: 'Maryland Chapter 197 of 2025 (HB 1466): accessory dwelling units, local laws required'
  citation: Md. Laws 2025, ch. 197 (HB 1466; cross-filed SB 891); new Land Use Article Title 4, Subtitle
    5 and Real Property Article provisions
  url: https://mgaleg.maryland.gov/mgawebsite/Legislation/Details/hb1466?ys=2025RS
  session: 2025 regular session
  bill: HB 1466
  enacted_date: 2025-04-22
  effective_dates:
  - date: 2025-10-01
    applies_to: Act in force, including the limits on covenants and HOA rules that unreasonably bar ADUs
  - date: 2026-10-01
    applies_to: Deadline for each county or municipal legislative body to adopt a local law authorizing
      ADUs on land with a single-family detached home
  geographic_scope: Every county and municipality, including charter counties and Baltimore City, on lots
    whose primary home is a single-family detached house. An ADU may be at most 75% of the size of the
    main home.
  exclusions:
  - Local laws may set safety standards and may bar converting an accessory structure reached only from
    an alley
  - Local laws may add off-street parking rules after a parking study, with a waiver process
  - Historic property listed in or eligible for the Maryland Register is outside the covenant limit
  - Covenants may still limit short-term rental of an ADU
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - The enacted law is far narrower than the bill as introduced. The chapter text shows stricken drafts
    of a 90-day ministerial review, a fee waiver under 750 sq ft and parking caps near transit; the DLS
    third-reader note lists none of them, so they are treated as not enacted.
  - The required local law must keep ADUs out of density limits and cannot set side and rear setbacks
    stricter than those for existing accessory structures. Size, design and other rules stay local.
  - The Planning Department's task-force inventory found 81 of 155 jurisdictions (52%) already had some
    ADU provisions (as reported in the fiscal note).
  - Whether jurisdictions met the October 1, 2026 deadline was not checked.
