  - id: wy_statutes
    name: Wyoming Statutes Titles 15 and 18 (city, town and county zoning) and session bill digests
    publisher: Wyoming State Legislature
    url_pattern: https://wyoleg.gov/statutes/compress/title{title}.pdf
    vintage: Text read 2026-11-24 (statutes as compiled after the 2026 budget session)
    geography: [state]
    licence: Public legislative record
    terms_url: https://wyoleg.gov/
    parser: legislation.statute_text
    limits: >-
      The statutes say what cities, towns and counties may regulate, not what each local code
      allows today. Wyoming has no state ADU, missing-middle, transit-density, parking or fee
      statute, so this source supports a finding of silence, not a share of lots. The web
      PDFs are unofficial compilations.
    tier: 0
    access: page
    cleaning: >-
      Read by hand: W.S. 15-1-601 to 15-1-611, 18-5-201 to 18-5-208 and 18-5-303, and the 2025
      and 2026 subject indexes and bill digests. Only citations and summaries in our own words
      are kept, in assumptions/law/states/wy.yaml.
    checked_on: 2026-11-24

