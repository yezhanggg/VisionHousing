  title: 'Idaho H 706 (2026): local option for single-stair apartment buildings up to six storeys'
  citation: Idaho Laws 2026, ch. 320 (H 706); Idaho Code 39-4109C, 39-4116
  url: https://legislature.idaho.gov/sessioninfo/2026/legislation/H0706/
  session: 2026 regular session (68th Legislature, 2nd regular session)
  bill: H 706
  enacted_date: 2026-04-10
  effective_dates:
  - date: 2026-07-01
    applies_to: Whole act
  geographic_scope: Statewide, but only where a local government chooses to allow single-stair R-2 apartment
    buildings
  exclusions:
  - Optional for local governments (they 'may allow'); no change where a city keeps the two-exit rule
  - Buildings over six storeys (five with an occupiable roof), more than four units per floor or over
    6,000 sq ft per storey
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - Conditions include full NFPA 13 sprinklers, a 2-hour rated stair and elevator shaft, a 48-inch stair,
    at most 20 ft from unit doors to the stair, 125 ft exit-access travel and at most two single-exit
    buildings per lot.
  - A building-code change, not zoning; it lowers the cost of small apartment buildings on narrow lots
    but does not by itself allow more units on a parcel.
