- id: mn.retro.minneapolis_2040_plan.units_2_4
  kind: study
  state: MN
  jurisdiction: Minneapolis
  policy_types:
  - missing_middle
  title: 'Retrospective permit panel: Minneapolis 2040 Comprehensive Plan and zoning implementation (end
    of single-family-only zoning) (units in 2- to 4-unit buildings (the sum of the two above))'
  citation: VisionHousing retrospective panel (Census BPS place files and ACS B25001), design retro_bps_2026_11
  url: https://www.census.gov/construction/bps/index.html
  geographic_scope: Citywide
  implementation_status: not_law
  litigation:
    status: not_applicable
  outcome_measure: Units in 2- to 4-unit buildings (the sum of the two above) authorized by building permits
  denominator: per 1,000 housing units (ACS 2020-2024 5-year, table B25001)
  horizon: 5 calendar years from 2020 (event times 0 to 4)
  observed_result:
    summary: 'Minneapolis: units in 2- to 4-unit buildings (the sum of the two above) per 1,000 homes
      changed by -0.16 a year against the comparison cities over 5 years from 2020 (90% placebo interval
      -0.80 to +0.27; about -33 units a year). Pre-trend p 0.45; placebo-date p 0.33. The interval includes
      zero: no change distinguishable from ordinary cities.'
