- id: va.ch1075_2026_parking_transit
  kind: policy
  state: VA
  jurisdiction: statewide
  policy_types:
  - parking
  - tod
  title: 'Virginia Acts 2026, ch. 1075 (HB 888): parking minimum caps within half a mile of transit'
  citation: Va. Acts 2026, ch. 1075 (HB 888); Va. Code 15.2-2209.4
  url: https://law.lis.virginia.gov/vacode/title15.2/chapter22/section15.2-2209.4/
  session: 2026 regular session (reconvened)
  bill: HB 888
  enacted_date: 2026-04-22
  effective_dates:
  - date: 2026-07-01
    applies_to: 'Va. Code 15.2-2209.4: within a designated area (parcels within 0.5 mile of the entrance
      to a fixed-route transit station or facility, including BRT) minimum parking may not exceed 0.5
      space per unit for multifamily or mixed-use and 1 space per unit for one- and two-family homes and
      townhouses; localities over 20,000 people must offer an administrative reduction of at least 20%
      elsewhere'
  geographic_scope: All localities with a zoning ordinance. Designated areas are parcels within half a
    mile of the entrance to a building or enhanced structure where riders board fixed-route rail, bus or
    other surface transit open to the public.
  exclusions:
  - School buses, microtransit, charter and sightseeing services, highway-link car ferries and client-only
    services do not count as transit
  - Localities over 600,000 people may set higher minimums near locality-run bus stops if they offer an
    administrative reduction of at least 25% within 1,000 feet of the stop (for projects at or below 70%
    AMI, where the spaces are unnecessary, or with a shared-parking agreement)
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - These are caps on minimums, not a ban. Ordinary bus stops count only if they are a building or enhanced
    structure, so coverage depends on how localities read 'station or facility'.
  retrieved: 2026-11-24
  verified: true
  verification_note: Chapter 1075 text in the official LIS document store (lis.blob.core.windows.net)
    reads '[H 888] Approved April 22, 2026' and has no delayed effective-date clause. The Code of Virginia
    2026 Updates list (law.lis.virginia.gov) says listed sections took effect July 1, 2026 unless noted;
    15.2-2209.4 carries no note, and its history line reads '2026, c. 1075'. The lis.virginia.gov bill
    page is a JavaScript app that shows no content to scripted reading.
  sources:
