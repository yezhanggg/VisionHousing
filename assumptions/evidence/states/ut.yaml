  title: 'Housing and Transit Reinvestment Zones: dense mixed-use housing at rail/BRT stations funded
    by tax increment'
  citation: Housing and Transit Reinvestment Zone Act, SB 217 (2021); now Utah Code Title 63N, Ch. 23,
    Part 2 (§§ 63N-23-201 to -207), renumbered from 63N-3-6 by SB 39 (2026), Laws of Utah 2026, Ch. 94;
    sunset added by HB 507 (2026)
  url: https://le.utah.gov/xcode/Title63N/Chapter23/63N-23-P2.html
  session: 2026 General Session (recodification); 2021 General Session (original act)
  bill: SB 217 (2021); SB 39 (2026); HB 507 (2026)
  enacted_date: 2021-03-22
  effective_dates:
  - date: 2026-05-06
    applies_to: Current Part 2 (63N-23-2) text, renumbered and amended by Ch. 94 (SB 39)
  - date: 2027-12-31
    applies_to: Last date to propose an HTRZ (proposals pending on this date may still be amended and
      reviewed)
  - date: 2028-01-01
    applies_to: No new HTRZ proposals; zones existing on this date continue
  geographic_scope: Municipalities and public transit counties at commuter rail stations (up to 1/3 mile
    radius, max 125 noncontiguous acres) and light rail or BRT stations (generally 1/4 mile, max 100 acres)
  exclusions:
  - 12% affordable requirement does not apply where HUD affordability guidelines (under 60% AMI) are already
    met
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - 'Zoning side: at least 51% of developable area residential, average 50+ units/acre (39-49 allowed
    for some BRT/transit-hub zones at 60% capture), 12% affordable units (up to 9% at <= 80% county median
    income, at least 3% at <= 60%), at least 25% of units with more than one bedroom, mixed use.'
  - 'Finance side: up to 80% of each taxing entity''s property tax increment for up to 25 years per parcel
    within 45 years (commuter rail) or 15 years within 30 years (light rail); at most three trigger dates;
    committee approval required.'
  - Original 2021 act's effective date was not read on an official page; only its signing date (2021-03-22)
    was.
  - GOEO program page lists committee meetings (e.g., Sandy, Vineyard, South Jordan, Farmington, Salt
    Lake Central, Kimball Junction) but not confirmed approvals.
  retrieved: 2026-11-24
  verified: true
  verification_note: 'le.utah.gov current code: 63N-23-201 and 63N-23-202 marked ''Effective 5/6/2026'',
    history ''Renumbered and Amended by Chapter 94, 2026 General Session''; 63N-23-202(1) and (6) give
    the Dec. 31, 2027 / Jan. 1, 2028 cutoffs; 63N-23-201 gives density, affordability and increment terms.
    Enrolled SB 39 (2026) lists renumbering 63N-3-603 -> 63N-23-201 etc. le.utah.gov bill data: SB 39
    (2026) Governor Signed 2026-03-17; HB 507 (2026) Governor Signed 2026-03-25; SB 217 (2021) ''Housing
    and Transit Reinvestment Zone Act'' Governor Signed 2021-03-22.'
  sources:
