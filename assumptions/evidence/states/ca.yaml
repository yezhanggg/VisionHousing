- id: ca.sb9_2021_lot_split
  kind: policy
  state: CA
  jurisdiction: statewide
  policy_types:
  - starter_lots
  - missing_middle
  title: 'SB 9 urban lot split: ministerial split of a single-family lot into two'
  citation: SB 9 (Atkins), Ch. 162, Stats. 2021; Gov. Code § 66411.7
  url: https://www.hcd.ca.gov/sites/default/files/docs/planning-and-community/sb-9-fact-sheet.pdf
  session: 2021-2022 regular session
  bill: SB 9
  enacted_date: 2021-09-16
  effective_dates:
  - date: 2022-01-01
    applies_to: Lot split provisions (non-urgency 2021 statute, general Jan. 1 effective date)
  - date: 2024-01-01
    applies_to: HCD gains enforcement authority over Gov. Code §§ 65852.21 and 66411.7 (AB 434, Ch. 740,
      Stats. 2023)
  geographic_scope: Parcels in single-family residential zones in cities and counties statewide; local
    agency must approve a parcel map for a split into two parcels ministerially, with no hearing and no
    CEQA review.
  exclusions:
  - Parcels not zoned single-family residential (multifamily, commercial, mixed-use, agricultural zones)
  - Sites with SB 35-type environmental constraints (farmland, wetlands, high fire hazard, earthquake
    fault, flood, habitat, conservation easements)
  - Historic districts, state historic inventory properties, local landmarks
  - Projects that would demolish or alter rent-restricted, rent-controlled, or tenant-occupied (last 3
    years) housing
  - A parcel may be split only once under § 66411.7; no split if the same owner (or someone acting with
    them) split an adjacent lot
  - Denial allowed only on a written finding of a specific, adverse health/safety impact that cannot be
    mitigated
  implementation_status: legally_effective
  litigation:
    status: challenged
    note: Charter cities (Redondo Beach, Carson, Torrance, Whittier; Del Mar added) won a trial court
      writ holding SB 9 unconstitutional as applied to them. On 2025-11-12 the Court of Appeal (2d Dist.,
      Div. 4, B338990, unpublished) reversed and remanded for the trial court to reconsider under SB 450
      (Stats. 2024, ch. 286). See record ca.redondo_beach_v_bonta_2025.
    citation: City of Redondo Beach v. Bonta (Nov. 12, 2025, B338990) [nonpub. opn.]
    url: https://www.courts.ca.gov/opinions/nonpub/B338990.PDF
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - Kept separate from SB 9 two-unit development (ca.sb9_2021_two_unit) and from ADU law; after a lot
    split, ADUs and JADUs count toward the two-unit-per-lot limit (§ 66411.7(j)).
  - SB 450 (2024) amended SB 9; amended text was not read here.
  - Owner-occupancy affidavit and minimum lot size (1,200 sq ft / 60-40 split) are commonly cited but
    were not in the HCD fact sheet text read; not verified here.
  retrieved: 2026-11-24
  verified: true
  verification_note: Chapter 162, Stats. 2021 read on HCD SB 9 Fact Sheet (Sept. 2024) and in the CA Senate
    Housing Committee 2021 Legislative Summary (status 'Chapter 162, Statutes of 2021'; the summary states
    chaptered 2021 bills generally take effect Jan. 1, 2022, urgency bills excepted; SB 9 is not marked
    urgency). Signing date from Governor's office release (gov.ca.gov, published 2021-09-16 per page metadata,
    'today signed ... SB 9'). AB 434 enforcement date Jan. 1, 2024 read in HCD fact sheet. leginfo.legislature.ca.gov
    returned HTTP 403, so bill history was not read there.
  sources:
  - label: HCD SB 9 Fact Sheet (Sept. 2024)
    url: https://www.hcd.ca.gov/sites/default/files/docs/planning-and-community/sb-9-fact-sheet.pdf
    official: true
  - label: CA Senate Housing Committee 2021 Legislative Summary
    url: https://shou.senate.ca.gov/sites/shou.senate.ca.gov/files/2021_Legislative_Summary.pdf
    official: true
  - label: Governor's office release, Sept. 16, 2021
    url: https://www.gov.ca.gov/2021/09/16/governor-newsom-signs-historic-legislation-to-boost-californias-housing-supply-and-fight-the-housing-crisis/
    official: true
  - label: HCD enforcement authority list (SB 9 §§ 65852.21, 66411.7)
    url: https://www.hcd.ca.gov/hau/enforcement-authority
    official: true
  discovered_via: addendum
