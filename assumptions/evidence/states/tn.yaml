- id: tn.hb2552_2026_development_review_deadlines
  kind: policy
  state: TN
  jurisdiction: statewide
  policy_types:
  - permit_timing
  title: 'Tennessee HB 2552 / SB 2237 (2026): development review deadlines with deemed approval'
  citation: Tenn. Pub. Ch. 1044 (2026) (HB 2552); new T.C.A. 7-51-2204 and T.C.A. Title 7, Chapter 70
  url: https://wapp.capitol.tn.gov/apps/BillInfo/Default.aspx?BillNumber=HB2552&GA=114
  session: 114th General Assembly, 2026
  bill: HB 2552
  enacted_date: 2026-05-27
  effective_dates:
  - date: 2027-01-01
    applies_to: Whole act
  geographic_scope: 'All municipalities, counties and metro governments reviewing a developer''s development
    application, development plan or site inspection: within 60 business days approve it or put it on
    the next planning commission or governing body agenda; within 30 business days send one consolidated
    deficiency report or request information. If none of these happens in time, the submission is deemed
    approved. At most two deficiency reports; a later denial must give written reasons and refund 50% of
    review fees.'
  exclusions:
  - Days when local offices are closed during a declared state of emergency do not count
  - Does not apply to or modify contracts in effect before the act
  implementation_status: enacted
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - Deemed approval can be avoided by putting the item on an agenda, so it guarantees a hearing date
    more than an approval.
  - Also sets deadlines for releasing completion bonds after an independent engineer's inspection.
  - Enacted text read as House Amendment 2 (HA1200), adopted 2026-04-21; the Senate substituted the House
    bill and passed it. The Secretary of State public chapter PDF could not be read (HTTP 403).
  retrieved: 2026-11-24
  verified: true
  verification_note: capitol.tn.gov bill page shows 'Signed by Governor' 05/27/2026, Pub. Ch. 1044, effective
    date 01/01/2027, and the 'as enacted' summary. House Amendment 2 (capitol.tn.gov) has the operative
    text and 'This act takes effect on January 1, 2027'.
  sources:
  - label: HB 2552 bill information (Tennessee General Assembly)
    url: https://wapp.capitol.tn.gov/apps/BillInfo/Default.aspx?BillNumber=HB2552&GA=114
    official: true
  - label: House Amendment 2 (HA1200) to HB 2552
    url: https://capitol.tn.gov/Bills/114/Amend/HA1200.pdf
    official: true
  discovered_via: search
