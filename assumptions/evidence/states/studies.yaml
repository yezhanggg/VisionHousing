- id: us.pew_adu_report_2026
  kind: study
  state: US
  jurisdiction: 346 US cities with 100,000+ residents
  policy_types:
  - adu
  title: 'Pew: Accessory Dwelling Units Can Meaningfully Boost Housing Supply'
  citation: The Pew Charitable Trusts, report, October 21, 2026
  url: https://www.pew.org/en/research-and-analysis/reports/2026/10/accessory-dwelling-units-can-meaningfully-boost-housing-supply
  session: null
  bill: null
  enacted_date: null
  effective_dates: []
  geographic_scope: All 346 US cities with 100,000+ residents (Census estimates, May 2025); state ADU
    preemption laws in all states
  exclusions:
  - Cities under 100,000 residents
  - 40 of 346 cities lacked ADU permit data in the vendor dataset
  implementation_status: unknown
  litigation:
    status: not_applicable
    note: ''
    citation: null
    url: null
  outcome_measure: ADU building permits issued in 2025
  denominator: per 100,000 residents, by city ordinance type (permissive / restrictive / none)
  horizon: Cross-section for 2025; national permit series 2000-2025
  observed_result:
    summary: Cities with permissive ADU ordinances issued 81 ADU permits per 100,000 residents in 2025,
      over 11 times the rate of restrictive-ordinance cities and over 75 times the rate of cities with
      no ordinance. Outside California the permissive-city rate was 26 per 100,000. National ADU permits
      rose from 4,962 (2016) to 61,655 (2025); the 346 cities issued 37,455 of them. 276 of 346 cities
      (80%) allow ADUs; 118 of those impose at least one major restriction; 158 are permissive, 131 of
      them in states with strong preemption. 22 states had ADU preemption laws as of August 2026 (17 by-right).
    value: 81
    unit: ADU permits per 100,000 residents in 2025, permissive-ordinance cities
    source_label: Pew report, Key findings and 'Cities with permissive ordinances build more ADUs'
    source_url: https://www.pew.org/en/research-and-analysis/reports/2026/10/accessory-dwelling-units-can-meaningfully-boost-housing-supply
  identification: descriptive
  caveats:
  - Cross-sectional comparison of ordinance types; not a causal design, though authors argue gaps are
    not only geography
  - Results heavily driven by California; non-California permissive rate is 26 per 100k
  - Permits identified with vendor (ATTOM) proprietary ADU flag whose method is undocumented; Pew text
    classifier used as robustness check
  - Ordinance coding current as of April 2026; state preemption assumed fully in force regardless of local
    compliance
  - Permits are a proxy for construction
  retrieved: 2026-11-24
  verified: true
  verification_note: 'Read on pew.org report page (dated October 21, 2026): key findings, permit figures
    (61,655; 37,455; 81 and 26 per 100k), Table of city/state preemption counts, Appendix A (April 2026
    coding) and Appendix B (ATTOM permit data, 306 of 346 cities covered).'
  sources:
  - label: Pew report page
    url: https://www.pew.org/en/research-and-analysis/reports/2026/10/accessory-dwelling-units-can-meaningfully-boost-housing-supply
    official: true
  discovered_via: search
- id: us.urban_land_use_reforms_2023
  kind: study
  state: US
  jurisdiction: 1,136 cities in eight US metro regions
  policy_types:
  - missing_middle
  title: 'Urban Institute: Land-Use Reforms and Housing Costs (cross-city reform panel)'
  citation: 'Stacy, Davis, Freemark, Lo, MacDonald, Zheng, Pendall, ''Land-Use Reforms and Housing Costs:
    Does Allowing for Increased Density Lead to Greater Affordability?'', Urban Studies 60(14), 2023;
    Urban Institute page dated March 29, 2023'
  url: https://www.urban.org/research/publication/land-use-reforms-and-housing-costs
  session: null
  bill: null
  enacted_date: null
  effective_dates: []
  geographic_scope: 180 local upzoning or downzoning reforms in 1,136 cities across eight metro regions,
    2000-2019
  exclusions:
  - Reforms not found through newspaper text search
  - Only eight metro regions
  implementation_status: unknown
  litigation:
    status: not_applicable
    note: ''
    citation: null
    url: null
  outcome_measure: Housing supply (USPS address counts, new and existing stock); median rents; affordable
    units
  denominator: Cities with a loosening (upzoning) reform vs. same cities' pre-reform trend
  horizon: 3-9 years after reform passage
  observed_result:
    summary: Loosening reforms were associated with a statistically significant 0.8% increase in housing
      supply 3-9 years after passage, with gains mainly at the upper end of the rent distribution; no
      significant evidence that lower-cost units became more available or cheaper. Tightening reforms
      were associated with higher median rents and fewer units affordable to middle-income renters.
    value: 0.8
    unit: percent increase in housing stock, 3-9 years after loosening reform
    source_label: Urban Institute publication page
    source_url: https://www.urban.org/research/publication/land-use-reforms-and-housing-costs
  identification: causal
  caveats:
  - Panel fixed-effects model with city-specific time trends; authors frame results as associations
  - Reforms identified by machine learning on newspaper articles then hand-coded; AEI (2026) argues many
    coded reforms are too minor or misclassified, biasing the effect toward zero
  - Small short-run effect; may grow beyond the 9-year window
  - Eight metro regions only
  retrieved: 2026-11-24
  verified: true
  verification_note: urban.org publication page (March 29, 2023) states 180 reforms, 1,136 cities, eight
    metros, 2000-2019, fixed effects with city trends, and 0.8% supply increase within 3-9 years.
  sources:
  - label: Urban Institute publication page
    url: https://www.urban.org/research/publication/land-use-reforms-and-housing-costs
    official: true
  discovered_via: search
