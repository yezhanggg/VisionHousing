- id: or.hb2138_2025_middle_housing
  kind: policy
  state: OR
  jurisdiction: statewide
  policy_types:
  - missing_middle
  - starter_lots
  - adu
  title: 'Oregon HB 2138 (2025): expanded middle housing, urban unincorporated land and land divisions'
  citation: Enrolled HB 2138 (2025), Oregon Laws 2025, ch. 476; amends ORS 197A.420 and others
  url: https://olis.oregonlegislature.gov/liz/2025R1/Measures/Overview/HB2138
  session: 2025 regular session
  bill: HB 2138
  enacted_date: 2025-07-17
  effective_dates:
  - date: 2025-07-17
    applies_to: Act in force on passage (emergency clause)
  - date: 2027-01-01
    applies_to: Deadline for cities to conform with the expanded middle-housing rules; ban on private restrictions
      limiting middle housing, ADUs or density becomes operative (applied to documents of any date)
  - date: 2028-01-01
    applies_to: Deadline for cottage-cluster changes; LCDC rules due
  geographic_scope: 'Counties, cities of 25,000+ and Metro cities of 1,000+ must allow all middle housing
    types on each lot zoned residential (now including urban unincorporated land); non-Metro cities of
    2,500-25,000 must allow a duplex on each such lot. One or two extra units are allowed where a unit
    is accessible or affordable (up to five- or six-unit buildings).'
  exclusions:
  - Land outside urban growth boundaries or not zoned for residential use
  - Urban unincorporated land outside Metro is excluded from some provisions (existing-house additions,
    bonus units)
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - No traffic impact analysis may be required for an individual middle housing project (except townhouse
    or cottage projects over 12 units).
  - Reforms expedited land divisions (exempt from hearings and opponent appeals) and allows plats combining
    a land division and a middle housing land division, reviewed within 120 days (per the OLIS summary).
  - Also expands single room occupancies.
  retrieved: 2026-11-24
  verified: true
  verification_note: OLIS measure history shows 'Governor signed' 2025-07-17 and 'Chapter 476, (2025 Laws)
    Effective date July 17, 2025'. The enrolled text on OLIS shows the 2027-01-01 and 2028-01-01 dates
    and the scope.
