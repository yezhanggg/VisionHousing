    access: page
    cleaning: Only status, dates and cited sections are recorded, in a hand-checked rule file.
    checked_on: 2026-11-22
    notes: Bill text https://www.palegis.us/legislation/bills/text/HTM/2025/0/SB1346/PN1747  # secret-scan: allow (a public URL path, not a key)

  - id: bps_state_annual
    name: Building Permits Survey, state annual files
    publisher: U.S. Census Bureau
    url_pattern: https://www2.census.gov/econ/bps/State/st{year}a.txt
    vintage: 1990-2025 annual files (the 2025 file is the latest published)
    geography: [state]
    licence: Public domain (U.S. government work)
    terms_url: https://www.census.gov/about/policies/open-gov/open-data.html
    expected_size: 15000
    parser: bps.parse_state_annual
    limits: >-
      State totals of units authorized by permit, including the Bureau's imputation for
      offices that did not report. Construction value is in thousands of dollars.
    tier: 0
    access: file
    cleaning: >-
      Same header rules as the county files. Region, division and U.S. total rows are
      dropped. Value is converted to dollars.
    checked_on: 2026-11-22
    notes: Used to check that county rows add up to the published state totals.

  - id: acs5_geos
    name: American Community Survey 5-year summary file geography list (2020-2024)
    publisher: U.S. Census Bureau
    url_pattern: https://www2.census.gov/programs-surveys/acs/summary_file/2024/table-based-SF/documentation/Geos20245YR.txt  # secret-scan: allow (a public URL path, not a key)
    vintage: 2020-2024 5-year estimates
    geography: [state, county, tract]
    licence: Public domain (U.S. government work)
    terms_url: https://www.census.gov/programs-surveys/acs/data/summary-file.html
    expected_size: 90707242
    parser: acs.parse_geos
    limits: >-
      One national pipe-delimited file (about 91 MB) that names every geography in the
      summary files. Tracts are 2020 census tracts.
    tier: 0
    access: file
    cleaning: >-
      Streamed; only the state's state, county and tract rows are written to disk. The
      national file is never stored.
    checked_on: 2026-11-22

  - id: acs5_table_shells
    name: American Community Survey 5-year table shells (2020-2024)
    publisher: U.S. Census Bureau
    url_pattern: https://www2.census.gov/programs-surveys/acs/summary_file/2024/table-based-SF/documentation/ACS20245YR_Table_Shells.txt  # secret-scan: allow (a public URL path, not a key)
    vintage: 2020-2024 5-year estimates
    geography: [nation]
    licence: Public domain (U.S. government work)
    terms_url: https://www.census.gov/programs-surveys/acs/data/summary-file.html
    expected_size: 5622840
    parser: acs.parse_table_shells
    limits: The label of every table cell for this vintage; it holds no estimates.
    tier: 0
    access: file
    cleaning: Streamed; only the rows of the tables used are written to disk.
    checked_on: 2026-11-22

  - id: bls_qcew_construction
    name: Quarterly Census of Employment and Wages, annual averages, construction (NAICS 23)
    publisher: U.S. Bureau of Labor Statistics
    url_pattern: https://data.bls.gov/cew/data/api/{year}/a/industry/23.csv
    vintage: 2025 annual averages
    geography: [nation, state, county]
    licence: Public domain (U.S. government work)
    terms_url: https://www.bls.gov/cew/additional-resources/open-data/
    expected_size: 967029
    parser: costs.read_qcew
    limits: >-
      Average pay of construction jobs at private employers, by where the employer
      reports, not where it builds. A wage index is a proxy for local building costs;
      materials, land and fees are not in it. BLS withholds county figures that would
      reveal one employer; those counties take the state value.
    tier: 0
    access: file
    cleaning: >-
      Streamed; only the state's rows and the national row are written to disk. Private
      ownership (code 5) at nation, state and county level is kept. County pay is divided
      by state pay to give a county wage index.
    checked_on: 2026-11-22
    notes: >-
      Chosen over BEA regional price parities, which also answer without a key but exist
      only for states and metro areas and measure consumer prices.

  - id: ntm_agencies
    name: National Transit Map, agencies
    publisher: U.S. Department of Transportation, Bureau of Transportation Statistics
    url_pattern: https://services.arcgis.com/xOi1kZaI0eWDREZv/arcgis/rest/services/NTAD_National_Transit_Map_Agencies/FeatureServer/0/query  # secret-scan: allow (a public URL path, not a key)
    vintage: National Transportation Atlas Database release compiled 2026-09-23
    geography: [point]
    licence: Public domain (U.S. government work)
    terms_url: https://geodata.bts.gov/datasets/usdot::national-transit-map-agencies
    parser: transit.fetch_ntm_agencies
    limits: Agency names and addresses only; used to label the transit coverage table.
    tier: 0
    access: feature_service
    cleaning: Keeps the National Transit Database id and agency name of the agencies with stops in the state's bounding box.
    checked_on: 2026-11-22

  - id: mdb_catalog
    name: Mobility Database catalog of transit schedule feeds
    publisher: MobilityData
    url_pattern: https://storage.googleapis.com/storage/v1/b/mdb-csv/o/sources.csv?alt=media
    vintage: current
    geography: [state]
    licence: Catalog published openly by MobilityData; each listed feed keeps its agency's own terms
    terms_url: https://mobilitydatabase.org/
    expected_size: 1221361
    parser: transit.select_feeds
    limits: >-
      A volunteer-maintained list; some agencies are missing, listed under another state,
      or listed only with an old (deprecated) feed. Feeds that need a key or log-in are
      not used.
    tier: 0
    access: file
    cleaning: >-
      Keeps the state's schedule (GTFS) feeds. A deprecated feed is used only when the
      same provider has no active one.
    checked_on: 2026-11-22

  - id: gtfs_agency_feeds
    name: Transit agency schedule feeds (GTFS), via their published addresses or the catalog mirror
    publisher: Each transit agency (copies mirrored by MobilityData)
    url_pattern: https://storage.googleapis.com/storage/v1/b/mdb-latest/o/{feed_file}?alt=media
    vintage: The schedule current when fetched; the representative date is recorded per feed
    geography: [point]
    licence: Each agency's own open-data terms (for example SEPTA and Pittsburgh Regional Transit developer terms)
    terms_url: https://mobilitydatabase.org/
    parser: transit.read_gtfs
    limits: >-
      Scheduled, not actual, service. One representative weekday per feed. Only feeds
      that download without a key are used; bus stops of other agencies are marked
      frequency unknown. Agencies change stop ids between schedules, so a few stops
      may not match the National Transit Map.
    tier: 1
    access: range
    member: stop_times.txt
    cleaning: >-
      Reads stops, routes, trips, stop times, calendars and frequencies (never shapes).
      Counts boarding calls per stop on the busiest Tuesday to Thursday; a trip's last
      stop and no-pickup calls are left out. Only the per-stop counts are stored.
    checked_on: 2026-11-22
    notes: >-
      The agency address listed in the catalog is tried first (http upgraded to https);
      the catalog's mirror copy is the fallback.

  # ---- Place profile: jobs, incentive areas and safety (market research sections) ----

  - id: lodes_wac
    name: LEHD Origin-Destination Employment Statistics (LODES 8), workplace area characteristics, all jobs
    publisher: U.S. Census Bureau, Longitudinal Employer-Household Dynamics program
    url_pattern: https://lehd.ces.census.gov/data/lodes/LODES8/{st}/wac/{st}_wac_S000_JT00_{year}.csv.gz
    vintage: LODES 8, 2024 (files dated 2026-10-14)
    geography: [block, tract, county]
    licence: Public domain (U.S. government work)
    terms_url: https://lehd.ces.census.gov/data/
    expected_size: null
    parser: jobs.sum_wac_to_tracts
    limits: >-
      Counts jobs covered by unemployment insurance plus federal civilian jobs, by
      where people work. Self-employed people, the military and informal work are
      not counted. A person with two jobs counts twice. The Census Bureau adds noise
      to block counts for privacy; tract and county sums are much steadier.
    tier: 0
    access: file
    cleaning: >-
      Block rows are summed to 2020 tracts: total jobs, three monthly-earnings bands
      and 20 industry sectors. Only the tract sums are kept; the block file is deleted.
    checked_on: 2026-11-22

  - id: lodes_od
    name: LEHD Origin-Destination Employment Statistics (LODES 8), home-to-work flows, all jobs
    publisher: U.S. Census Bureau, Longitudinal Employer-Household Dynamics program
    url_pattern: https://lehd.ces.census.gov/data/lodes/LODES8/{st}/od/{st}_od_{part}_JT00_{year}.csv.gz
    vintage: LODES 8, 2024 (files dated 2026-10-14)
    geography: [block, county]
    licence: Public domain (U.S. government work)
    terms_url: https://lehd.ces.census.gov/data/
    expected_size: null
    parser: jobs.sum_od_to_counties
    limits: >-
      Links each job's workplace block to the worker's home block. The "main" file
      covers jobs with both ends in the state; the "aux" file adds workers who live
      in another state. Residents who work in another state are in that state's
      files, which are not read, so out-commuting across the state line is not
      counted. Same job coverage as the workplace file.
    tier: 0
    access: file
    cleaning: >-
      Streamed line by line; jobs (S000) are summed to pairs of counties (work county,
      home county or "out_of_state"). Only the county pairs are kept.
    checked_on: 2026-11-22

  - id: cbp_county
    name: County Business Patterns, county file
    publisher: U.S. Census Bureau
    url_pattern: https://www2.census.gov/programs-surveys/cbp/datasets/{year}/cbp{yy}co.zip
    vintage: 2023 (published 2025-06-26; 2024 not yet published on 2026-11-22)
    geography: [county]
    licence: Public domain (U.S. government work)
    terms_url: https://www.census.gov/programs-surveys/cbp/technical-documentation/methodology.html
    expected_size: 12919520
    parser: jobs.read_cbp
    limits: >-
      Counts private establishments with paid employees and their mid-March
      employment and yearly payroll. Government, self-employed and most farm work
      are left out. Small cells carry noise; the noise flag is kept. Establishments
      that cannot be placed in a county are left out, so counties do not add up to
      the state total.
    tier: 0
    access: file
    cleaning: >-
      The national zip is read as a stream; the state's all-sector and two-digit NAICS
      sector rows are kept. Payroll stays in thousands of dollars. The zip is deleted.
    checked_on: 2026-11-22

  - id: hud_qct
    name: Low-Income Housing Tax Credit Qualified Census Tracts
    publisher: U.S. Department of Housing and Urban Development
    url_pattern: https://services.arcgis.com/VTyQ9soqVukalItT/arcgis/rest/services/QUALIFIED_CENSUS_TRACTS_2026/FeatureServer/0/query  # secret-scan: allow (a public URL path, not a key)
