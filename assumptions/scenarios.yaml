# VisionHousing scenarios.
#
# The baseline and the five benchmark reforms use the Challenge Handbook's exact
# wording ("handbook_text"). Two Pennsylvania scenarios model bills before the
# General Assembly. "overrides" changes ledger values (assumptions/parameters.yaml)
# for that scenario only; every id is checked against the ledger on load.
#
# building_types names the kinds of existing lots a reform reaches:
#   sf_detached   single-family detached home
#   sf_attached   semi-detached or row (townhouse) home
#   two_to_four   building with two to four homes
#   five_plus     building with five or more homes

_sources:
  - &handbook
    id: handbook_benchmarks
    citation: >-
      Housing Data and Technology Innovation Challenge, Participant Handbook,
      "Benchmark Policy Scenarios" and "The five scenarios"
    url: https://housingchallenge.turnout.rocks/handbook.html
    accessed: 2026-11-22
  - &hb2186
    id: pa_hb2186_pn3373
    citation: >-
      Pennsylvania House Bill 2186 of the 2025-2026 session, printer's number 3373
      (adds 53 Pa.C.S. Chapter 63, accessory dwelling units), sections 6302 and 6305;
      passed the House 139-62 on June 1, 2026; referred to Senate Urban Affairs and
      Housing on June 5, 2026
    url: https://www.palegis.us/legislation/bills/2025/hb2186
    accessed: 2026-11-22
  - &hb2186_text
    id: pa_hb2186_pn3373_text
    citation: "Text of House Bill 2186, printer's number 3373"
    url: https://www.palegis.us/legislation/bills/text/HTM/2025/0/HB2186/PN3373  # secret-scan: allow (public web address)
    accessed: 2026-11-22
  - &sb1346
    id: pa_sb1346_pn1747
    citation: >-
      Pennsylvania Senate Bill 1346 of the 2025-2026 session, printer's number 1747
      (amends the Municipalities Planning Code, adds section 603.2); referred May 26,
      2026; reported as committed July 12, 2026; laid on the table Nov 17, 2026
    url: https://www.palegis.us/legislation/bills/2025/sb1346
    accessed: 2026-11-22
  - &sb1346_text
    id: pa_sb1346_pn1747_text
    citation: "Text of Senate Bill 1346, printer's number 1747, section 603.2(a) and (k)"
    url: https://www.palegis.us/legislation/bills/text/HTM/2025/0/SB1346/PN1747  # secret-scan: allow (public web address)
    accessed: 2026-11-22
