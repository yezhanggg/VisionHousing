    licence: Public legislative record
    terms_url: https://www.palegis.us/legislation/bills/2025/hb2186
    parser: legislation.read_bill_status
    limits: >-
      A proposed bill, not law, unless enacted; it lapses at the end of the session.
      Status is re-checked after November 30.
    tier: 0
    access: page
    cleaning: Only status, dates and cited sections are recorded, in a hand-checked rule file.
    checked_on: 2026-11-22
    notes: Bill text https://www.palegis.us/legislation/bills/text/HTM/2025/0/HB2186/PN3373  # secret-scan: allow (a public URL path, not a key)

  - id: pa_sb1346
