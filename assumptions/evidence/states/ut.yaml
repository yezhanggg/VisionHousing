- id: ut.hb82_2021_internal_adu
  kind: policy
  state: UT
  jurisdiction: statewide
  policy_types:
  - adu
  - parking
  title: 'Utah HB 82 (2021): internal ADUs are a permitted use in primarily residential zones'
  citation: Laws of Utah 2021, ch. 102 (HB 82); Utah Code 10-9a-530 and 17-27a-526 (as enacted)
  url: https://le.utah.gov/~2021/bills/static/HB0082.html
  session: 2021 General Session
  bill: HB 82
  enacted_date: 2021-03-16
  effective_dates:
  - date: 2021-05-05
    applies_to: Most of the act
  - date: 2021-10-01
    applies_to: Internal ADU sections for municipalities (10-9a-530) and counties (17-27a-526), short-term
      rental and HOA sections (10-8-85.4, 17-50-338, 57-8a-209, 57-8a-218)
  geographic_scope: All municipalities and counties; areas zoned primarily residential; one internal ADU
    inside an owner-occupied detached single-family home
  exclusions:
  - Internal ADUs only (within the house footprint); detached ADUs not covered
  - Localities may bar them on lots of 6,000 sq ft or less, in homes on failing septic, in mobile homes,
    and in zones covering up to 25% of residential land (67% in some university towns)
  - Localities may require one extra parking space, owner occupancy, a rental permit and no rentals under
    30 days
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - Later recodified (2025 renumbering of Title 10 land use code); 2022 HB 462 barred impact fees on some
    internal ADUs, and 2026 SB 284 added a detached-ADU rule (ut.sb284_2026_detached_adu).
  - Narrower than benchmark reform 1 (no detached ADU, parking may be required).
  retrieved: 2026-11-24
