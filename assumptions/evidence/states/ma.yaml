  title: Massachusetts MBTA Communities law (M.G.L. c. 40A, § 3A)
  citation: M.G.L. c. 40A, § 3A, inserted by St. 2020, c. 358, § 18
  url: https://malegislature.gov/Laws/GeneralLaws/PartI/TitleVII/Chapter40A/Section3A
  session: null
  bill: null
  enacted_date: 2021-01-14
  effective_dates: []
  geographic_scope: MBTA communities. Each must have at least one zoning district of reasonable size that
    allows multifamily housing as of right at a gross density of at least 15 units per acre, with no age
    restrictions, suitable for families with children, and within 0.5 mile of a commuter rail, subway,
    ferry or bus station if applicable.
  exclusions:
  - Density is subject to wetlands (c. 131 § 40) and Title 5 septic limits
  implementation_status: legally_effective
  litigation:
    status: decided
    note: Attorney General v. Town of Milton (SJC, reported decided 2025-01-08). See ma.ag_v_milton_2025,
      which is unverified.
    citation: SJC-13580
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - Noncompliant communities lose eligibility for the Housing Choice Initiative, Local Capital Projects
    Fund, MassWorks and HousingWorks.
  - EOHLC compliance guidelines are required by statute. The EOHLC compliance-status page (mass.gov) returned
    HTTP 403, so counts of compliant, interim and noncompliant communities and the deadlines are NOT recorded.
  - Zoning capacity is not permits or construction.
  retrieved: 2026-11-24
  verified: true
  verification_note: Statute text read on malegislature.gov. St. 2020, c. 358 on malegislature.gov shows
    § 18 inserting § 3A and 'Approved (in part), January 14, 2021'. The mass.gov compliance page could
    not be read (403).
  sources:
