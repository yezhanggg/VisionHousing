  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - 'Current RCW 36.70A.635(11): comply at the later of the next periodic update or 12 months after the
    next implementation progress report following an OFM threshold finding. Commerce''s 2023 notice described
    a ''six months after periodic update'' deadline from the original text; that wording is not in the
    current statute.'
  - If a city misses the deadline, Commerce's model ordinance supersedes conflicting local rules (RCW
    36.70A.636(2)(b)).
  - 'Parking caps: none within 1/2 mile of major transit; max 1 space/unit on lots <= 6,000 sq ft, 2 on
    larger lots.'
  - Commerce publishes model ordinances (two city-size versions) and a city-by-city deadlines PDF (Box
    link not read).
