- id: nc.sl2026_39_parking
  kind: policy
  state: NC
  jurisdiction: statewide
  policy_types:
  - parking
  title: 'North Carolina Session Law 2026-39 (HB 162): no minimum number of off-street parking spaces'
  citation: N.C. Session Law 2026-39 (HB 162), amending G.S. 160D-702(c)
  url: https://www.ncleg.gov/BillLookUp/2025/H162
  session: 2025-2026 session
  bill: HB 162
  enacted_date: 2026-07-06
  effective_dates:
  - date: 2026-07-06
    applies_to: Part II stormwater limits for redevelopment (G.S. 143-214.7(b3)); local ordinances must conform
      within 12 months
  - date: 2027-01-01
    applies_to: 'Part I: G.S. 160D-702(c)(2a), no zoning or development rule may require a minimum number
      of off-street parking spaces per development or structure, for any use'
  geographic_scope: All North Carolina local governments that regulate development under Chapter 160D,
    for every occupancy or use. In the coastal area (as defined in G.S. 113A-103) the ban
    reaches only listed historic properties and districts.
  exclusions:
  - Local governments in the coastal area keep parking minimums except on properties in National Register
    or local historic districts, individually listed or designated landmarks, and Study List properties
  implementation_status: enacted
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - The ban is on minimums only. Developers may still build parking, and lenders or markets may still require
    it.
  - Our reading of the coastal exception (minimums survive there except on historic properties) comes
    from the session law wording; no state guidance on it was read.
  - The same law limits stormwater controls on redevelopment of already built-on sites.
  retrieved: 2026-11-24
  verified: true
  verification_note: ncleg.gov bill page shows ratified 2026-07-01, signed by the Governor 2026-07-06,
    Ch. SL 2026-39. The session law text on ncleg.gov shows 'Approved 3:04 p.m. this 6th day of July,
    2026', Section 1.(b) effective January 1, 2027, and Part II effective when it becomes law.
  sources:
