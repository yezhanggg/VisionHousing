  title: 'Nevada AB 396 (2025): large counties and cities must adopt ADU ordinances, or ADUs are allowed
    without restriction'
  citation: Statutes of Nevada 2025, ch. 365 (AB 396); new section in NRS chapter 278
  url: https://www.leg.state.nv.us/App/NELIS/REL/83rd2025/Bill/12561/Overview
  session: 83rd (2025) regular session
  bill: AB 396
  enacted_date: 2025-06-06
  effective_dates:
  - date: 2025-06-06
    applies_to: Sections 13-14, and sections 1-12 for regulations and preparatory tasks
  - date: 2026-07-01
    applies_to: 'Sections 1-12 for all other purposes; covered governments without a compliant ordinance
      by this date: ADUs allowed on any residentially zoned parcel without restriction (section 11)'
  geographic_scope: Counties of 100,000+ (Clark, Washoe) and cities of 60,000+ (Las Vegas, Henderson, North
    Las Vegas, Reno, Sparks); residential property means areas zoned single-family
  exclusions:
  - Areas under an interstate regional planning agency whose plan regulates housing (Tahoe basin)
  - Smaller counties and cities
  - No more than two ADUs per property are authorized
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - 'The ordinance may not: bar a separate kitchen; require more than one extra parking space (when existing
    and street parking suffice); impose side or rear setbacks stricter than for the main home; require
    street work beyond repair or safety; or bar long-term rental (short-term/transient use may be barred).'
  - ADUs need only residential (not commercial) building and fire codes.
  - Most of the bill also changes common-interest community (HOA) rules.
