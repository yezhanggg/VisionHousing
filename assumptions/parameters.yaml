    low: 0.30
    high: 0.45
    shape: pert
    kind: judgement
    source: []
    rationale: "Vacancy, management, upkeep, insurance and property tax for a professionally run building."
    used_by: [tod, parking]
    revisit: "Build from parts as for ADUs."
    status: draft

  # ---------------------------------------------------------------- ADU scenario additions (P2-05)

  adu.fit_range_position:
    label: "Position inside the calibrated ADU fit range"
    unit: "factor"
    central: 0
    low: -1
    high: 1
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      The physical-fit share comes from the calibration table
      assumptions/calibration/adu_fit.yaml, which gives a central, low and high
      share for each building type and area type. Each draw picks one position:
      -1 puts every cell at its low, 0 at its central value, +1 at its high.
      All cells move together, so errors do not cancel across tracts.
    used_by: [adu, pa_hb2186, pa_sb1346]
    revisit: "Replace by the fit-transfer error band once job T3 is run (P5-04)."
    status: draft

  adu.homes_per_building_two_family:
    label: "Homes per building in the census two-unit class"
    unit: "units/lot"
    central: 2
    low: 2
    high: 2
    shape: fixed
    kind: judgement
    source: []
    rationale: >-
      The census units-in-structure class "2" counts homes in two-unit
      buildings, so dividing by 2 gives the number of such lots.
    used_by: [pa_hb2186]
    revisit: "None expected; this follows the class definition."
    status: draft

  adu.homes_per_building_three_four:
    label: "Average homes per building in the census three-or-four-unit class"
    unit: "units/lot"
    central: 3.5
    low: 3
    high: 4
    shape: triangular
    kind: judgement
    source: []
    rationale: >-
      The census class "3 or 4" counts homes, not buildings. Dividing by the
      average size turns homes into lots; 3.5 is the midpoint of the class.
    used_by: [pa_hb2186]
    revisit: "Check the three-to-four split in Tier 2 parcel counties (P5-03)."
    status: draft

  adu.pittsburgh_share_of_allegheny_lots:
    label: "Share of Allegheny County's eligible lots inside the City of Pittsburgh"
    unit: "share"
    central: 0.20
    low: 0.15
    high: 0.25
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      FLAGGED STUB. SB 1346 leaves Pittsburgh out, but Pittsburgh is a city
      inside Allegheny County. Until the tract-to-municipality split is built,
      this share of every Allegheny tract's eligible lots is removed. Pittsburgh
      holds about 24% of the county's 2020 residents (302,971 of 1,250,578) but
      fewer of its detached homes, so the central value is lower.
    used_by: [pa_sb1346]
    revisit: >-
      Replace with the exact tract-by-municipality split from the Census block
      assignment file (P4-08).
    status: draft

  # ---------------------------------------------------------------- Channel B: fees and parking (P2-08, P2-09)
  # Added for the cost-saving supply response: added = baseline x e x (dC / V) x k.

  fees.passthrough_k:
    label: "Share of a fee cut that reaches the decision to build"
    unit: "share"
    central: 0.5
    low: 0.05
    high: 1.0
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      Who gains from a fee cut is the most uncertain step of the fee reform. If
      landowners raise land prices by the full saving, almost nothing reaches the
      build decision (near 0); if land prices do not move, all of it does (1).
      Studies of fee incidence point both ways, so the range is kept wider than
      the general pass-through share and this parameter leads the fee tornado.
    used_by: [fees]
    revisit: >-
      Read the evidence on development-fee incidence (backlog P4-05) and narrow
      the range; until then it stays the widest input of the fee reform.
    status: draft

  supply.new_construction_value_premium:
    label: "Value of a newly built unit above the area's median, as a share"
    unit: "share"
    central: 0.20
    low: 0.05
    high: 0.40
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      Value per new unit (V) starts from the county median home value (or median
      gross rent, for rented building types) read from ACS brackets. New homes
      sell and rent above the median of the existing stock, so V adds this premium.
    used_by: [fees, parking]
    revisit: "Compare new-construction sale prices (Census SOC) with ACS county medians."
    status: draft

  supply.crosscheck_land_share:
    label: "Land cost as a share of development cost, pro-forma cross-check"
    unit: "share"
    central: 0.15
    low: 0.05
    high: 0.30
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      Used only by the pro-forma cross-check of the fee and parking reforms: a
      project pencils where its value covers development cost, the builder's
      return and land. Land is often a tenth to a quarter of total cost.
    used_by: [fees, parking]
    revisit: "Source land shares from published development pro formas or land sales."
    status: draft

  supply.evidence_saiz_philadelphia:
    label: "Metro housing supply elasticity, Philadelphia PA-NJ (Saiz 2010)"
    unit: "ratio"
    central: 1.65
    low: 1.65
    high: 1.65
    shape: fixed
    kind: sourced
    source:
      - id: saiz_2010_qje
        citation: >-
          Albert Saiz (2010), "The Geographic Determinants of Housing Supply",
          Quarterly Journal of Economics 125(3), 1253-1296, Table VI (metro areas
          with population over 500,000)
        url: https://doi.org/10.1162/qjec.2010.125.3.1253
        accessed: 2026-11-22
    rationale: >-
      Evidence, not a model input: Table VI lists Philadelphia at 1.65 and the
      paper's population-weighted metro average is 1.75. It brackets the central
      medium-run elasticity from above; Saiz measures the long-run price
      elasticity of the housing stock, not of permits.
    used_by: [fees, parking]
    revisit: "Use with job T6 to set the range of supply.elasticity_medium_run."
    status: sourced

  supply.evidence_saiz_pittsburgh:
    label: "Metro housing supply elasticity, Pittsburgh PA (Saiz 2010)"
    unit: "ratio"
    central: 1.20
    low: 1.20
    high: 1.20
    shape: fixed
    kind: sourced
    source:
      - id: saiz_2010_qje
        citation: >-
          Albert Saiz (2010), "The Geographic Determinants of Housing Supply",
          Quarterly Journal of Economics 125(3), 1253-1296, Table VI (metro areas
          with population over 500,000)
        url: https://doi.org/10.1162/qjec.2010.125.3.1253
        accessed: 2026-11-22
    rationale: >-
      Evidence, not a model input: Table VI lists Pittsburgh at 1.20 (Allentown
      1.86, Harrisburg 1.63, Scranton 1.62). Pennsylvania metros sit between
      about 1.2 and 1.9 in the long run.
    used_by: [fees, parking]
    revisit: "Use with job T6 to set the range of supply.elasticity_medium_run."
    status: sourced

  supply.evidence_tract_unit_elasticity:
    label: "Average neighbourhood housing-unit supply elasticity (Baum-Snow and Han 2024)"
    unit: "ratio"
    central: 0.3
    low: 0.3
    high: 0.3
    shape: fixed
    kind: sourced
    source:
      - id: baum_snow_han_2024_jpe
        citation: >-
          Nathaniel Baum-Snow and Lu Han (2024), "The Microgeography of Housing
          Supply", Journal of Political Economy 132(6), 1897-1946, abstract
        url: https://ideas.repec.org/a/ucp/jpolec/doi10.1086-728110.html
        accessed: 2026-11-22
    rationale: >-
      Evidence, not a model input: across urban U.S. tracts, floor-space and
      unit supply elasticities average about 0.5 and 0.3. Read from the
      abstract. It brackets the medium-run elasticity from below, since a single
      tract can push demand onto its neighbours.
    used_by: [fees, parking]
    revisit: "Read the full article and record the table; use with job T6."
    status: sourced

  parking.mix_underground_elsewhere:
    label: "Share of spaces underground, other tracts"
    unit: "share"
    central: 0.0
    low: 0.0
    high: 0.05
    shape: pert
    kind: judgement
    source: []
    rationale: "Away from transit, underground residential parking is very rare."
    used_by: [parking]
    revisit: "Estimate from local project data or land prices."
    status: draft

  parking.mix_surface_attached:
    label: "Share of spaces that are surface spaces, 2-4-unit buildings"
    unit: "share"
    central: 0.95
    low: 0.80
    high: 1.0
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      Small buildings park on driveways and small lots; the rest are tuck-under
      garages, costed as structured spaces.
    used_by: [parking]
    revisit: "Check against a sample of new 2-4-unit buildings in Pennsylvania."
    status: draft

  parking.transit_bus_min_departures:
    label: "Weekday departures that make a bus stop a major transit stop"
    unit: "departures per weekday"
    central: 64
    low: 64
    high: 64
    shape: fixed
    kind: judgement
    source: []
    rationale: >-
      Decision D-07: a major transit stop is a fixed-guideway station, or a bus
      stop with at least 64 weekday departures (about every 15 minutes over 16 hours).
    used_by: [parking, tod]
    revisit: "Only if decision D-07 changes."
    status: draft

  parking.transit_rail_radius_miles:
    label: "Distance around a rail station counted as near transit"
    unit: "miles"
    central: 0.5
    low: 0.5
    high: 0.5
    shape: fixed
    kind: judgement
    source: []
    rationale: "Decision D-07: half a mile, straight line, for fixed-guideway stations."
    used_by: [parking, tod]
    revisit: "Only if decision D-07 changes (the interface offers 1/4, 1/2 and 3/4 mile)."
    status: draft

  parking.transit_bus_radius_miles:
    label: "Distance around a frequent bus stop counted as near transit"
    unit: "miles"
    central: 0.25
    low: 0.25
    high: 0.25
    shape: fixed
    kind: judgement
    source: []
    rationale: "Decision D-07: a quarter mile, straight line, for frequent bus stops."
    used_by: [parking, tod]
    revisit: "Only if decision D-07 changes."
    status: draft

  parking.transit_rich_min_share:
    label: "Share of a tract's homes near a major stop that makes it transit-rich"
    unit: "share"
    central: 0.5
    low: 0.5
    high: 0.5
    shape: fixed
    kind: judgement
    source: []
    rationale: >-
      A tract is flagged transit-rich when at least half of its housing units sit
      in census blocks within the D-07 distance of a major transit stop.
    used_by: [parking]
    revisit: "Test 1/4 and 3/4 once real stop data are in the pack."
    status: draft

  supply.crosscheck_pareto_alpha:
    label: "Pareto shape of the open top rent and value bracket, pro-forma cross-check"
    unit: "ratio"
    central: 2.5
    low: 1.5
    high: 4.0
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      Break-evens for new buildings often fall inside the open top ACS bracket
      ($3,500+ rent, $2,000,000+ value). The cross-check spreads that bracket as a
      Pareto tail with this shape instead of treating it as zero. Larger values mean
      a thinner tail. Rents are less spread out than incomes, so the central value
      sits above typical income-tail shapes.
    used_by: [fees, parking]
    revisit: "Fit from tract rent microdata (ACS PUMS) for Pennsylvania metros."
    status: draft

  # ---------------------------------------------------------------- missing middle funnel (P2-06)

  missing_middle.typology_weight_duplex:
    label: "Relative weight of duplexes (2 units) in the missing-middle mix"
    unit: "ratio"
    central: 0.35
    low: 0.20
    high: 0.50
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      The funnel prices five building types, from a duplex to a sixplex, and
      weights them. The five weights are drawn and then divided by their sum, so
      only their relative size matters. Duplexes are the most common gentle-density
      project in places that allow them, because they need the least land and money.
    used_by: [missing_middle]
    revisit: "Set from permits by structure type in places after gentle-density reforms."
    status: draft

  missing_middle.typology_weight_triplex:
    label: "Relative weight of triplexes (3 units) in the missing-middle mix"
    unit: "ratio"
    central: 0.20
    low: 0.10
    high: 0.30
    shape: pert
    kind: judgement
    source: []
    rationale: "Second most common small form; weights are divided by their sum in every draw."
    used_by: [missing_middle]
    revisit: "Set from permits by structure type in places after gentle-density reforms."
    status: draft

  missing_middle.typology_weight_fourplex:
    label: "Relative weight of fourplexes (4 units) in the missing-middle mix"
    unit: "ratio"
    central: 0.25
    low: 0.10
    high: 0.40
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      Fourplexes are the largest building that many lenders still finance as
      residential; a common middle case. Weights are divided by their sum.
    used_by: [missing_middle]
    revisit: "Set from permits by structure type in places after gentle-density reforms."
    status: draft

  missing_middle.typology_weight_fiveplex:
    label: "Relative weight of five-unit buildings in the missing-middle mix"
    unit: "ratio"
    central: 0.05
    low: 0.0
    high: 0.10
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      Five or more units usually moves a building to commercial financing and
      stricter building-code rules, so five-unit buildings are rare. Weights are
      divided by their sum.
    used_by: [missing_middle]
    revisit: "Set from permits by structure type in places after gentle-density reforms."
    status: draft

  missing_middle.typology_weight_sixplex:
    label: "Relative weight of sixplexes (6 units) in the missing-middle mix"
    unit: "ratio"
    central: 0.15
    low: 0.05
    high: 0.30
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      If a builder moves to commercial rules anyway, the most units allowed pay
      best, so sixplexes are more common than five-unit buildings. Weights are
      divided by their sum.
    used_by: [missing_middle]
    revisit: "Set from permits by structure type in places after gentle-density reforms."
    status: draft

  missing_middle.acquisition_premium:
    label: "Price a builder pays above a home's value to buy it"
    unit: "share"
    central: 0.10
    low: 0.0
    high: 0.25
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      An owner who is not selling must be paid more than the home is worth, and
      census home values are owners' own estimates. A lot pencils when its home
      value x (1 + this premium) is at or below the residual land value.
    used_by: [missing_middle]
    revisit: "Compare teardown sale prices with assessed or census values in Tier 2 counties."
    status: draft

  missing_middle.rent_ratio_2br:
    label: "Two-bedroom rent as a share of the all-unit median rent (fallback)"
    unit: "ratio"
    central: 1.08
    low: 0.98
    high: 1.20
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      A missing-middle unit of about 1,000 sq ft rents like a two-bedroom. The
      tract's own two-bedroom median is used where it exists; this ratio times
      the tract's median gross rent is the fallback where it is blank.
    used_by: [missing_middle]
    revisit: "Compute county ratios from ACS B25031 as for the one-bedroom ratio."
    status: draft

  missing_middle.sf_turnover_annual:
    label: "Share of single-family homes sold each year"
    unit: "share per year"
    central: 0.045
    low: 0.03
    high: 0.06
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      A lot is redeveloped only after it is sold, so the yearly redevelopment
      rate can never exceed the yearly sale rate of single-family homes. The
      funnel uses the smaller of the two in every draw.
    used_by: [missing_middle]
    revisit: "Source from county deed-transfer counts or a published home-sales series."
    status: draft

  missing_middle.ramp_first_year_share:
    label: "Missing-middle permits in the first year, as a share of the steady rate"
    unit: "share"
    central: 0.20
    low: 0.05
    high: 0.40
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      Builders must learn the new rules, find sites and arrange money, so the
      first year is slow; the rate climbs to full over missing_middle.ramp_years_to_full.
    used_by: [missing_middle]
    revisit: "Fit to published post-reform permit paths."
    status: draft

  missing_middle.min_lot_sqft:
    label: "Smallest lot that holds a 2-6 unit building"
    unit: "sq ft"
    central: 5000
    low: 3500
    high: 7000
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      With setbacks and coverage not binding (Handbook), a three-storey building
      of 2-6 units of about 1,000 sq ft plus surface parking needs roughly
      3,500-7,000 sq ft of lot. Used only when the tract has the block lot-size proxy.
    used_by: [missing_middle]
    revisit: "Measure built missing-middle lot sizes in Tier 2 parcel counties."
    status: draft

  missing_middle.lot_proxy_net_share:
    label: "Share of block land per home that is the home's own lot"
    unit: "share"
    central: 0.60
    low: 0.45
    high: 0.75
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      The block lot-size proxy divides a block's land by its homes, so it also
      counts half the streets, parks and shops. Lot area = proxy x this share.
    used_by: [missing_middle]
    revisit: "Compare the proxy with parcel areas in Tier 2 counties (P5-03)."
    status: draft

  missing_middle.adu_lot_overlap_share:
    label: "Share of lots used by ADUs that leave the missing-middle pool"
    unit: "share"
    central: 0.75
    low: 0.50
    high: 1.0
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      In a package with the ADU reform, a lot that gets an ADU is rarely torn
      down soon after. Lots the engine passes as used by ADUs are removed from
      eligible lots at this share; the rest sit outside single-family-only zones
      or would be redeveloped anyway.
    used_by: [missing_middle]
    revisit: "Revisit with the package allocation rule (P2-11)."
    status: draft

  missing_middle.new_unit_rent_premium:
    label: "Rent premium of a new 2-6 unit building's homes over the census two-bedroom median"
    unit: "ratio"
    central: 1.25
    low: 1.05
    high: 1.50
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      Census medians mix long-time tenants in older buildings with new leases.
      A newly built apartment of about 1,000 sq ft usually asks well above the
      median two-bedroom rent of its tract, more so than a small backyard ADU
      (adu.new_unit_rent_premium), so this entry is its own.
    used_by: [missing_middle]
    revisit: "Compare Census SOMA asking rents for new apartments with ACS median gross rent."
    status: draft

  # ---------------------------------------------------------------- verdict words
  # The one-word verdict per reform (explain.verdicts) reads these thresholds.
  # They are presentation judgements, not model inputs: no result depends on them.

  explain.verdict_a_lot_pct:
    label: "Smallest middle-estimate gain that earns the verdict \"Adds a lot\""
    unit: "% of baseline"
    central: 5
    low: 5
    high: 5
    shape: fixed
    kind: judgement
    source: []
    rationale: >-
      A reform whose middle estimate (P50) adds at least this share of the baseline's
      five-year permits is called "Adds a lot". One home in twenty is large next to
      the year-to-year swing in statewide permits.
    used_by: [adu, missing_middle, parking, fees, pa_hb2186, pa_sb1346]
    revisit: "Revisit once the benchmark reforms are compared with observed reforms (P2-17)."
    status: draft

  explain.verdict_some_pct:
    label: "Smallest middle-estimate gain that earns the verdict \"Adds some\""
    unit: "% of baseline"
    central: 1
    low: 1
    high: 1
    shape: fixed
    kind: judgement
    source: []
    rationale: >-
      Below this share of the baseline's five-year permits (middle estimate, P50) a
      reform is called "Little effect": the gain is smaller than the rounding in most
      published permit totals.
    used_by: [adu, missing_middle, parking, fees, pa_hb2186, pa_sb1346]
    revisit: "Revisit once the benchmark reforms are compared with observed reforms (P2-17)."
    status: draft

  explain.verdict_overlap_share:
    label: "Share of a reform's own gain lost to overlap that earns the verdict \"Overlaps\""
    unit: "share"
    central: 0.5
    low: 0.5
    high: 0.5
    shape: fixed
    kind: judgement
    source: []
    rationale: >-
      In a package, when at least this share of a reform's middle estimate run alone is
      removed because another reform in the package uses the same lots, the reform is
      called "Overlaps": most of what it would add is already counted elsewhere.
    used_by: [missing_middle, packages]
    revisit: "Revisit with the package allocation rule (P2-11)."
    status: draft

  # ================================================================= transit-oriented density (benchmark 3)
  # Read by scenarios/tod.py. The distance (1/4, 1/2, 3/4 mile or the D-07 rule)
  # is a scenario option, not a ledger value; the D-07 stop rule is the parking.transit_* entries.

  tod.developable_share_urban:
    label: "Share of land near a major stop that could be rebuilt as mid-rise, urban tracts"
    unit: "share"
    central: 0.12
    low: 0.04
    high: 0.25
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      Block land near a station also holds parks, schools, churches, recent or large
      buildings, historic districts and small lots that cannot be assembled. Only a
      minority of it is a realistic mid-rise site within a decade.
    used_by: [tod]
    revisit: "Measure soft-site shares from parcel data (assessed improvement-to-land ratio) near PA stations."
    status: draft

  tod.developable_share_suburban:
    label: "Share of land near a major stop that could be rebuilt as mid-rise, suburban tracts"
    unit: "share"
    central: 0.08
    low: 0.02
    high: 0.20
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      Suburban station areas mix parking lots and strip retail (good sites) with
      single-family streets that rarely assemble into mid-rise sites.
    used_by: [tod]
    revisit: "Measure soft-site shares from parcel data near PA stations."
    status: draft

  tod.developable_share_rural:
    label: "Share of land near a major stop that could be rebuilt as mid-rise, rural tracts"
    unit: "share"
    central: 0.03
    low: 0.005
    high: 0.10
    shape: pert
    kind: judgement
    source: []
    rationale: "Few rural tracts are near a major stop, and little of that land suits mid-rise."
    used_by: [tod]
    revisit: "Measure soft-site shares from parcel data near PA stations."
    status: draft

  tod.upzoned_far:
    label: "Floor area ratio allowed near major stops after the reform"
    unit: "floor area / lot area"
    central: 2.5
    low: 2.5
    high: 2.5
    shape: fixed
    kind: judgement
    source:
      - id: ev.tod.california_sb79_2025
        citation: >-
          Evidence library entry ev.tod.california_sb79_2025: California Senate Bill 79
          (2025), state floors of 80-120 homes per acre and 55-75 ft near stops
        url: https://ww2.cityofpasadena.net/2026%20Agendas/May_18_26/AR%2014%20Attachment%20B%20-%20Adopted%20SB%2079%20bill%20text.pdf  # secret-scan: allow (public web address)
        accessed: 2026-11-22
    rationale: >-
      The reform's definition, not an uncertain number. FAR 2.5 with 850 sq ft
      apartments and 82% net floor area is about 105 homes per acre, inside
      California SB 79's 80-120 per acre floors. Change it to study a stronger or
      weaker upzoning; 0 (or anything at or below today's allowed FAR) adds nothing.
    used_by: [tod]
    revisit: "Revisit if a Pennsylvania transit-density bill sets its own floors."
    status: draft

  tod.upzoned_storeys:
    label: "Storeys allowed near major stops after the reform"
    unit: "storeys"
    central: 5
    low: 5
    high: 5
    shape: fixed
    kind: judgement
    source:
      - id: ev.tod.california_sb79_2025
        citation: >-
          Evidence library entry ev.tod.california_sb79_2025: California Senate Bill 79
          (2025), height floors of 55, 65 and 75 ft
        url: https://ww2.cityofpasadena.net/2026%20Agendas/May_18_26/AR%2014%20Attachment%20B%20-%20Adopted%20SB%2079%20bill%20text.pdf  # secret-scan: allow (public web address)
        accessed: 2026-11-22
    rationale: >-
      The reform's definition. Five storeys (about 55-65 ft) is the common wood-over-
      podium mid-rise. The usable floor area ratio is the lower of the FAR limit and
      storeys x lot coverage.
    used_by: [tod]
    revisit: "Revisit with a Pennsylvania bill text."
    status: draft

  tod.lot_coverage:
    label: "Share of a mid-rise site the building covers"
    unit: "share"
    central: 0.70
    low: 0.55
    high: 0.85
    shape: pert
    kind: judgement
    source: []
    rationale: "Mid-rise buildings cover most of the lot; setbacks, courtyards and access take the rest."
    used_by: [tod]
    revisit: "Check against recent mid-rise site plans in Pennsylvania."
    status: draft

  tod.current_far_allowed:
    label: "Floor area ratio allowed today near major stops (before the reform)"
    unit: "floor area / lot area"
    central: 0.8
    low: 0.4
    high: 1.4
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      Most land near Pennsylvania stations is zoned for houses, rowhouses or
      low-rise commercial, roughly FAR 0.4-1.4. Only floor area above this counts
      as added by the reform; the rest was allowed already (and is in the baseline).
    used_by: [tod]
    revisit: "Read base-district FARs near stations from municipal zoning codes."
    status: draft

  tod.net_floor_share:
    label: "Share of a mid-rise building's floor area that is apartments"
    unit: "share"
    central: 0.82
    low: 0.75
    high: 0.88
    shape: pert
    kind: judgement
    source: []
    rationale: "Corridors, stairs, lobbies and services take 12-25% of gross floor area."
    used_by: [tod]
    revisit: "Check against published mid-rise efficiency ratios."
    status: draft

  tod.rent_ratio_2br:
    label: "Two-bedroom rent as a multiple of median gross rent, where the two-bedroom median is blank"
    unit: "ratio"
    central: 1.05
    low: 0.95
    high: 1.15
    shape: pert
    kind: judgement
    source: []
    rationale: "In Pennsylvania tracts the two-bedroom median is close to the all-units median gross rent."
    used_by: [tod]
    revisit: "Compute from ACS B25031 tracts that report both."
    status: draft

  tod.new_unit_rent_premium:
    label: "Rent of a new mid-rise apartment as a multiple of the tract's two-bedroom median"
    unit: "ratio"
    central: 1.25
    low: 1.05
    high: 1.50
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      New buildings with amenities near transit rent above the existing stock,
      most of which is decades old.
    used_by: [tod]
    revisit: "Compare new-lease asking rents with ACS medians near PA stations."
    status: draft

  tod.acquisition_premium:
    label: "Premium over current value a mid-rise builder pays to assemble a site"
    unit: "share"
    central: 0.20
    low: 0.05
    high: 0.40
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      Assembling several lots means paying holdouts above market; upzoning also
      raises asking prices (Chicago station-area land prices rose after upzoning).
    used_by: [tod]
    revisit: "Calibrate on station-area land sales after upzoning."
    status: draft

  tod.min_existing_homes_per_acre:
    label: "Smallest number of existing homes per acre used to price a site"
    unit: "homes/acre"
    central: 4
    low: 2
    high: 8
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      A site is priced as its existing homes x their value. Land near stations
      with few homes (shops, parking lots) still costs something; this floor
      prices it like a few houses per acre.
    used_by: [tod]
    revisit: "Replace with assessed land values near stations."
    status: draft

  tod.redevelopment_hazard_annual:
    label: "Share of feasible mid-rise sites permitted each year"
    unit: "share per year"
    central: 0.02
    low: 0.005
    high: 0.05
    shape: pert
    kind: judgement
    source:
      - id: ev.tod.chicago_freemark
        citation: >-
          Evidence library entry ev.tod.chicago_freemark: Yonah Freemark (2020),
          "Upzoning Chicago", Urban Affairs Review 56(3), abstract
        url: https://doi.org/10.1177/1078087418824672
        accessed: 2026-11-22
    rationale: >-
      Station-area upzonings are taken up slowly: Chicago's found no detectable
      rise in permits within about five years, while land prices rose. A few
      percent of feasible sites a year keeps five-year take-up well below capacity.
    used_by: [tod]
    revisit: "Calibrate on station-area upzonings with permit counts (Minneapolis, Seattle, Chicago full paper)."
    status: draft

  tod.ramp_first_year_share:
    label: "First-year mid-rise permits as a share of the full yearly rate"
    unit: "share"
    central: 0.10
    low: 0.02
    high: 0.30
    shape: pert
    kind: judgement
    source: []
    rationale: "Mid-rise projects take one to three years from site control to a building permit."
    used_by: [tod]
    revisit: "Check against permit timing after station-area upzonings."
    status: draft

  tod.ramp_years_to_full:
    label: "Years for mid-rise permits to reach the full yearly rate"
    unit: "years"
    central: 4
    low: 3
    high: 5
    shape: pert
    kind: judgement
    source: []
    rationale: "Larger projects need assembly, design, financing and approvals; slower than ADUs."
    used_by: [tod]
    revisit: "Check against permit timing after station-area upzonings."
    status: draft

  tod.absorption_cap_share:
    label: "Most extra 5+ unit permits a county can absorb, as a share of its baseline 5+ unit permits"
    unit: "share"
    central: 0.30
    low: 0.10
    high: 0.60
    shape: pert
    kind: judgement
    source:
      - id: ev.tod.chicago_freemark
        citation: >-
          Evidence library entry ev.tod.chicago_freemark: Yonah Freemark (2020),
          "Upzoning Chicago", Urban Affairs Review 56(3), abstract
        url: https://doi.org/10.1177/1078087418824672
        accessed: 2026-11-22
    rationale: >-
      New apartments must be rented: lenders and builders pace projects to regional
      demand, so a zoning change near stations moves only part of a county's
      apartment pipeline in five years. A county with no recent 5+ unit permits
      gets no TOD units.
    used_by: [tod]
    revisit: "Calibrate on station-area upzonings: added 5+ permits against the region's pipeline."
    status: draft

  tod.net_new_share:
    label: "Share of TOD units that are new to the region (not moved from elsewhere in it)"
    unit: "share"
    central: 0.5
    low: 0.2
    high: 0.9
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      Some apartments built near stations would have been built elsewhere in the
      same region anyway; the reform only moves them. Those are not counted. The
      range is deliberately wide, and this is a headline caveat.
    used_by: [tod]
    revisit: "Estimate from regional 5+ unit permits before and after station-area upzonings."
    status: draft
