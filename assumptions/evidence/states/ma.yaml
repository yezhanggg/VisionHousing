- id: ma.adu_by_right_ch150_2024
  kind: policy
  state: MA
  jurisdiction: statewide
  policy_types:
  - adu
  - parking
  title: Massachusetts by-right ADU law (Affordable Homes Act)
  citation: St. 2024, c. 150, §§ 7-8 (amending M.G.L. c. 40A §§ 1A and 3); effective date set by § 143
  url: https://malegislature.gov/Laws/SessionLaws/Acts/2024/Chapter150
  session: 2023-2024 (193rd General Court)
  bill: H.4977
  enacted_date: 2024-08-06
  effective_dates:
  - date: 2025-02-02
    applies_to: § 8 by-right ADU paragraph of c. 40A § 3. § 143 makes it effective 180 days after the
      act, which was an emergency law approved 2024-08-06.
  geographic_scope: All municipalities. One ADU per lot in single-family residential zoning districts
    may not be prohibited, unreasonably restricted, or subjected to a special permit. ADU limited to the
    smaller of half the principal dwelling's floor area or 900 sq ft.
  exclusions:
  - Short-term rentals may be restricted or banned
  - A second or further ADU still needs a special permit
  - 'Reasonable rules allowed: Title 5 septic, site plan review, setbacks, bulk and height'
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - 'CORRECTION: the by-right ADU provision is § 8 (definition in § 7), with the effective date in § 143.
    It is not § 135, which concerns EOHLC guidance under c. 23B § 33(g).'
  - No owner-occupancy requirement. At most 1 added parking space, and none within 0.5 mile of a commuter
    rail, subway, ferry or bus station.
  - EOHLC may issue guidelines or regulations (760 CMR 71 was not checked, because mass.gov is blocked).
  retrieved: 2026-11-24
  verified: true
  verification_note: Session law text on malegislature.gov shows §§ 7-8, the emergency preamble, § 143
    ('Sections 8, 46, 48 and 49 shall take effect 180 days after the effective date of this act') and
    'Approved, August 6, 2024'. 2024-08-06 plus 180 days is 2025-02-02.
  sources:
  - label: St. 2024, c. 150 (Affordable Homes Act)
    url: https://malegislature.gov/Laws/SessionLaws/Acts/2024/Chapter150
    official: true
  discovered_via: addendum
