# Municipal zoning rules read by hand from each municipality's own text.
#
# Read by visionhousing.law.tables, which builds the muni_zoning_rules table:
# one row for every Pennsylvania municipality in the DCED record. A
# municipality listed here gets the values below; every other one stays
# "unknown" (method: unread). Unknown never means "no".
#
# Rules for this file:
# - Only documents the municipality publishes itself (its own website or its
#   own legislative system), or, where the county zones for a municipality
#   (MPC § 602), the county's ordinance on the county's own website.
#   Commercial code hosts (eCode360, Municode, American Legal) forbid bulk or
#   automated use: never read them here.
# - A county ordinance gives one row per municipality it covers, all with the
#   same values (YAML anchors: "<<: *name" repeats the first row with a new
#   geoid). Which municipalities it covers comes from the county's own text
#   or zoning page, not only from the DCED record, because the two can differ.
# - status: verified only when the quote was found in the document's text at
#   the offset given, by a person, on reviewed_on. Anything less is draft.
# - Quotes are at most 300 characters: enough to find the passage again.
# - evidence_offset is the character offset of the quote in the text pypdf
#   extracts from the document (visionhousing.law.text.pdf_text); text_sha256
#   identifies that text.
# - A value read only from a picture of a table (no extractable text) is left
#   unknown, because nobody can re-find it from the offset.
# - Rule-change tracker: a document may give adopted_on, amended_through and
#   effective_date (YYYY, YYYY-MM or YYYY-MM-DD, as the text states them; never
#   guessed). A rule takes its document's dates unless it gives its own, and
#   may give binding_conditions (plain words). The build sets future_effective
#   when effective_date is after the build date; such a rule counts as not read
#   until then (assumptions/law/hooks.yaml).
# - in_force_by (a rule only): where the text prints no adoption date, the
#   latest dated enactment inside the cited codified section, or the posted
#   text's "enacted to" date. The rule as read stood in force by then; it is
#   not an adoption date, so it is never written as adopted_on. A YAML comment
#   beside it gives the quote and offset.
# - occupancy_restriction: relatives_only when only relatives of the main
#   household (or a relative needing care) may live in the ADU. The benchmark
#   lets any household live there, so a by_right rule with it counts as "by
#   right with conditions" (assumptions/law/hooks.yaml).
#
# The 2026-11 calibration of adu_legal_share.yaml cites 221 town readings, but
# only its totals are in this repository; the per-town notes are not, so they
# could not be turned into rows here.

