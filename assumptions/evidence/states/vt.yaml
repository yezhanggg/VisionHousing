  caveats:
  - In residential districts with sewer and water, no more than one parking space per unit may be required.
  - ADUs get the same review as single-family homes (see vt.24vsa4412_adu_duplex for the current statute).
  - Affordable housing may add up to 40% more density and one more floor where served by sewer and water.
  - Later changed by Act 181 (2024) and Act 152 (2026), which have their own records.
