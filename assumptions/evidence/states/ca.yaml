  title: 'California AB 130 (2025 housing budget trailer bill): CEQA exemption for urban infill housing
    and faster approvals'
  citation: Stats. 2025, ch. 22 (AB 130); adds Pub. Resources Code § 21080.66 among many other changes
  url: https://leginfo.legislature.ca.gov/faces/billNavClient.xhtml?bill_id=202520260AB130
  session: 2025-26 regular session
