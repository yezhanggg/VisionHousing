caveats:
- Saint Paul under the audited date has two post years (2024-2025), the declared minimum; its base years
  2021-2023 include Phase 1, and its placebo date (2021) looks at years that include Phase 1.
- Eligible exposure (the share of the city's lots the rule changed) is not measured; the outcome is a
  city-wide rate, so a rule that touched few lots is diluted.
- The audit changes no pool rule, outcome, base, horizon or pass mark; the pool and the data files are
  the original run's.
