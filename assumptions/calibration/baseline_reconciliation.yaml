      home counts and group assignments are needed to reproduce it, so the state series is an outside
      control only.
diagnostics:
  baseline_pa_window_2022_2025:
    label: 'Pennsylvania baseline window sensitivity: 2022-2025 mean instead of the shipped window'
    state: PA
    use: record_only
    kind: judgement
    years:
    - 2022
    - 2025
    annual_mean: 25997
    five_year: 129985
    shipped_state_component: 151882
    difference: -21897
    difference_pct: -0.1442
    formula: 5 x (28,149 + 25,320 + 24,810 + 25,709) / 4 = 5 x 25,997 = 129,985 units; difference from
      the shipped state component 151,882 = -21,897 units (-14.4%)
    sources:
    - bps_state_annual
    assumption_ids:
    - baseline_pa_window_2022_2025
    - baseline.horizon_years
    status: Disclosed historical-window sensitivity. Named after the spike was seen, so not pre-registered.
      Not a replacement baseline; never subtracted from any reform or package result.
    rationale: Pennsylvania's 2021 total is far above 2022-2025, and the shipped rule's five-year window
      includes it. Showing the four-year mean makes the effect of that one model choice visible. Named
      after the spike was seen, so it is a disclosed sensitivity, not a pre-registered test or a replacement
      baseline.
