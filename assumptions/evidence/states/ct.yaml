  title: 'Connecticut Public Act 25-1 (Nov. 2025 Special Session, HB 8002): An Act Concerning Housing
    Growth'
  citation: Conn. Public Act 25-1, November 2025 Special Session (HB 8002)
  url: https://www.cga.ct.gov/2025/act/pa/pdf/2025PA-00001-R00HB-08002SS1-PA.pdf
  session: November 2025 special session
  bill: HB 8002
  enacted_date: 2025-11-26
  effective_dates:
  - date: 2026-01-01
    applies_to: Most provisions, including the transit-oriented district/TOC framework and Housing Growth
      Program grants
  - date: 2026-07-01
    applies_to: Parking-minimum limits (§§ 18-20); required summary-review approval of 2-9 unit middle
      housing and mixed-use on commercial or mixed-use parcels (§ 16); manufactured-home parity
  geographic_scope: 'TOD is voluntary: a municipality becomes a qualifying transit-oriented community
    only with its consent by zoning a district that includes land within 0.5 mile of a rapid transit station,
    or of a bus station with service at least every 60 minutes at peak, 5 days a week. Towns bordering
    a transit town may instead zone near their downtown. The parking and commercial-parcel rules apply
    to all zoning municipalities, including special-act towns.'
  exclusions:
  - OPM may not require flood zones, wetlands, parks, conservation land, coastal resources, water-supply
    areas or 30-year sea-level inundation areas in a district
  - In up to two local conservation/traffic mitigation districts (each at most 4% of land area), parking
    minimums may apply to developments of up to 15 units
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - 'TOC as-of-right uses: 2-9 unit middle housing; 10+ unit projects with at least 30% set-aside; and
    deed-restricted projects on municipal, housing-authority, nonprofit or religious land. Owners of 3+
    years may add an accessory apartment as of right. Incentives include Housing Growth grants, sewer
    loans and higher school-construction reimbursement.'
  - 'Parking: projects under 17 units cannot be rejected solely for lack of parking unless there is a
    specific safety impact. For 17+ units, developers may rebut minimums with a parking needs assessment.'
  - Also replaces the fair-share (CGS 4-68ii) and affordable housing plan (8-30j) frameworks and changes
    protest petitions.
  retrieved: 2026-11-24
  verified: true
  verification_note: PA 25-1 text on cga.ct.gov shows 'Approved November 26, 2025'. The OLR public act
