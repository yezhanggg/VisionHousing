  title: 'Oregon SB 458 (2021): middle housing land divisions (one lot per unit)'
  citation: Enrolled SB 458 (2021), Oregon Laws 2021, ch. 103 (now ORS 92.031)
  url: https://olis.oregonlegislature.gov/liz/2021R1/Measures/Overview/SB458
  session: 2021 regular session
  bill: SB 458
  enacted_date: 2021-05-26
  effective_dates:
  - date: 2022-01-01
    applies_to: Act in force
  - date: 2022-07-01
    applies_to: Middle housing land division section applies to divisions permitted on or after this date
  geographic_scope: Wherever middle housing must be allowed under HB 2001 (now ORS 197A.420). Cities and
    counties must approve dividing a middle-housing lot so each unit sits on its own lot, through the
    expedited land division procedure (decision within 63 days, extension at most to 120 days).
  exclusions:
  - Local government need not allow an ADU on a lot created this way
  - Approval may bar further division of the resulting lots
