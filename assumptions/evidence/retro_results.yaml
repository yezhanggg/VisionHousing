- id: mn.retro.minneapolis_2040_plan.units_2_4
  kind: study
  state: MN
  jurisdiction: Minneapolis
  policy_types:
  - missing_middle
  title: 'Retrospective permit panel: Minneapolis 2040 Comprehensive Plan and zoning implementation (end
    of single-family-only zoning) (units in 2- to 4-unit buildings (the sum of the two above))'
  citation: VisionHousing retrospective panel (Census BPS place files and ACS B25001), design retro_bps_2026_11
  url: https://www.census.gov/construction/bps/index.html
  geographic_scope: Citywide
  implementation_status: not_law
  litigation:
    status: not_applicable
  outcome_measure: Units in 2- to 4-unit buildings (the sum of the two above) authorized by building permits
  denominator: per 1,000 housing units (ACS 2020-2024 5-year, table B25001)
  horizon: 5 calendar years from 2020 (event times 0 to 4)
  observed_result:
    summary: 'Minneapolis: units in 2- to 4-unit buildings (the sum of the two above) per 1,000 homes
      changed by -0.15 a year against the comparison cities over 5 years from 2020 (90% placebo interval
      -0.80 to +0.27; about -32 units a year). Pre-trend p 0.45; placebo-date p 0.34. The interval includes
      zero: no change distinguishable from ordinary cities.'
    value: -0.151
    unit: units per 1,000 housing units per year (difference from comparison)
    source_label: Census Building Permits Survey
    source_url: https://www.census.gov/construction/bps/index.html
  identification: causal
  caveats:
  - pre-trend, placebo-date and pool-size checks passed
  - 'Concurrent reform: mn.minneapolis_parking_2021'
  - City page lists 'eliminating single-family exclusive zoning' (up to 3 units) as an implementation
    action, but the triplex ordinance's adoption/effective date was not readable on an official page (link
    redirects)
  - enacted_date is the council resolution sending the plan to Met Council; final approval came in October
    2019
  - A further 1-3 unit housing rules update had a City Council vote scheduled for 2026-12-03 (not yet
    adopted)
  - 'Synthetic control: pre-period fit ratio 0.00, mean post gap -0.06 (90% placebo interval -0.79 to
    +0.82), placebo rank p 0.13; a near-perfect fit from many donors over few years can be over-fitting'
  - Permits are units authorized, not built; a reform can move permits between years or places (diversion
    to nearby suburbs is not measured).
  - 2020-2021 pandemic and 2022-2023 interest-rate shocks hit all offices; the comparison removes the
    shared part only.
  - One treated city per case; the interval reflects how much ordinary cities move, not sampling of many
    reforms.
  - The housing-unit denominator is 2020-2024, partly after some reforms; the stock moves a few percent
    at most, so the bias is small and toward zero.
  - Comparison cities may have made local changes not recorded here; that would pull estimates toward
    zero.
  - BPS counts townhouses (attached single-family homes) as 1-unit buildings, so middle housing built
    as townhouses shows up in units_1, not units_2_4.
  - The identification label grades the design checks, not the size of the effect; a 'causal' record whose
    interval includes zero means no change could be told apart from ordinary cities.
  retrieved: &id001 2026-11-24
  verified: true
  verification_note: Effective date from verified record mn.minneapolis_2040_plan; permit counts from
    the Census Bureau's own files; computed by visionhousing evidence-retro.
  sources:
  - label: Census Building Permits Survey
    url: https://www.census.gov/construction/bps/index.html
    official: true
  - label: Reform record mn.minneapolis_2040_plan
    url: https://minneapolis2040.com/overview/
    official: true
