# Discovery list for the cross-state panel: candidate reforms NOT yet read in
# official text, and the trackers used to find them with what their terms allow.
#
# Trackers are for finding, never for citing. Where a tracker's terms are unclear
# it is only linked: nothing from it is fetched by script or kept here beyond a
# short label we wrote. Each entry counts as "discovered_unreviewed" in the
# completeness matrix until a verified record replaces it. The note field says
# which record (if any) has since read the candidate in official text.
# Format: src/visionhousing/evidence/schema.py (Tracker, DiscoveryEntry).

version: 1
trackers:
- id: nyu_furman
  name: NYU Furman Center Land Use Reform Tracker
  url: https://www.furmancenter.org/land-use-reform-tracker/
  terms_url: null
  programmatic_use: unclear
  terms_summary: No terms of use, data licence or reuse statement found; the site answered automated requests
    with 403. Linked only; no tracker data fetched or kept.
  checked_on: '2026-11-24'
- id: aei
  name: AEI Housing Center State Housing Supply Legislation Tracker
  url: https://heat.aeihousingcenter.org/toolkit/tracker
  terms_url: https://www.aei.org/about/terms-of-use/
  programmatic_use: unclear
  terms_summary: The linked terms page shows only a privacy policy, with nothing on reuse or automated
    access (a permissive robots file is not a licence). Linked only; no tracker data fetched or kept.
  checked_on: '2026-11-24'
- id: open_states
  name: Open States (Plural Policy)
  url: https://open.pluralpolicy.com/data/
  terms_url: https://open.pluralpolicy.com/tos/
  programmatic_use: allowed
  terms_summary: Open States terms cover the API and bulk data, make no copyright claim over the data
    and require no attribution (no implied endorsement); the data page states a public domain dedication
    unless noted. The API needs a key. Not fetched for this panel.
  checked_on: '2026-11-24'
