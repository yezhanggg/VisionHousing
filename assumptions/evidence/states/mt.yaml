  title: 'Montana SB 528 (2023): at least one ADU by right on every single-family lot in zoned municipalities'
  citation: 2023 Mont. Laws ch. 502 (SB 528); MCA 76-2-345
  url: https://mca.legmt.gov/bills/mca/title_0760/chapter_0020/part_0030/section_0450/0760-0020-0030-0450.html
  session: 68th Legislature (2023)
  bill: SB 528
  enacted_date: 2023-05-17
  effective_dates:
  - date: 2024-01-01
    applies_to: Whole act; non-complying local ADU rules in effect on or after this date are void and the
      statute applies directly until regulations are amended
  geographic_scope: Every incorporated city, town or consolidated city-county that zones under MCA Title
    76 ch. 2 part 3; any lot or parcel with a single-family dwelling
  exclusions:
  - Short-term rentals may still be regulated
  - Building, fire and public health codes still apply; a water and sewer will-serve letter may be required
  - Detached or attached ADUs capped at the lesser of 75% of the house or 1,000 sq ft
  implementation_status: legally_effective
  litigation:
    status: decided
    note: Upheld against equal-protection claims by the Montana Supreme Court on 2026-03-17 (2026 MT 53);
      see mt.maid_v_state_2026.
    citation: 2026 MT 53
    url: https://news.mt.gov/Governors-Office/Governor-Gianforte-Praises-Montana-Supreme-Court-Ruling-Upholding-Pro-Housing-Reforms
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - 'Municipalities may not require extra parking or fees in lieu, matching design, owner occupancy, occupant
    relationships, impact fees, street improvements, or dimensional rules stricter than for the house.
    A one-time application fee of up to $250 is allowed.'
  - Close to benchmark reform 1 (one ADU, detached allowed, no added parking), except the size cap can
    fall below 600 sq ft where the main house is under 800 sq ft.
  retrieved: 2026-11-24
  verified: true
  verification_note: 2023 Montana Session Laws vol. 2 (archive.legmt.gov) shows Chapter No. 502 [SB 528],
    section 3 effective January 1, 2024, 'Approved May 17, 2023'. MCA 76-2-345 (mca.legmt.gov) shows
    the current text and history 'En. Sec. 1, Ch. 502, L. 2023'. The bill status site bills.legmt.gov
    is script-only and was not read.
  sources:
