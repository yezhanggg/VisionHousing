  title: Housing in transit-oriented communities (zoning capacity goal near transit)
  citation: HB24-1313; 2024 Colo. Sess. Laws ch. 168
  url: https://leg.colorado.gov/bills/hb24-1313
  session: 2024 regular session (75th General Assembly)
  bill: HB24-1313
  enacted_date: 2024-05-13
  effective_dates:
  - date: 2024-05-13
    applies_to: Act effective on signature
  - date: 2024-07-01
    applies_to: State treasurer transfers $35 million to the transit-oriented communities infrastructure
      fund
  - date: 2024-09-30
    applies_to: Department of Local Affairs must map transit-related areas
  - date: 2025-06-30
    applies_to: Preliminary assessment report due (housing opportunity goal, areas needing rezoning)
  - date: 2026-12-31
    applies_to: Housing opportunity goal report, affordability and displacement strategies due; water-supply
      goal modification requests due
  - date: 2027-12-31
    applies_to: Deadline for the department to approve goal reports and certify communities
  geographic_scope: Local governments in a metropolitan planning organization with population of at least
    4,000 and at least 75 acres of transit-related areas; certain counties with unincorporated transit
    station areas (within 1/2 mile of commuter or light rail) or enclosed transit corridor areas
  exclusions:
  - Communities below the 4,000 population or 75-acre transit-area thresholds
  - Goal may be modified where insufficient water supply is shown
  implementation_status: legally_effective
  litigation:
    status: challenged
    note: Six home-rule cities (Greenwood Village, Arvada, Aurora, Glendale, Lafayette, Westminster) filed
      a complaint in Denver District Court challenging HB24-1313 and HB24-1304 on home-rule grounds (complaint
      posted by Greenwood Village; filed May 2025). No ruling found on any court page; status not confirmed
      on a court docket. See separate record co.home_rule_suit_2025.
    citation: City of Greenwood Village et al. v. State of Colorado et al., Denver District Court (case
      number not shown on posted complaint)
    url: https://www.greenwoodvillage.com/DocumentCenter/View/28525/Complaint-for-Declaratory-and-Injunctive-Relief-4908-1584-0837-v1
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - Housing opportunity goal is a zoning capacity target (average 40 units/acre times transit-area acres),
    not a production mandate
  - Transit centers must allow at least 15 units/acre net density with administrative approval for multifamily
    on parcels of 5 acres or less
  - Only certified communities can draw on the infrastructure fund
  retrieved: 2026-11-24
  verified: true
  verification_note: leg.colorado.gov bill page shows Became Law, signed 2024-05-13, effective 2024-05-13,
    Session Law ch. 168, and the summary deadlines listed.
  sources:
  - label: Colorado General Assembly bill page HB24-1313
    url: https://leg.colorado.gov/bills/hb24-1313
    official: true
  discovered_via: search
