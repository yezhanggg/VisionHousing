# Calibration table: share of Massachusetts lots where the benchmark ADU reform
# is already legal under state law.
#
# Since February 2, 2025, M.G.L. c. 40A § 3 (as amended by St. 2024, c. 150,
# § 8) bars zoning from prohibiting, unreasonably restricting, or requiring a
# special permit for one accessory dwelling unit in a single-family residential
# zoning district. An ADU is a self-contained home no larger than half the
# principal dwelling or 900 sq ft, whichever is smaller (§ 1A). Towns may still
# apply reasonable rules (Title 5 septic, site plan review, setbacks, bulk and
# height), may require at most one added parking space (none within 0.5 miles
# of a station), and may not require owner occupancy. Boston is not subject to
# chapter 40A.
#
# So most of what the ADU benchmark allows is already allowed. The benchmark
# (a detached or semi-detached ADU of at least 600 sq ft, no added parking)
# still adds homes where:
#   - the half-of-the-house cap is below 600 sq ft (principal homes under
#     1,200 sq ft);
#   - a town requires the one parking space (outside 0.5 miles of transit);
#   - a single-family home stands outside a single-family zoning district
#     (the statute covers single-family districts only);
#   - the lot is in Boston;
#   - practice lags the statute (bylaws not yet aligned with 760 CMR 71).
#
# None of these has been measured lot by lot, so the range below is documented
# judgement, not a measurement, and it stops well short of 100%. HLC's ADU
# survey (pack table ma_adu_survey) shows the law in use: building officials
# reported ADU building permits in 246 municipalities from January 2025 to
# June 2026 (2,084 approvals statewide).
#
# The engine turns this into an override of adu.already_legal_share for
# Massachusetts runs only (visionhousing.scenarios.adu.legal_share_override).
# Read by visionhousing.scenarios.adu.load_legal_shares; see
# docs/TECHNICAL_APPENDIX.md section G.3 (Massachusetts). The missing-middle share is NOT
# replaced: Massachusetts has no statewide two-to-six-unit law. Section 3A
# districts allow multi-family homes as of right, but only in one district per
# MBTA community (about 17,400 acres in the 3A atlas on 2026-11-24).

