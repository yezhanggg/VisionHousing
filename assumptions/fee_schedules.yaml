# How each city's schedule applies to the county-level fee reform.
cities:
  philadelphia:
    name: "City of Philadelphia"
    county: "42101"
    whole_county: true
    review:
      zoning: documented
      building: documented
      trade: documented
      impact: documented
      water_connection: documented
      sewer_connection: documented
      stormwater: documented
      administrative: documented
      right_of_way: unknown_not_reviewed
      planning: unknown_not_reviewed
    review_notes: >-
      Not reviewed: Streets Department street-opening and lane-closure permits
      for the water and sewer laterals (the plumber must get them), and any
      planning review beyond a by-right zoning permit. Both stay unknown, so
      the documented total is a floor for them. Utility company (electric,
      gas) service charges are not government fees and are not counted.
  pittsburgh:
    name: "City of Pittsburgh"
    county: "42003"
    whole_county: false
    review:
      zoning: unknown_refused
      building: unknown_refused
      trade: unknown_refused
      impact: unknown_not_reviewed
      water_connection: documented
      sewer_connection: unknown_not_reviewed
      stormwater: unknown_refused
      administrative: unknown_refused
      right_of_way: unknown_not_reviewed
      planning: unknown_refused
    review_notes: >-
      The 2026 fee book (PLI building and trade permits, City Planning zoning
      fees) exists (Resolution file 2025-2463, effective January 1, 2026) but
      is only published where scripted reading is refused. PWSA's web page
      gives the single-family residential permit fee and the typical tap and
      meter cost; larger services are in a PDF that robots.txt disallows.
      ALCOSAN's sewage tap-in fee is not among the sources allowed for this
      review. The City is part of Allegheny County, so even a complete
      schedule would need a within-county split before it could replace the
      county's judgement fee.

