- id: wy.hb0002_2026_fast_track_permits
  kind: policy
  state: WY
  jurisdiction: statewide
  policy_types:
  - permit_timing
  title: 'Wyoming Fast Track Permits Act (2026 HB0002): residential permit shot clock'
  citation: W.S. 16-13-101 and 16-13-102 (2026 Session Laws ch. 42, Enrolled Act No. 16)
  url: https://wyoleg.gov/2026/Enroll/HB0002.pdf
  session: '2026'
  bill: HB0002
  enacted_date: 2026-03-05
  effective_dates:
  - date: 2026-07-01
    applies_to: Residential building permit applications filed on or after this date
  geographic_scope: Every city, town and county that zones and has adopted an International Residential
    Code. Applies to permits for a building of one or two homes, at most three storeys and 3,000 sq
    ft of finished floor per home.
  exclusions:
  - Does not change what zoning allows, parking minimums or impact fees
  - Inspections are still required after a permit is deemed approved
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - Not one of the five benchmark reforms; context for ADU and duplex permits, which are a dwelling
    of one or two units under the act.
  - A local government must say within 10 business days whether an application is complete and decide
    a complete one within 30 calendar days, or the permit is deemed approved. The 10% fee cut applies
    only to conditions added after approval.
  - How often local governments meet the clock has not been measured.
  retrieved: 2026-11-26
  verified: true
  verification_note: Enrolled act text read on wyoleg.gov (effective-date section and § 16-13-102(c),
