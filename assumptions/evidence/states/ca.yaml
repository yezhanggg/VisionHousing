- id: ca.apr_permit_pipeline_data
  kind: policy
  state: CA
  jurisdiction: statewide
  policy_types:
  - permit_timing
  title: 'Housing Element Annual Progress Report (APR) data: application, entitlement, permit and completion
    dates by project'
  citation: Gov. Code § 65400 (annual progress report); HCD dataset 'Housing Element Annual Progress Report
    (APR) Data by Jurisdiction and Year' on data.ca.gov
  url: https://data.ca.gov/dataset/housing-element-annual-progress-report-apr-data-by-jurisdiction-and-year
  session: null
  bill: null
  enacted_date: null
  effective_dates: []
  geographic_scope: Every California city and county, including charter cities, reports each year; a county
    report covers only its unincorporated area. Project-level rows include APN and street address.
  exclusions:
  - Counties report only unincorporated areas
  - Data are self-reported by jurisdictions and not independently verified by HCD
  implementation_status: practically_usable
  litigation:
    status: not_applicable
    note: ''
    citation: null
    url: null
  outcome_measure: 'Table A: date application submitted (deemed-complete date if incomplete at submittal)
    and units proposed by affordability; Table A2: date entitlement approved, date building permits issued,
    date certificate of occupancy (or final inspection) issued, with unit counts by income level and unit
    category (SFD, SFA, 2-4, 5+, ADU, MH)'
  denominator: units or projects per jurisdiction per reporting year
  horizon: annual; dataset refreshed weekly (last updated 2026-11-20 at retrieval)
  observed_result: null
  identification: descriptive
  caveats:
  - Applications (Table A) and building activity (Table A2) are separate tables; linking one project from
    application to completion means matching on APN or the local tracking ID, which is not always consistent.
  - Table A2 has a field for the streamlining path used; from the 2023 APR onward its valid values include
    'SB 9 (2021) - Duplex in SF Zone' and 'SB 9 (2021) - Residential Lot Split', so SB 9 units and ministerial
    multifamily (SB 35 / other) can be separated from ADUs (unit category ADU).
  - Year coverage was not stated on the dataset page; check the YEAR field in the CSVs.
  retrieved: 2026-11-24
  verified: true
  verification_note: data.ca.gov dataset page and CKAN metadata (publisher HCD) cite Gov. Code § 65400
    as the basis; dataset created 2022-07-28, last updated 2026-11-20. Field names and definitions (APP_SUBMIT_DT;
    entitlement, building permit and certificate of occupancy dates; SB 9 streamlining values) read from
    the HCD data dictionaries for Tables A and A2 posted on the same page (updated 2026-10-01). The statute
    page on leginfo.legislature.ca.gov returned HTTP 403, so § 65400 text was not read directly.
  sources:
  - label: 'data.ca.gov: Housing Element APR Data by Jurisdiction and Year (HCD)'
