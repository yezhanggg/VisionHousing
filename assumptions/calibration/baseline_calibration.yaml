    url: https://www2.census.gov/econ/bps/County/
    licence: Public domain (U.S. government work)
  limits:
  - The first scored origins can draw only on errors made in the boom before the national bust, and are
    asked to cover the bust and the recovery; no ranking of past errors can see a new housing cycle coming.
  - Rolling origins overlap (each shares four of its five target years with the next), so the scored cases
    hold far fewer independent periods.
  - The state-total check scores few origins per state and is descriptive.
