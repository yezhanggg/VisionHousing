  title: 'North Carolina Session Law 2023-108 (HB 488): Residential Code to cover triplexes and fourplexes;
    building code council reorganization'
  citation: N.C. Session Law 2023-108 (HB 488), Section 9 (three- and four-family dwellings)
  url: https://www.ncleg.gov/BillLookUp/2023/H488
  session: 2023-2024 session
  bill: HB 488
  enacted_date: 2023-08-16
  effective_dates:
  - date: 2023-08-16
    applies_to: Section 9 (Council must adopt rules bringing triplex and quadplex dwellings under the Residential
      Code) and the act generally, except as otherwise provided
  - date: 2023-10-01
    applies_to: Section 2 (inspections changes), per Section 2.(j)
  - date: 2025-01-01
    applies_to: Residential Code Council takes over as the rule-making body for Section 9 (Section 9.(a)
      definition of 'Council')
  geographic_scope: Statewide building code. Section 9 tells the code council to bring three- and four-family
    dwellings within the North Carolina Residential Code.
  exclusions:
  - The rules may not require more than a 2-hour fire-resistance rating for separations between units, nor
    automatic sprinklers, for triplexes and quadplexes under the Residential Code
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - The law orders rule-making; it does not itself change zoning. Whether the Residential Code Council
    has adopted the triplex and quadplex rules, and their effective date, was not checked.
  - Became law over the Governor's veto (Senate override 2023-08-16).
  - The act also reorganizes the Building Code Council, creates the Residential Code Council and changes
    plan review and inspection rules.
  retrieved: 2026-11-24
  verified: true
  verification_note: ncleg.gov bill page shows ratified 2023-06-27, vetoed, veto overridden 2023-08-16,
