# Retrospective reform panel results (generated; do not edit).
# Written by `visionhousing evidence-retro run` from the predeclared design in
# assumptions/evidence/retro_design.yaml. Evidence only: nothing here enters a
# model run. Rates are units authorized per 1,000 housing units per year.
# Method: docs/modules/evidence_retro.md.

version: 1
id: retro_bps_results
label: 'Retrospective reform panel: permits by structure type after local reforms'
use: evidence only; informs stage parameter ranges; never a multiplier
how_to_use:
- These are evidence records, not model inputs. No number here is multiplied into a run.
- 'Use a case only to check or bound a stage parameter: for example whether a 2-4 unit take-up range implies
  more or fewer 2-4 unit permits per 1,000 homes than reformed cities actually saw in their first years.'
- Read the interval, not the point. Each case has one reformed city, so the interval shows how much ordinary
  cities move by chance.
- 'A ''matched'' or ''descriptive'' label means a check failed: the number is a before/after contrast
  with comparison cities, not an effect of the reform.'
- 'Never apply a city''s change as a blanket multiplier on Pennsylvania: the reforms differ, the markets
  differ, and most effects mix the reform with other changes named in the caveats.'
