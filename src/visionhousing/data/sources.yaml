    terms_url: https://github.com/USEPA/Sewersheds
    parser: infrastructure.fetch_layer
    limits: >-
      Context only. Most boundaries are modelled with machine learning from hexagons of about
      0.11 square km (Pennsylvania: 799 of 838 modelled; Vermont: 92 of 93 taken from a 2009
      state map); EPA says they are not an authoritative source for property-level
      connections. Never used for a tract's sewer status.
    tier: 0
    access: feature_service
    cleaning: >-
      The state's sewersheds (STATE_CODE) thinned to about 5 m; endpoint plants with their
      authority and NPDES permit, giving the plant's EPA ECHO page as an official listing.
    checked_on: 2026-11-24

  - id: epa_cwns_2022
