  title: 'Massachusetts ADU tracker: applications and approvals since the by-right ADU law'
  citation: EOHLC Accessory Dwelling Unit Tracker (mass.gov)
  url: https://www.mass.gov/info-details/accessory-dwelling-unit-tracker
  session: null
  bill: null
  enacted_date: null
  effective_dates: []
  geographic_scope: 'Municipalities answering the state''s building-official surveys: 293 answered one
    or both 2025 surveys; 265 answered the July 2026 survey (January-June 2026)'
  exclusions: []
  implementation_status: unknown
  litigation:
    status: not_applicable
    note: ''
    citation: null
    url: null
  outcome_measure: ADU building-permit applications and ADU approvals (building permits issued) reported
    by local building officials
  denominator: Responding municipalities (293 for 2025, 265 for H1 2026; not all 351)
  horizon: January 2025 through June 2026 (law effective 2025-02-02)
  observed_result:
    summary: 2,824 ADU applications submitted and 2,084 ADUs approved (building permits issued) from January
      2025 to June 2026; about 50% of approvals were detached and 50% attached or interior; 246 municipalities
      reported at least one approval. Approvals are permits, not completions; a few have certificates
      of occupancy.
    value: 2084
    unit: ADUs approved (building permits issued)
    source_label: EOHLC ADU tracker, 2026 mid-year survey
    source_url: https://www.mass.gov/info-details/accessory-dwelling-unit-tracker
  identification: descriptive
  caveats:
  - 'Survey cohorts differ: 2025 figures combine a July 2025 mid-year and a January 2026 full-year survey
    (293 respondents); 2026 figures come from 265 respondents, so totals are not a fixed panel.'
  - Applications and approvals in the same period are different cohorts; 2,084 / 2,824 is not an approval
    rate.
  - Approvals are building permits issued, not homes completed; attached/detached split is statewide only.
  - Municipal detail is in the downloadable composite CSV (registered as ma_adu_survey).
  retrieved: 2026-11-24
  verified: true
  verification_note: 'Tracker page on mass.gov read by plain HTTPS on 2026-11-24: 2,824 applications,
    2,084 approved, 50% detached, 246 municipalities, survey respondents 293 (2025) and 265 (July 2026).'
  sources:
