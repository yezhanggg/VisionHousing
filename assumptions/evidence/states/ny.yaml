  title: 'New York Laws of 2026, ch. 58, Part R (A 10008-C / S 9008-C budget bill): SEQRA exemption for
    infill housing on previously disturbed sites'
  citation: N.Y. Laws 2026, ch. 58, Part R; Environmental Conservation Law 8-0105, 8-0109, 8-0111(5-a),
    (7), (8)
  url: https://nyassembly.gov/leg/?term=2025&bn=A10008
  session: 2025-2026 session (2026-27 budget)
  bill: A 10008-C / S 9008-C
  enacted_date: 2026-05-26
  effective_dates:
  - date: 2026-05-26
    applies_to: Part R takes effect immediately and applies to pending proceedings, except actions where
      an environmental impact statement was already required before that date
  geographic_scope: 'Statewide. Exempt from SEQRA review: housing on previously disturbed sites connected
    to public water and sewer, up to 250 homes (500 where zoning allows over 45 ft) in places of 1 million+
    people, and up to 100 homes (20 without zoning, 300 in urban areas) elsewhere.'
  exclusions:
  - Sites in FEMA 100-year floodplains (outside places that require elevation above base flood), coastal
    erosion hazard areas, recent farmland, or (in New York City) areas zoned only for industry
  - A single house on a large lot (half an acre in NYC, one acre elsewhere) does not qualify
  - Historic preservation, wetlands, stormwater and local zoning and site plan authority are unchanged
