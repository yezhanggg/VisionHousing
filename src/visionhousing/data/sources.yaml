    geography: [municipality]
    licence: Public legislative record of the City of Pittsburgh
    terms_url: https://pittsburgh.legistar.com/
    parser: law.text.text_sha256
    limits: >-
      One ordinance. The web record above is the human-readable page; the text itself was
      read by script from the city's Legistar web API
      (https://webapi.legistar.com/v1/pittsburgh/matters/31504/texts/35471, version 7, the
      pinned one; 31504 is the API's matter id, not the web site's). Struck and inserted
