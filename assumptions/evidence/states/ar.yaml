  title: 'Arkansas Act 313 of 2025 (HB 1503): at least one ADU by right on single-family lots in cities'
  citation: Ark. Acts 2025, No. 313 (HB 1503); Ark. Code Ann. 14-56-205
  url: https://arkleg.state.ar.us/Bills/Detail?id=HB1503&ddBienniumSession=2025%2F2025R
  session: 95th General Assembly, 2025 Regular Session
  bill: HB 1503
  enacted_date: 2025-03-18
  effective_dates:
  - date: 2025-08-05
    applies_to: Whole act (general effective date for acts without an emergency clause)
  - date: 2026-01-01
    applies_to: Conflicting local ADU rules in effect on or after this date are invalid to the extent of the
      conflict
  geographic_scope: All municipalities (cities and towns), on any lot or parcel with a single-family home.
    Counties are not covered.
  exclusions:
  - Short-term rental rules may still apply
  - Cities may require water and sewer will-serve letters, or Department of Health approval where city service
    is not available
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - 'One attached, detached or internal ADU by right; attached or detached units capped at the lesser of
    75% of the house or 1,000 sq ft. No added parking, owner occupancy, family tie, matching design, separate
    utilities or street improvements may be required.'
  - Impact fees on an ADU capped at $250 and the application fee at $250 per ADU (usual building fees still
    apply). Height, setback, lot size and coverage rules may not be stricter than for the house.
  retrieved: 2026-11-24
  verified: true
  verification_note: arkleg.state.ar.us bill page shows HB 1503 became Act 313 (act date 3/18/2025); the
