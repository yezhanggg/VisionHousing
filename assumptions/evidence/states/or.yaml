- id: or.sb974_2025
  kind: policy
  state: OR
  jurisdiction: statewide
  policy_types:
  - permit_timing
  title: 120-day clock for final engineering plans; limited review for some housing land-use applications;
    design standards limits
  citation: SB 974 (2025), Oregon Laws 2025, ch. 330; amends ORS 197.830, 197.835; adds sections to ORS
    ch. 197A
  url: https://www.oregonlegislature.gov/bills_laws/lawsstatutes/2025orlaw0330.pdf
  session: 2025 regular session
  bill: SB 974
  enacted_date: 2025-06-16
  effective_dates:
  - date: 2025-09-26
    applies_to: Act effective (91st day after sine die)
  - date: 2026-07-01
    applies_to: 'Sections 1 and 3 operative: 120-day engineering review clock and limited land-use review
      process; LUBA amendments (ORS 197.830, 197.835)'
  - date: 2033-01-02
    applies_to: Section 8 (ban on residential design standards) repealed
  geographic_scope: Local governments and special districts reviewing residential development inside urban
    growth boundaries
  exclusions:
  - Limited review (sec. 3) covers only zone changes to denser residential use, PUDs, and variances from
    residential standards on residentially zoned/planned land inside a UGB; not final plats, building
    permits, engineering plans, ministerial approvals, or applications reducing minimum density
  - Design standards ban (sec. 8) does not apply to multifamily structures or applications of 20+ units,
    nor to setbacks, height, safety, water quality, hazards, or Goal-based resource rules
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - 'Stages touched: (1) post-tentative-plat engineering review and site development permits: completeness
    in 30 days, decision in 120 days, tolling while corrections are pending, applicant extensions up to
    245 days total, mandamus in circuit court if late; (2) land-use decision for listed housing applications:
    notice to owners within 100 ft, 14-day written comment, no hearing required; (3) LUBA appeal procedures;
    (4) design review limits.'
  retrieved: 2026-11-24
  verified: true
  verification_note: Oregon Laws 2025 ch. 330 PDF on oregonlegislature.gov shows Approved by the Governor
    June 16, 2025, filed June 17, 2025, effective September 26, 2025. Enrolled SB 974 on OLIS shows sec.
    6 operative July 1, 2026 and sec. 9 repeal Jan. 2, 2033. OLIS overview confirms chapter 330 and relating
    clause.
  sources:
  - label: Oregon Laws 2025, chapter 330
    url: https://www.oregonlegislature.gov/bills_laws/lawsstatutes/2025orlaw0330.pdf
    official: true
  - label: OLIS SB 974 (2025R1) overview
    url: https://olis.oregonlegislature.gov/liz/2025R1/Measures/Overview/SB974
    official: true
  - label: SB 974 enrolled text (OLIS)
    url: https://olis.oregonlegislature.gov/liz/2025R1/Downloads/MeasureDocument/SB974/Enrolled
    official: true
  discovered_via: addendum
