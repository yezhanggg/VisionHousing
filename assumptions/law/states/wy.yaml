provisions:
  - provision_id: wy_adu_silent
    citation: "W.S. 15-1-601 and 18-5-201 (no accessory dwelling unit section)"
    section: "15-1-601"
    reform: adu
    status: enacted
    checked_on: 2026-11-24
    source_id: wy_statutes
    url: https://wyoleg.gov/statutes/compress/title15.pdf
    summary_own_words: >-
      Wyoming's zoning statutes do not mention accessory dwelling units. Whether
      one may be added to a single-family lot is left to each city, town and
      county zoning code.
    benchmark_gap: >-
      The whole benchmark is new at state level: no lot is opened to an ADU by
      state law. The share already legal comes from local codes, which are not
      read for Wyoming, so the national default range is used.
  - provision_id: wy_15_1_601_enabling
    citation: "W.S. 15-1-601 (city and town zoning powers)"
    section: "15-1-601"
    reform: missing_middle
    status: enacted
    checked_on: 2026-11-24
    source_id: wy_statutes
    url: https://wyoleg.gov/statutes/compress/title15.pdf
    summary_own_words: >-
      A city or town may regulate building height, size, lot coverage, yards,
      population density and land use, by districts, uniform within each
      district, in line with a comprehensive plan. The statute permits local
      rules; it does not require any district to allow more than one home.
    benchmark_gap: >-
      No state rule allows two to six homes on single-family lots; the
      benchmark would be new everywhere it applies.
  - provision_id: wy_15_1_603_protest
    citation: "W.S. 15-1-603 (zoning protest petition)"
    section: "15-1-603"
    reform: missing_middle
    status: enacted
    checked_on: 2026-11-24
    source_id: wy_statutes
    url: https://wyoleg.gov/statutes/compress/title15.pdf
    summary_own_words: >-
      If owners of 20% or more of the land in a proposed zoning change, or
      within 140 feet of it, protest, the change needs three-quarters of the
      whole city or town council. Bills to repeal or amend this failed in 2026.
    benchmark_gap: >-
      A higher bar for town-by-town upzoning; it does not apply to a state
      reform. Shown as context for how slowly local rules change without one.
  - provision_id: wy_18_5_201_county
    citation: "W.S. 18-5-201 with 18-5-303(a)(i) (county zoning; family land divisions)"
    section: "18-5-201"
    reform: missing_middle
    status: enacted
    checked_on: 2026-11-24
    source_id: wy_statutes
    url: https://wyoleg.gov/statutes/compress/title18.pdf
    summary_own_words: >-
      A county may zone its unincorporated land, but may not use a minimum lot
      size or other rule to stop a home or farm use on a land division that is
      exempt from subdivision review because it is a single gift or sale to an
      immediate family member.
    benchmark_gap: >-
      Narrow: it protects one home on a family land division, not more homes
      on an existing lot.
  - provision_id: wy_parking_fees_silent
    citation: "Wyoming statutes (no residential parking-minimum or development impact fee section)"
    section: "15-1-601"
    reform: fees
    status: enacted
    checked_on: 2026-11-24
    source_id: wy_statutes
    url: https://wyoleg.gov/statutes/compress/title15.pdf
    summary_own_words: >-
      No Wyoming statute sets, caps or forbids residential parking minimums,
      and none sets a framework for development impact fees; both are local
      choices where they exist.
    benchmark_gap: >-
      The parking and fee benchmarks would be new at state level.

# No dated records: no state provision that bears on the benchmark reforms has
# been enacted, so the law timeline has nothing to switch on for Wyoming.
records: []

# Enacted law that bears on permitting but on none of the five benchmark
# reforms. Context only: not a provision of the reforms, never a timeline
# record, never in an estimate. Each quote was found again by script in the
# saved copy (enrolled act PDF, SHA-256 below) on the page given.
non_benchmark_enacted:
  - provision_id: wy_hb0002_2026_fast_track_permits
    citation: "W.S. 16-13-101 and 16-13-102 (2026 HB0002, Enrolled Act No. 16, Session Laws 2026 ch. 42)"
    topic: permitting_timeline
    status: enacted
    signed_on: 2026-03-05
    effective_date: 2026-07-01
    checked_on: 2026-11-26
    source_id: wy_statutes
    url: https://wyoleg.gov/2026/Enroll/HB0002.pdf
    source_fingerprint: "sha256:700066bf9ff9cd3e97c95fc6009dff84140f971f5d18494a47b4206cc368b18f (enrolled act PDF)"
    applies_to: >-
      Residential building permit applications filed on or after July 1, 2026
      for a building of one or two homes, at most three storeys and 3,000 sq ft
      of finished floor per home, where an International Residential Code is
      adopted.
    summary_own_words: >-
      A city, town or county must say within 10 business days whether a
      residential building permit application is complete and approve or deny
      a complete one within 30 calendar days; a missed deadline means the
      permit is deemed approved (inspections still apply). It does not change
      what zoning allows, parking minimums or impact fees.
    benchmark_bearing: >-
      None of the five benchmark reforms. A house with an ADU, or a duplex, is a
      "dwelling" of one or two units under the act, so permits for them get
      the shot clock; the act's 10% fee cut applies only to conditions added
      after approval, so it is not a development-fee reform.
    evidence:
      - {locator: "Enrolled act p. 3, § 16-13-102(c)", quote: "A local government entity shall approve or deny an applicant's completed application not later than thirty (30) calendar days after the date the completed application is submitted."}
      - {locator: "Enrolled act p. 5, § 16-13-102(g)", quote: "the applicant's completed application shall be deemed approved as submitted on the day after the deadline has lapsed."}
      - {locator: "Enrolled act p. 2, § 16-13-102(a)(iii)", quote: "\"Dwelling\" means a building that contains one (1) or two (2) dwelling units"}
      - {locator: "Enrolled act p. 6, Section 3", quote: "This act is effective July 1, 2026."}
      - {locator: "Bill record HB0002 (lsoservice.wyoleg.gov BillInformation, 2026)", fields: {chapterNo: "0042", signedDate: "2026-03-05T00:00:00", effectiveDate: "2026-07-01T00:00:00", lastAction: "Assigned Chapter Number 42"}}

