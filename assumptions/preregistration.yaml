# Pre-registration record: the expected fingerprint of every block of rules that a
# study fixed in advance. Read by visionhousing.validation.preregistration.
#
# Before a study scores anything it recomputes the fingerprint of the block it is
# about to use and compares it with the one here. On a mismatch it refuses to run:
#   visionhousing validate-donor-pool       (donor_pool_rules, pooled_states_test)
#   visionhousing validate-growth-coverage  (donor_pool_rules, growth_coverage_test)
#   visionhousing validate-state-holdouts   (donor_pool_rules, state_holdout_check)
#   visionhousing validate-baseline-calibration (oot_calibration)
#   visionhousing validate-baseline-reliability (baseline_reliability)
#   visionhousing validate-national-state-calibration (national_state_calibration)
#   visionhousing evidence-retro run        (retro_design)
#   visionhousing evidence-retro check      (retro_design, and the results' design_sha256)
#   visionhousing evidence-retro audit      (retro_design, retro_treatment_audit)
#   visionhousing evidence-retro current-pool (retro_design, retro_treatment_audit, retro_current_pool)
#   visionhousing validate-cards            (validation_card_scores)
#   visionhousing validate-nested-selection (nested_selection)
#
# Fingerprint: SHA-256 of json.dumps(block, sort_keys=True, separators=(",", ":"),
# default=str), where block is the YAML as read by yaml.safe_load. Comments and layout
# do not count; any changed value does.
#
# Be clear about what this file can and cannot show. It was first written on
# 2026-11-24, AFTER each study had already been run once. It protects the rules from
# being changed quietly from now on. It cannot prove what the rules were before that
# day. Two blocks (pooled_states_test, growth_coverage_test) also had their
# fingerprints written in the decision log before their first scores; those logged
# values are the same as the ones below. The other two had no fingerprint logged
# before their first run.
#
# To change a block on purpose: edit it, record its new fingerprint here with the
# date and the reason, and move the old one to `history`. Method:
# docs/modules/validation_donor_pool.md ("Pre-registration check").

version: 1
method: SHA-256 of json.dumps(block, sort_keys=True, separators=(',', ':'), default=str)
first_recorded_on: 2026-11-24
recorded_after_first_run: true

