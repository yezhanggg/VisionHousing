  title: 'Texas SB 2477 (2025): office-to-residential conversions without rezoning, new parking or most
    impact fees'
  citation: Acts 2025, 89th Leg., R.S. (SB 2477); Tex. Local Gov't Code ch. 218, 395.011
  url: https://capitol.texas.gov/BillLookup/History.aspx?LegSess=89R&Bill=SB2477
  session: 89th Legislature, Regular Session (2025)
  bill: SB 2477
  enacted_date: 2025-06-20
  effective_dates:
  - date: 2025-09-01
    applies_to: Whole act; applies to conversions whose building permit is submitted on or after this date
  geographic_scope: Cities over 150,000 people that lie wholly or partly in a county over 300,000. Office
    buildings at least five years old converted to at least 65% residential (building and each floor).
  exclusions:
  - Sites zoned for heavy industry or within 1,000 ft of heavy industry
  - Within 3,000 ft of an airport or military base, or in a military clear or accident-potential zone up
    to 15,000 ft
  - Historic landmark and local historic district rules still apply
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - 'Cities may not require rezoning or variances, traffic studies or fees, parking beyond what is on site,
    density below the greater of the city''s highest residential density or 36 units/acre, or design rules
    stricter than the building code. Approval must be administrative.'
  - Impact fees barred unless the land was already subject to them; housing organizations may sue to enforce.
  - Applies to office buildings only; retail and other commercial uses are covered by SB 840 (tx.sb840_2025).
