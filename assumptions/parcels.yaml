# Parcel attributes: how county assessment records are grouped and summarised.
#
# Read by visionhousing.features.parcels (and the Philadelphia and Allegheny
# source readers). Every choice that changes a parcel number shown in a place
# profile lives here, not in code.
#
# Only two Pennsylvania counties publish parcel attributes free and openly:
# Philadelphia (Office of Property Assessment) and Allegheny (Office of Property
# Assessments, through the Western Pennsylvania Regional Data Center). Every
# other county shows "no free parcel attributes for this county".

version: 1

# Shared land-use classes, in display order. Each county's own codes are
# mapped onto these below.
land_use_classes:
  single_family: "Single-family homes (detached, twin, row, townhouse, mobile home)"
  small_multi: "Small multifamily (2 to 4 homes)"
  apartments: "Apartment buildings (5 or more homes)"
  condo: "Condominium units"
  mixed_use: "Shops or offices with homes above"
  commercial: "Commercial"
  industrial: "Industrial"
  vacant: "Vacant land"
  government: "Government and public"
  agricultural: "Farm and agricultural"
  other: "Other (garages, utilities, special purpose)"

# Philadelphia OPA: category_code -> class. Condominium units are filed under
# category 1 (single family); a building description containing the word below
# moves them to "condo".
philadelphia:
  condo_word: "CONDO"
  categories:
    "1": single_family
    "2": small_multi
    "3": mixed_use
    "4": commercial
    "5": industrial
    "6": vacant
    "7": commercial
    "8": other
    "9": commercial
    "10": commercial
    "11": other
    "12": vacant
    "13": vacant
    "14": apartments
    "15": commercial
  default: other

# Allegheny assessments: USEDESC (exact text) -> class first; anything not
# listed falls back on CLASSDESC.
allegheny:
  use_codes:
    "SINGLE FAMILY": single_family
    "TOWNHOUSE": single_family
    "ROWHOUSE": single_family
    "MOBILE HOME": single_family
    "MOBILE HOME (IN PARK)": single_family
    "TWO FAMILY": small_multi
    "THREE FAMILY": small_multi
    "FOUR FAMILY": small_multi
    "CONDOMINIUM": condo
    "RETL/APT'S OVER": mixed_use
    "OFFICE/APARTMENTS OVER": mixed_use
    "VACANT LAND": vacant
    "BUILDERS LOT": vacant
    "VACANT COMMERCIAL LAND": vacant
    "VACANT INDUSTRIAL LAND": vacant
    ">10 ACRES VACANT": vacant
  # Any USEDESC starting with this text is an apartment building.
  apartment_prefix: "APART"
  classes:
    RESIDENTIAL: other
    COMMERCIAL: commercial
    INDUSTRIAL: industrial
    GOVERNMENT: government
    AGRICULTURAL: agricultural
    UTILITIES: other
    OTHER: other
  default: other
  # Sale codes the Office of Property Assessments marks as valid market sales.
  valid_sale_codes: ["0"]

# Year-built groups (first year of each group; the last is open-ended).
# Parcels with no year, or a year of zero, are "unknown".
year_built_groups:
  pre_1940: [0, 1939]
  y1940_1979: [1940, 1979]
  y1980_1999: [1980, 1999]
  y2000_plus: [2000, 9999]

# Sales windows, counted back from the date the records were read.
sales_windows_months: [12, 36]

# A recorded price below this is not an arm's-length market sale (gifts,
# nominal transfers). Applied to Philadelphia, whose OPA file has no sale code.
min_sale_price: 10000

# Medians are not shown for a tract with fewer parcels than this in the group
# the median is taken over (they would describe one or two homes).
min_parcels_for_median: 10
