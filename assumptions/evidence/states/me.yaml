  title: 'Maine LD 1829 (2025): 3-4 homes per lot, 5,000 sq ft lot cap with sewer, ADU and wastewater
    streamlining'
  citation: P.L. 2025, ch. 385 (LD 1829, HP 1224); 30-A M.R.S. §§ 4364, 4364-A, 4364-B, 4364-C; 25 M.R.S.
    § 2463-B
  url: https://www.mainelegislature.org/LawMakerWeb/summary.asp?ID=280098944
  session: 132nd Legislature, First Special Session (2025)
  bill: LD 1829
  enacted_date: 2025-06-20
  effective_dates:
  - date: 2025-09-24
    applies_to: General effective date for nonemergency laws of the 132nd First Special Session (ADU sprinkler
      exemption, ADU definition and board training apply from here)
  - date: 2026-07-01
    applies_to: Rest of the act applies to municipalities whose officers can enact ordinances without
      a vote (§ 23)
  - date: 2027-07-01
    applies_to: Rest of the act applies to all other municipalities (§ 23); towns with a conflicting subdivision
      definition must comply by this date
  geographic_scope: 'All municipalities, areas where residential use is allowed: at least 3 units per
    lot (including ADUs), 4 in a designated growth area or with public water and sewer; caps on minimum
    lot size and density where public water and sewer serve the lot.'
  exclusions:
  - Shoreland zoning still applies (12 M.R.S. ch. 423-A)
  - Lots that reach 4 units under these sections get no further density increase unless the town allows
    it
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - 'Lot size: with public water and sewer, minimum lot at most 5,000 sq ft and density at most 1,250
    sq ft per unit for the first 4 units in a growth area (as enacted; LD 2173 of 2026 changed the outside-growth-area
    figures).'
  - Planning board approval may not be required for 4 or fewer units in one structure; owner occupancy
    may not be required for an ADU; ADUs need no sprinklers unless in or attached to a structure with
    more than 2 units.
  - Once a local plumbing inspector verifies wastewater compliance, the town may not ask for more wastewater
    review before the certificate of occupancy.
  - Affordable developments may exceed height limits by at least one storey or 14 feet (capped at 55
    feet by LD 2173).
  - The § 23 application dates shown are as amended by P.L. 2025, c. 733 (LD 2173); the enacted § 23 text
    has the same two dates.
