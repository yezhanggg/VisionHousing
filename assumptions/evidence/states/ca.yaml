  geographic_scope: 'Statewide. CEQA does not apply to housing projects that: are on sites of 20 acres
    or less (5 acres for builder''s-remedy projects); lie inside a city or a census urban area; are previously
    developed or mostly surrounded by urban uses; are consistent with the general plan and zoning; and
    reach at least half the housing-element default density.'
