  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - Mixed-use adaptive reuse qualifies only if at least 50% residential
  - Findings-based exception for 20+ unit projects narrows practical reach
