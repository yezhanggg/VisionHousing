  - date: 2026-07-01
    applies_to: Amended clear-and-objective review rule (ORS 197A.400) becomes operative
  geographic_scope: 'Statewide: for housing under clear and objective standards, local governments may
    notify only owners within 100 feet (500 feet for 20+ units), may not require a public hearing, and
    only the applicant may appeal. No building plan review is required for one- and two-unit homes whose
    plans are stamped by a certified engineer or architect. Middle housing land division rules are amended.'
  exclusions:
  - Central city plan areas and Metro regional centers in cities of 500,000+ and designated historic areas
    are outside the clear-and-objective rule
