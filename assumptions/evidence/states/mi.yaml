  caveats:
  - Conditions include at most four units and 4,000 sq ft per level, at most 125 ft of exit travel, no elevator
    opening into the stair, sprinklered stair, fire alarm and smoke detection, and a stair at least 48 in
    wide.
  - A building-code change, not zoning; it makes small apartment buildings on narrow lots easier to design
    where zoning already allows them.
