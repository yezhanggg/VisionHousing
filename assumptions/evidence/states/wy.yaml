# Cross-state comparison records: WY.
#
# One record per law, court decision, program or study. Format and checks:
# src/visionhousing/evidence/schema.py; method: docs/modules/evidence_states.md.
# verified: true only when the citation and every date were read on an official
# page on the retrieved date; otherwise verification_note says what is missing.
# Summaries are our own words. Context only: no number here enters a model run.
#
# A documented search of the Wyoming statutes, every bill title of the 2024,
# 2025 and 2026 sessions and the full text of every act enacted in those years
# (wyoleg.gov, 2026-11-26) found no statewide ADU, missing-middle,
# transit-oriented density, parking-minimum or development-fee reform; see
# assumptions/law/states/wy.yaml. The records below are the one enacted act
# that bears on permitting and the one fee bill that did not pass.

