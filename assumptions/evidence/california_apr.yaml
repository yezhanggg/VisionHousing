      are kept.
  - id: hcd_apr_table_a2
    citation: California Department of Housing and Community Development (via the California Open Data
      Portal), Housing Element Annual Progress Report (APR) data, Table A2 (entitled, permitted and completed
      units)
    url: https://data.ca.gov/dataset/81b0841f-2802-403e-b48e-2ef4b751f77c/resource/fe505d9b-8c36-42ba-ba30-08bc4f34e022/download/tablea2.csv
    licence: Portal listing states "No restrictions on public use" (rights field); licence field "not
      specified"; the state's open data handbook releases portal data in the public domain. Only aggregates
      are kept.
  - id: acs5_profile_tables
    citation: U.S. Census Bureau, American Community Survey 5-year tables for the place-profile charts
      (2020-2024)
    url: https://www2.census.gov/programs-surveys/acs/summary_file/2024/table-based-SF/data/5YRData/acsdt5y2024-b25024.dat
    licence: Public domain (U.S. government work)
  limits:
  - Self-reported by each city and county; HCD does not verify the reports. Missing or late reports lower
    counts; revisions change past years in later downloads.
  - Applications are joined to later stages by jurisdiction, parcel number and unit category. Applications
    that never join count as not reaching the stage, so reached shares are lower bounds; the share that
    ever joins is reported beside each figure.
  - Several projects on one parcel with the same unit category (for example two ADUs years apart) merge
    into one project.
  - Entitlement dates are reported only where a discretionary approval exists; ADUs and ministerial projects
    mostly have none.
  - Completion is a certificate of occupancy reported in the APR; some jurisdictions report it unevenly,
    so permit-to-completion shares are lower bounds.
  - The lot denominator is one-unit detached homes in one ACS period (2020-2024) for every year; unincorporated
    county areas get no place rate.
