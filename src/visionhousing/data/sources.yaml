  - id: fema_nfhl
    name: FEMA National Flood Hazard Layer (flood hazard zones and NFHL availability), public map service
    publisher: Federal Emergency Management Agency
    url_pattern: https://hazards.fema.gov/arcgis/rest/services/public/NFHL/MapServer/28
    vintage: The layer as read (FEMA updates it continuously; the read date is kept per county)
    geography: [polygon]
    licence: Public domain (U.S. government work); FEMA's map service is keyless
    terms_url: https://www.fema.gov/flood-maps/national-flood-hazard-layer
    parser: hazards.flood_zones
    limits: >-
      The Special Flood Hazard Area is the regulatory 1% annual chance floodplain; it leaves
      out flooding from heavy rain away from mapped streams, and some maps are decades old.
      Where FEMA has no digital map (outside layer 0, "NFHL availability") flood shares are
      left blank rather than zero.
    tier: 0
    access: feature_service
    cleaning: >-
      Polygons with SFHA_TF = 'T' touching each county's box, in Albers (EPSG:5070), thinned
      by the server to 5 m, burned onto a 30 m grid by cell centre; nothing is stored but
      counts and answer checksums.
    checked_on: 2026-11-24

