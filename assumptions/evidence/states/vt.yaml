  title: 'Vermont Community and Housing Infrastructure Program (CHIP): project-based tax increment financing
    for housing infrastructure'
  citation: 2025, No. 69 (Act 69 of 2025), S.127, CHIP provisions
  url: https://legislature.vermont.gov/bill/status/2026/S.127
  session: 2025-2026 biennium, 2025 session
  bill: S.127
  enacted_date: 2025-06-12
  effective_dates:
  - date: 2025-06-12
    applies_to: First of several effective dates of Act 69
  - date: 2035-12-31
    applies_to: Final deadline for CHIP tax increment financing applications
  geographic_scope: Any Vermont municipality that adopts a housing development plan, designates a housing
    development site, signs a housing infrastructure agreement, and gets VEPC approval.
  exclusions:
  - Development must devote at least 60% of floor area to housing or otherwise meaningfully serve CHIP's
    purpose
  - Must pass the but-for test
  implementation_status: practically_usable
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - VEPC may approve up to $200 million a year in total lifetime education-tax increment retention. Debt
    may be incurred for 5 years after the site is created, extendable by 3 years. Increment may be kept
    for up to 20 years from the first debt.
  - The ACCD page states retention of at least 85% of municipal increment, up to 75% of education increment
    for market-rate projects, and up to 85% for projects with at least 15% affordable units.
  - The ACCD page says CHIP 'launched on January 30th' but gives no year (probably 2026). It cites a $2
    billion investment potential by 2035, which is a program claim, not an outcome.
  - Codification (24 V.S.A. chapter 53) was not checked on the statutes site. No approved CHIP sites were
    found.
  retrieved: 2026-11-24
