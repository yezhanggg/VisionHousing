  caveats:
  - Complete by-right applications are deemed approved unless denied within 30 days, 60 days for plats,
    or 90 days for plats of more than 40 homes.
  - 'New single-family homes under 2,500 sq ft on their own lot: localities must allow a 3,000 sq ft minimum
    lot (with reasonable setbacks), the 2018 IRC, single-car garages and one side of architectural finish.'
  - Third-party review or inspection after 15 days applies only where the governing body adopts a resolution
    allowing it. Owner-initiated rezonings to single-family are exempt from protest petitions.
  - 'Effective date: Sec. 7 says the act takes effect on publication in the statute book. That date was not
    read on an official page, so none is recorded; Kansas statute-book acts usually take effect July 1.'
