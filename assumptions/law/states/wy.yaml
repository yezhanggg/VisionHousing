provisions:
  - provision_id: wy_adu_silent
    citation: "W.S. 15-1-601 and 18-5-201 (no accessory dwelling unit section)"
    section: "15-1-601"
    reform: adu
    status: enacted
    checked_on: 2026-11-24
    source_id: wy_statutes
    url: https://wyoleg.gov/statutes/compress/title15.pdf
    summary_own_words: >-
      Wyoming's zoning statutes do not mention accessory dwelling units. Whether
      one may be added to a single-family lot is left to each city, town and
      county zoning code.
    benchmark_gap: >-
      The whole benchmark is new at state level: no lot is opened to an ADU by
      state law. The share already legal comes from local codes, which are not
      read for Wyoming, so the national default range is used.
  - provision_id: wy_15_1_601_enabling
    citation: "W.S. 15-1-601 (city and town zoning powers)"
    section: "15-1-601"
    reform: missing_middle
    status: enacted
    checked_on: 2026-11-24
    source_id: wy_statutes
    url: https://wyoleg.gov/statutes/compress/title15.pdf
    summary_own_words: >-
      A city or town may regulate building height, size, lot coverage, yards,
      population density and land use, by districts, uniform within each
      district, in line with a comprehensive plan. The statute permits local
      rules; it does not require any district to allow more than one home.
    benchmark_gap: >-
      No state rule allows two to six homes on single-family lots; the
      benchmark would be new everywhere it applies.
  - provision_id: wy_15_1_603_protest
    citation: "W.S. 15-1-603 (zoning protest petition)"
    section: "15-1-603"
    reform: missing_middle
    status: enacted
    checked_on: 2026-11-24
    source_id: wy_statutes
    url: https://wyoleg.gov/statutes/compress/title15.pdf
    summary_own_words: >-
      If owners of 20% or more of the land in a proposed zoning change, or
      within 140 feet of it, protest, the change needs three-quarters of the
      whole city or town council. Bills to repeal or amend this failed in 2026.
    benchmark_gap: >-
      A higher bar for town-by-town upzoning; it does not apply to a state
      reform. Shown as context for how slowly local rules change without one.
  - provision_id: wy_18_5_201_county
    citation: "W.S. 18-5-201 with 18-5-303(a)(i) (county zoning; family land divisions)"
    section: "18-5-201"
    reform: missing_middle
    status: enacted
    checked_on: 2026-11-24
    source_id: wy_statutes
    url: https://wyoleg.gov/statutes/compress/title18.pdf
    summary_own_words: >-
      A county may zone its unincorporated land, but may not use a minimum lot
      size or other rule to stop a home or farm use on a land division that is
      exempt from subdivision review because it is a single gift or sale to an
      immediate family member.
    benchmark_gap: >-
      Narrow: it protects one home on a family land division, not more homes
      on an existing lot.
  - provision_id: wy_parking_fees_silent
    citation: "Wyoming statutes (no residential parking-minimum or development impact fee section)"
    section: "15-1-601"
    reform: fees
    status: enacted
    checked_on: 2026-11-24
    source_id: wy_statutes
    url: https://wyoleg.gov/statutes/compress/title15.pdf
    summary_own_words: >-
      No Wyoming statute sets, caps or forbids residential parking minimums,
      and none sets a framework for development impact fees; both are local
      choices where they exist.
    benchmark_gap: >-
      The parking and fee benchmarks would be new at state level.

# No dated records: no state provision that bears on the benchmark reforms has
# been enacted, so the law timeline has nothing to switch on for Wyoming.
records: []
