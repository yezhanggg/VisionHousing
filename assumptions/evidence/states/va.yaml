- id: va.ch895_2026_adu
  kind: policy
  state: VA
  jurisdiction: statewide
  policy_types:
  - adu
  - fees
  title: 'Virginia Acts 2026, ch. 895 (SB 531): ADUs a permitted accessory use in single-family zones'
  citation: Va. Acts 2026, ch. 895 (SB 531); Va. Code 15.2-2292.4 (enacted as 15.2-2292.3, renumbered
    in the Code)
  url: https://law.lis.virginia.gov/vacode/title15.2/chapter22/section15.2-2292.4/
  session: 2026 regular session
  bill: SB 531
  enacted_date: 2026-04-13
  effective_dates:
  - date: 2027-07-01
    applies_to: 'Va. Code 15.2-2292.4: single-family zoning districts deemed to allow one attached or detached
      ADU per lot as an accessory use; ADU permit fee capped at $500; setbacks no stricter than for the
      main house or accessory structures, whichever is less'
  geographic_scope: Single-family residential zoning districts in localities that had not adopted an ADU
    ordinance before January 1, 2026.
  exclusions:
  - Localities that adopted an ADU ordinance before January 1, 2026 are exempt
  - Private covenants, condominium, cooperative and property owners' association rules are not overridden
  - Localities may require 30-day minimum leases, dedicated parking or replacement of lost parking, owner
    occupancy of one unit at application, size limits no lower than 350 sq ft (lots under 2,500 sq ft)
    or 500 sq ft, a 500-foot distance limit, and no ADU on lots with more than one unit
  - ADUs may not be sold separately or subdivided
  implementation_status: enacted
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - The exemption for pre-2026 ordinances may leave many larger localities on their existing rules.
  - Localities may require dedicated parking for the ADU, so the law does not guarantee no added parking.
  - The $500 cap is on the ADU permit only; building, site and inspection fees still apply.
  retrieved: 2026-11-24
  verified: true
  verification_note: Chapter 895 text in the official LIS document store reads '[S 531] Approved April
    13, 2026' and clause 2 'shall become effective on July 1, 2027'. The Code of Virginia page for 15.2-2292.4
    (law.lis.virginia.gov) shows the section 'Effective July 1, 2027' with history '2026, c. 895'.
  sources:
