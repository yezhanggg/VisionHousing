  title: 'Idaho H 585 (2026): 48-business-hour inspection clock with third-party fallback for electrical,
    plumbing and HVAC'
  citation: Idaho Laws 2026, ch. 232 (H 585); Idaho Code 54-1004A, 54-2626A, 54-5020A
  url: https://legislature.idaho.gov/sessioninfo/2026/legislation/H0585/
  session: 2026 regular session (68th Legislature, 2nd regular session)
  bill: H 585
  enacted_date: 2026-03-31
  effective_dates:
  - date: 2026-07-01
    applies_to: Whole act
  geographic_scope: Statewide; electrical, plumbing and HVAC (mechanical) inspections by the state Division
    of Occupational and Professional Licenses or a local government
  exclusions:
  - Does not cover general building, zoning or plan-review timelines
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - If a requested inspection is not done within 48 business hours, the permit holder may hire a qualified
    third-party inspector and gets the inspection fee refunded. A 10% fee refund applies when a failed
    inspection is not explained within 3 business days.
  - Trade inspections, not permit approval; any effect on permit counts is indirect (shorter build time).
