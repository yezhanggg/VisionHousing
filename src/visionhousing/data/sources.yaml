  - id: nps_nrhp
    name: National Register of Historic Places, listed property points and polygons
    publisher: U.S. Department of the Interior, National Park Service
    url_pattern: https://mapservices.nps.gov/arcgis/rest/services/cultural_resources/nrhp_locations/MapServer/{layer}/query
    vintage: current (NPS cultural resources map service)
    geography: [point, polygon]
    licence: Public domain (U.S. government work)
    terms_url: https://www.nps.gov/subjects/nationalregister/data-downloads.htm
    parser: incentives.read_feature_page
    limits: >-
      Only properties NPS has mapped and does not restrict are shown, so counts are
      a floor. A district polygon's homes are 2020 Census block homes whose block
      centre is inside it. Listing makes income-producing rehabilitation eligible for
      the federal historic tax credit; it does not grant one.
    tier: 0
    access: feature_service
    cleaning: >-
      Keeps reference number, type, status and location of listed properties in the
      state. District polygons are simplified to about 10 metres.
    checked_on: 2026-11-22

  - id: fbi_cde_agency
    name: FBI Crime Data Explorer API, agency list and agency offense counts (summary reporting)
    publisher: U.S. Department of Justice, Federal Bureau of Investigation
    url_pattern: https://api.usa.gov/crime/fbi/cde/{path}
    vintage: calendar year 2024 (agency monthly offense counts)
    geography: [agency, county]
    licence: Public domain (U.S. government work); the API needs a free api.data.gov key
    terms_url: https://api.data.gov/docs/
    parser: safety.read_agency_offenses
    limits: >-
      Offenses known to police, as agencies report them; not victimization. Coverage
      depends on which agencies reported all twelve months. Pennsylvania moved to the
      incident-based system (NIBRS) around 2021, so counts before and after the
      change are not comparable. Agencies are placed in counties by the FBI's agency
      list; an agency serving several counties is counted in the first one. No tract
      figures.
    tier: 0
    access: api
    cleaning: >-
      Sums each local and State Police agency's monthly violent and property offenses
      for the year; keeps agencies that reported all twelve months; adds them by
      county with the populations they serve.
    notes: >-
      The key is read only from the API_DATA_GOV_KEY (or FBI_API_KEY) environment
      variable and never stored. Without it the safety table is left empty. Not
      confirmed live: no key was available when this entry was written; the reader
      follows the published API's shape and is checked by a real-data test that
      runs only when a key is set.
