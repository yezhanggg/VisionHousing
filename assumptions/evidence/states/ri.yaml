  title: 'Rhode Island H 7062 (2024): one ADU by right in three cases, uniform ADU standards'
  citation: R.I. Public Laws 2024, ch. 284 (H 7062 Sub A); R.I. Gen. Laws §§ 45-24-31, 45-24-37, 45-24-73
  url: https://webserver.rilegislature.gov/PublicLaws/law24/law24284.htm
  session: 2024 session
  bill: H 7062
  enacted_date: 2024-06-25
  effective_dates:
  - date: 2024-06-25
    applies_to: Whole act (effective upon passage)
  geographic_scope: 'All cities and towns. One ADU per lot by right: (1) on an owner-occupied property
    as an accommodation for family members with disabilities, (2) on a residential lot of 20,000 sq ft
    or more, or (3) inside the existing footprint of the home or an existing accessory structure.'
  exclusions:
  - Outside the three by-right cases, ADUs follow local rules (subject to the uniform standards)
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - 'Uniform standards: size caps must allow at least 900 sq ft or 60% of the main home (whichever is
    less); no more than one off-street parking space per ADU bedroom; fees no higher than for a new single-family
    home; up to two bedrooms; ADUs approved through an administrative building permit process.'
  - Read from the public law page's marked-up text; the companion Senate bill S 2998 is ch. 285.
  retrieved: 2026-11-24
  verified: true
  verification_note: The public law page (webserver.rilegislature.gov) shows 'Chapter 284 2024 -- H 7062
