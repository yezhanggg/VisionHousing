- id: fl.hb1389_2026_live_local_public_religious_land
  kind: policy
  state: FL
  jurisdiction: statewide
  policy_types:
  - commercial_land_housing
  title: 'Florida CS/CS/HB 1389 (2026): Live Local Act changes, including housing on public and religious-institution
    land'
  citation: Laws of Fla. ch. 2026-179 (CS/CS/HB 1389); amends ss. 125.01055 and 166.04151, F.S.
  url: https://flsenate.gov/Session/Bill/2026/1389
  session: 2026 regular session
  bill: HB 1389
  enacted_date: 2026-06-26
  effective_dates:
  - date: 2026-07-01
    applies_to: Whole act; tax-exemption changes first apply to the 2027 property tax roll; the parcel-assemblage
      rule expires 2030-07-01
  geographic_scope: All counties and municipalities. Multifamily and mixed-use residential must be allowed
    on county, municipal and school-district land (within that body's own boundaries) and on religious-institution
    parcels over 3 acres that have held a house of worship for the preceding 10 years, if at least 40%
    of the units are rentals affordable for 30 years or more and the owner is party to the application.
  exclusions:
  - Areas under pre-July 1, 2026 regulations meant to keep land open (open-space, park, rural and similar
    districts)
  - Areas of Critical State Concern
  - Land under a recorded conservation easement
  - Farms and farm operations are not 'commercial' or 'industrial' uses for the Act (retroactive to 2024-01-01)
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - Also bars local governments from capping height indirectly through setbacks or stepbacks, and lets
    a project assemble commonly owned parcels separated by up to 15 feet (until 2030-07-01).
  - The house of worship must stay on the religious-institution site after the housing is built.
  - Applicants with pre-July 1, 2026 applications could elect to proceed under the earlier Act.
  retrieved: 2026-11-24
  verified: true
  verification_note: flsenate.gov bill history shows the bill presented to the Governor on 2026-06-15,
    'Approved by Governor' entered 2026-06-26 and Chapter No. 2026-179 on 2026-06-29, effective date 7/1/2026.
    The House final bill analysis (flsenate.gov) confirms approval on 2026-06-26, ch. 2026-179, effective
    2026-07-01, and the scope and exclusions above.
