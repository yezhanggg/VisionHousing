  title: 'Kentucky HB 160 (2025): manufactured homes zoned like single-family homes'
  citation: 2025 Ky. Acts ch. 154 (HB 160); amends KRS 100.348
  url: https://apps.legislature.ky.gov/record/25rs/hb160.html
  session: 2025 regular session
  bill: HB 160
  enacted_date: 2025-04-01
  effective_dates:
  - date: 2026-07-01
    applies_to: Whole act (section 2 delayed effective date)
  geographic_scope: All local governments with zoning. Zoning may not treat a qualified manufactured home
    differently from a single-family home; only listed architectural compatibility standards may be applied,
    and the same standards must apply to site-built single-family homes.
  exclusions:
  - A qualified manufactured home must be installed within five years of manufacture, with transport
    parts removed, and meet KRS 227.570
  - Recorded deed restrictions, covenants and subdivision restrictions are not affected
  - Historic property and historic district rules are not limited
  implementation_status: legally_effective
  litigation:
    status: none_known
    note: ''
    citation: null
    url: null
  outcome_measure: null
  denominator: null
  horizon: null
  observed_result: null
  identification: not_applicable
  caveats:
  - Non-conforming local rules are void. A smaller manufactured home may be allowed where a larger one
    would not fit the lot.
  - It widens where factory-built homes can go; it does not change minimum lot sizes.
