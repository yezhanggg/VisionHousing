      assumptions/law/municipal_rules.yaml and the dated versions in
      assumptions/law/timeline.yaml. Link re-checked by script on 2026-11-25 (HTTP 200,
      file 2025-1545, enactment number 31, enactment date 10/27/2026).
    checked_on: 2026-11-25

