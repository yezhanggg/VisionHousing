# Policy implementation timeline (visionhousing.law.timeline).
#
# One record = one status of one provision, for one jurisdiction (state code,
# 5-digit county or 10-digit municipality code) or one mapped area inside it
# (area_id, a GeoJSON polygon), for one housing type, over one period.
#
# Status ladder: pending -> enacted -> legally_effective -> locally_implemented
# -> practically_usable; "stayed" pauses a rule (a court order). A pending or
# enacted-but-not-yet-effective rule leaves the baseline unchanged.
#
# Two kinds of date, so older runs reproduce:
#   start / end                 when the status held in law ("took effect")
#   verified_on / end_verified_on  when a person confirmed it from the source
# A run made as of an earlier date ignores records verified after it, and an
# end verified after it.
#
# review: verified records count; unverified ones (for example bill changes
# found automatically, visionhousing.law.timeline.bill_review_queue) count for
# nothing until a person checks them against the authoritative source.
#
# Unknown stays unknown: a date the source does not give is left empty. A
# verified record with an empty start must say start_unknown: true. Such a
# record counts only on or after its verified_on date (the first day a person
# saw it in force), never earlier: no start date is guessed, and no rule is
# made to look older than the evidence shows.

version: 1

