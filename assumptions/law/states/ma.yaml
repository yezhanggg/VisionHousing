# Massachusetts state law snapshot: the provisions that bear on the benchmark
# reforms, as rows the law layer can import.
#
# Two blocks:
#   provisions  one row per provision, in the layout of
#               assumptions/law/state_provisions.yaml (citation, reform,
#               status, our own summary);
#   records     one row per status of a provision over a period, in the layout
#               of assumptions/law/timeline.yaml (visionhousing.law.timeline:
#               load_timeline reads this file as it is).
#
# Every text was read on malegislature.gov on 2026-11-24 (registry sources
# ma_gl_40a and ma_acts_2024_c150) and re-read there on 2026-11-25 (checked_on
# of each provision): the section 1A ADU definition, the section 3 ADU
# paragraph, section 3A, St. 2024 c. 150 sections 7, 8 and 143 (approved
# August 6, 2024) and St. 2020 c. 358 section 18 (approved in part January 14,
# 2021) read as summarised below; no date changed. summary_own_words and scope are our own
# plain-language summaries, not quotations. Regulations and guidance on
# www.mass.gov (760 CMR 71 for ADUs, 760 CMR 72 for Section 3A) are listed as
# links only: that site refuses scripted requests.
#
# Not yet wired into a run: the law layer imports this file later. The
# Massachusetts already-legal ADU range the engine reads today is in
# assumptions/calibration/already_legal_ma.yaml.
#
# Per-town Section 3A districts are not listed here one by one: the pack table
# mbta_3a_districts holds every compliant district with its outline and
# submission date, and mbta_3a_status each town's status and deadline, so
# mapped-area records (like tests/fixtures/law/timeline_ma.yaml) can be made
# from them. The district's submission date is not its adoption or compliance
# date; that date is in HLC's letter, which could not be read by script.

