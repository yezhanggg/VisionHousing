    parser: infrastructure.fetch_cwns_county
    limits: >-
      Capital needs states documented for the survey (projects eligible for Clean Water State
      Revolving Fund loans), summarized by county by EPA. Context only: a large need is not a
      shortage of capacity, and a zero can mean nothing was submitted.
