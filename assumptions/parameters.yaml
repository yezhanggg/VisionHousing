        url: https://data.ca.gov/dataset/housing-element-annual-progress-report-apr-data-by-jurisdiction-and-year
        accessed: 2026-11-22
      - id: ev.adu.pew_national_2025
        citation: >-
          Evidence library entry ev.adu.pew_national_2025: The Pew Charitable Trusts
          (October 2026), "Accessory Dwelling Units Can Meaningfully Boost Housing Supply"
        url: https://www.pew.org/en/research-and-analysis/reports/2026/10/accessory-dwelling-units-can-meaningfully-boost-housing-supply  # secret-scan: allow (public web address)
        accessed: 2026-11-22
    rationale: >-
      The main behavioural parameter. About 1% a year of lots where an ADU fits
      and pays is consistent with the order of magnitude seen after reform:
      Seattle's permits rose to about 3.5 times the pre-reform rate (about 910 a
      year in 2022-2024), Massachusetts approved 1,224 ADUs in its first by-right
      year and 2,084 in eighteen months, and permissive cities outside California
      issued 26 permits per 100,000 residents in 2025. None of these is measured
      per feasible lot, so the range is not narrowed until job T2 fits it.
    used_by: [adu, pa_hb2186, pa_sb1346]
