  geographic_scope: 'All three counties and municipalities over 2,000 people that must adopt comprehensive
    plans. Counties must rezone to match the future land use map within 12 months of plan adoption (was
    18). Local affordable housing plans become part of comprehensive plans, aiming at 20% of homes affordable.'
  exclusions:
  - A jurisdiction adopting its next comprehensive plan before February 1, 2027 need not adopt its first
    affordable housing plan until its next 5-year review
  - Planning-board review of by-right applications is allowed if limited to objective standards; Board
    of Adjustment appeal hearings are unchanged
  implementation_status: legally_effective
