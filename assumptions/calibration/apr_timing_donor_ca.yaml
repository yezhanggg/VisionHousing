  limits:
  - Self-reported by each city and county; HCD does not verify the reports. Missing or late reports lower
    counts; revisions change past years in later downloads.
  - Applications are joined to later stages by jurisdiction, parcel number and unit category. Applications
    that never join count as not reaching the stage, so reached shares are lower bounds; the share that
    ever joins is reported beside each figure.
  - Several projects on one parcel with the same unit category (for example two ADUs years apart) merge
    into one project.
  - Entitlement dates are reported only where a discretionary approval exists; ADUs and ministerial projects
    mostly have none.
  - Completion is a certificate of occupancy reported in the APR; some jurisdictions report it unevenly,
    so permit-to-completion shares are lower bounds.
  - The lot denominator is one-unit detached homes in one ACS period (2020-2024) for every year; unincorporated
    county areas get no place rate.
