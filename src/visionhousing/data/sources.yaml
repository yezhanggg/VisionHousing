  - id: hud_chas
    name: Comprehensive Housing Affordability Strategy (CHAS) data, Tables 8, 12 and 15C
    publisher: U.S. Department of Housing and Urban Development, Office of Policy Development and Research (special tabulation of ACS data by the Census Bureau)
    url_pattern: https://www.huduser.gov/PORTAL/datasets/cp/{vintage}-{sumlevel}-csv.zip
    vintage: 2018-2022 (ACS 2018-2022 5-year estimates; HUD release of 2025-12-23)
    geography: [state, county, tract]
    licence: Public domain (U.S. government work)
    terms_url: https://www.huduser.gov/portal/datasets/cp.html
    expected_size: null
    parser: affordability.read_chas_table
    limits: >-
      Survey estimates averaged over five years, rounded by the Census Bureau, with
      margins of error; small tract cells are very uncertain. Income bands are shares
      of HUD area median family income (HAMFI) for the household's area, not of a
      county's own median. Cost burden is housing costs (gross rent, or owner costs)
      over household income; households with no or negative income are "not
      computed". The edition is older than the ACS 2020-2024 tables used elsewhere.
    tier: 0
    access: range
    member: "{sumlevel}/Table{table}.csv"
    cleaning: >-
      Tables 8, 12 and 15C are read out of the national zips for the state (040),
      county (050) and tract (140) levels with HTTP range requests; only the state's
      rows and the subtotal cells named in visionhousing.data.sources.affordability
      are kept, with their margins. Tract rows keep fewer cells and no margins.
    checked_on: 2026-11-24
    notes: >-
      HUD's file server answers clients that do not name themselves in the common
      "Mozilla/5.0 (compatible; ...)" form with an empty 202 page; the fetcher names
      itself as visionhousing in that form. Cell meanings were checked against
      HUD's data dictionary (CHAS-data-dictionary-18-22.xlsx).

