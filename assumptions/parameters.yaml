  # ---------------------------------------------------------------- baseline (rule candidates and backtest)

  baseline.long_window_years:
    label: "Years in the long-average baseline rule and the trend fit"
    unit: "years"
    central: 10
    low: 10
    high: 10
    shape: fixed
    kind: judgement
    source: []
    rationale: >-
      The second candidate rule averages the last ten years, which spans most of
      a housing cycle. The damped-trend rule fits its straight line over the same
      ten years, and every backtest origin needs this much history so all rules
      are scored on the same cases.
    used_by: [baseline]
    revisit: "Review after the rolling-origin backtest on all U.S. counties (job T1)."
    status: draft

  baseline.ewm_alpha:
    label: "Weight on the latest year in the exponentially weighted mean"
    unit: "share"
    central: 0.3
    low: 0.1
    high: 0.6
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      Each year back gets (1 - alpha) times the weight of the year after it. At
      0.3 the latest year carries about 30% of the weight and the last five years
      about 83%; the range runs from nearly a long average to nearly the last two
      years.
    used_by: [baseline]
    revisit: "Set by the rolling-origin backtest (job T1)."
    status: draft

  baseline.size_classes:
    label: "Number of county size classes for the baseline interval"
    unit: "classes"
    central: 3
    low: 3
    high: 3
    shape: fixed
    kind: judgement
    source: []
    rationale: >-
      Counties are split into terciles (small, medium, large) by their average
      yearly permits over the recent window. Small counties have larger
      proportional errors, so each class gets its own error distribution; three
      classes keep enough backtest cases in each.
    used_by: [baseline]
    revisit: "Revisit if a class has too few backtest cases in a state with few counties."
    status: draft

  baseline.selection_tolerance:
    label: "Tolerance for choosing a simpler baseline rule"
    unit: "share"
    central: 0.05
    low: 0.0
    high: 0.15
    shape: pert
    kind: judgement
    source: []
    rationale: >-
      The simplest candidate rule is chosen if its median absolute log error is
      within this share of the best rule's (5% means at most 1.05 times the best).
      Simple rules are easier to explain and rarely lose much skill.
    used_by: [baseline]
    revisit: "Review once the skill table for all U.S. counties is published."
    status: draft

