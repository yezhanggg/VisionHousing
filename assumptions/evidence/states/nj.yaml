  title: New Jersey Fair Housing Act amendments for the fourth round (P.L.2024, c.2)
  citation: P.L.2024, c.2 (A4 2R / S50); C.52:27D-304.1 et al.
  url: https://pub.njleg.gov/Bills/2024/PL24/2_.HTM
